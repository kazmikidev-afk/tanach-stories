{id:1,title:"בראשית: מבריאה ועד בבל",book:"בראשית",chapters:"א–יא",status:"ready",stories:[
{id:"1-1",n:1,title:"בריאת העולם בשישה ימים",book:"בראשית",chapters:"א–ב",ages:[5,11,13],holiday:"שבת",topics:["בריאה","שבת","שבעת ימי בראשית"],characters:["אלוהים","אדם","חוה"],summary:"איך נברא העולם בשישה ימים, ולמה דווקא ביום השביעי נחים",
body:["בהתחלה, לפני הכול, לא היה שום דבר. לא שמים, לא ארץ, לא אור. רק חושך גדול ושקט. ואז אלוהים אמר: \"יהי אור!\" - ואור נפתח בעולם. אלוהים הפריד בין האור לחושך: לאור קרא יום, ולחושך קרא לילה. זה היה היום הראשון.","ביום השני אלוהים עשה את הרקיע - הכיפה הכחולה הענקית שמעלינו, השמים. ביום השלישי הוא אסף את המים למקום אחד, ונראתה היבשה. למים קרא ימים, ועל היבשה צמחו עשבים, פרחים ועצים מלאים בפרי.","ביום הרביעי אלוהים שם בשמים את השמש, שמאירה ביום, ואת הירח והכוכבים, שמנצנצים בלילה. ביום החמישי נולדו הדגים ששוחים בים והציפורים שעפות בשמים.","וביום השישי - החיות: אריות וג'ירפות, פילים וצבים, חיות גדולות וקטנות. ואז אלוהים ברא את האדם, איש ואישה, ואמר להם: העולם הזה שלכם. שמרו עליו וטפלו בו.","אלוהים ראה את כל אשר עשה - והנה, טוב מאוד. וביום השביעי הוא שבת ונח. לכן גם אנחנו, בכל שבת, עוצרים, נחים, מסתכלים על העולם ואומרים: איזה יופי של עולם יש לנו."],
rashi:[{ref:"בראשית א, א",quote:"אמר רבי יצחק: ומה טעם פתח בבראשית? משום כח מעשיו הגיד לעמו לתת להם נחלת גוים - כל הארץ של הקב\"ה היא, הוא בראה ונתנה לאשר ישר בעיניו, ברצונו נתנה להם, וברצונו נטלה מהם ונתנה לנו.",explain:"רש\"י פותח את כל התנ\"ך בשאלה: למה בכלל מתחילים מהבריאה? והתשובה - כדי שנדע שהעולם כולו של אלוהים. הוא ברא אותו, הוא נתן אותו לנו, ולכן הוא גם מתנה שצריך לשמור עליה."}],
lesson:"משל: תארו שקיבלתם חדר משלכם, חדש ויפה. אחרי שבוע הוא כבר מלא בגדים על הרצפה? נמשל: העולם הוא החדר שקיבלנו כולנו במתנה. אלוהים ברא אותו \"טוב מאוד\" - והתפקיד שלנו הוא לשמור שהוא יישאר ככה."},
{id:"1-2",n:2,title:"אדם וחוה ועץ הדעת",book:"בראשית",chapters:"ב–ג",ages:[5,11,13],holiday:"",topics:["גן עדן","בחירה","אחריות"],characters:["אדם","חוה","הנחש"],summary:"הגן היפה בעולם, פרי אחד אסור, ובחירה ששינתה הכול",
body:["את האדם הראשון שם אלוהים בגן היפה בעולם - גן עדן. בגן גדלו עצים מלאים בפרי מתוק, ונהר זרם והשקה את הכול. אלוהים אמר לאדם: מכל עצי הגן תוכל לאכול, אבל מעץ אחד, עץ הדעת, אל תאכל.","אלוהים ראה שהאדם לבדו, וזה לא טוב. הוא הביא אליו את כל החיות, והאדם נתן לכל אחת שם: לסוס קרא סוס, לכלב קרא כלב. אבל חבר באמת עדיין לא היה לו. אז אלוהים הרדים את האדם, ומצלעו בנה את חוה - האישה הראשונה. יחד הם חיו בגן בשלום, בלי פחד ובלי בושה.","יום אחד בא הנחש, הערמומי מכל החיות, ואמר לחוה: למה שלא תטעמי מהעץ היפה הזה? מי שאוכל ממנו ידע הכול, כמו אלוהים. חוה הסתכלה על הפרי. הוא נראה כל כך טעים. היא טעמה - וגם אדם טעם.","ואז, פתאום, הכול השתנה. הם הבינו שהם עירומים והתביישו, ומיהרו להתחבא. כשאלוהים קרא: איכה? איפה אתה? - הם יצאו מהמחבוא. אדם אמר: חוה נתנה לי. וחוה אמרה: הנחש אמר לי. כולם האשימו מישהו אחר.","מפני שלא שמעו לדברי אלוהים, אדם וחוה נאלצו לצאת מגן עדן. זה עצוב, אבל זה לא סוף הסיפור: אלוהים עשה להם בגדים שיחממו אותם, והם יצאו לעולם הגדול לבנות בית, משפחה וחיים. ומאז, בכל פעם שאנחנו צריכים לבחור בין מה שקל ומה שנכון - הסיפור הזה מלווה אותנו."],
lesson:"משל: ילד שובר כוס, וכשאמא שואלת הוא אומר \"החתול!\". נמשל: אדם וחוה האשימו זה את זה במקום להודות. כולם טועים - השאלה היא אם אנחנו לוקחים אחריות ואומרים \"אני עשיתי, ואני אתקן\". זה הרבה יותר חזק מלהאשים."},
{id:"1-3",n:3,title:"קין והבל",book:"בראשית",chapters:"ד",ages:[11,13],holiday:"",topics:["קנאה","כעס","אחים","אחריות"],characters:["קין","הבל","אלוהים"],summary:"שני אחים, שתי מתנות, וקנאה שיצאה משליטה",
note:"הסיפור עוסק בפגיעה קשה בתוך המשפחה. מומלץ לגילאי 11 ו-13, ולדבר עליו אחרי הקריאה.",
body:["לאדם וחוה נולדו שני בנים: קין הבכור, שעבד את האדמה וגידל תבואה, והבל הצעיר, שהיה רועה צאן.","יום אחד הביאו שניהם מתנה לאלוהים. הבל הביא מטוב כבשיו, מכל הלב. קין הביא מפירות האדמה. אלוהים שמח במתנה של הבל, ובמתנה של קין שמח פחות.","קין קינא. הלב שלו נעשה כבד וכועס. ואז אלוהים אמר לו משפט שכדאי לזכור לכל החיים: אם תיטיב, טוב לך. ואם לא - החטא מחכה בפתח כמו חיה, אבל אתה יכול לשלוט בו. כלומר: הכעס הוא שלך, ואתה מחליט מה לעשות איתו.","אבל קין לא עצר. הוא לקח את אחיו לשדה, ושם עשה מעשה נורא: הוא פגע באחיו, והבל לא קם עוד.","אלוהים שאל את קין: איפה הבל אחיך? וקין ענה: השומר אחי אנוכי? כאילו זה בכלל לא העניין שלו. אבל אלוהים ידע הכול: קול דמי אחיך צועקים אלי מן האדמה.","קין נענש: הוא נד ונדנד בעולם בלי בית קבוע. ועם זאת, אלוהים שם עליו אות שאיש לא יפגע בו - כי גם כשמישהו עושה דבר נורא, החיים עצמם קדושים.","ומה לומדים מזה? שקנאה היא רגש שכולם מכירים. השאלה היא לא אם נכעס, אלא מה נעשה עם הכעס. ועל השאלה השומר אחי אנוכי? התשובה האמיתית היא: כן. אנחנו שומרים זה על זה."],lesson:"משל: יוסי הפסיד במשחק כדורגל והרגיש רתיחה בבטן - רצה לדחוף את החבר שהבקיע. במקום זה הוא לקח נשימה עמוקה, ספר עד עשר, ובחר ללחוץ יד. נמשל: אלוהים אומר לקין, ולכל אחד מאיתנו, שהכעס והקנאה כמו חיה שמרובצת לפתח - אבל אנחנו יכולים לשלוט בה. הרגע הכי חשוב הוא לפני המעשה, שם עוד אפשר לבחור אחרת.",rashi:[{ref:"בראשית ד, ז",quote:"ואתה תמשל בו - אם תרצה תתגבר עליו.",explain:"רש״י מסביר שהיצר הרע תמיד מחכה לנו בפתח ומנסה להכשיל אותנו - אבל אלוהים נתן לנו את הכוח להתגבר עליו. הבחירה תמיד בידיים שלנו."}]},
{id:"1-4",n:4,title:"נוח והמבול",book:"בראשית",chapters:"ו–ט",ages:[5,11,13],holiday:"פרשת נוח",topics:["מבול","תיבה","קשת","ברית"],characters:["נוח","היונה","החיות"],summary:"ספינה ענקית, חיות זוגות זוגות, וקשת של תקווה",
body:["הדור של נוח היה דור קשה: אנשים רימו, גנבו ופגעו זה בזה. אלוהים נעצב מאוד ממה שקרה לעולם, והחליט לשטוף את הארץ במבול גדול - ולהתחיל מחדש.","אדם אחד היה שונה: נוח. צדיק תמים היה בדורותיו. אלוהים אמר לו: בנה תיבה ענקית מעץ, ספינה שתצוף על המים, כי אני מביא מבול על הארץ.","נוח בנה. שנים ארוכות הוא ניסר ופטיש, בזמן שהשכנים צחקו: ספינה? באמצע היבשה? אבל נוח המשיך.","ואז באו החיות: זוגות זוגות, זכר ונקבה - פילים ונמלים, ציפורים וצבים, ג'ירפות וארנבות. כולם עלו לתיבה. נוח, אשתו, בניו ונשותיהם נכנסו, ואלוהים סגר בעדם את הדלת.","ארבעים יום וארבעים לילה ירד גשם. המים עלו וכיסו הכול, גם את ההרים הגבוהים. רק התיבה צפה על פני המים - עולם קטן ושלם בתוך הסערה.","כשהגשם נח, נוח שלח עורב, ואחריו יונה. בפעם הראשונה היא חזרה: אין עוד מקום לנוח עליו. בפעם השנייה היא חזרה עם עלה זית במקורה - סימן שהמים ירדו! ובפעם השלישית היא לא חזרה - היא מצאה בית.","נוח ומשפחתו יצאו לארץ יבשה, ואיתם כל החיות. אלוהים שם בענן קשת צבעונית ואמר: זו הברית שלי - לעולם לא אשמיד שוב את כל החי במבול. הקשת תזכיר לי, וגם לכם. ועד היום, כשרואים קשת בענן, אפשר לזכור: אחרי כל סערה באה תקווה."],
rashi:[{ref:"בראשית ו, ט",quote:"בדורותיו - יש מרבותינו דורשים אותו לשבח, כל שכן אלו היה בדור צדיקים היה צדיק יותר; ויש שדורשים אותו לגנאי, לפי דורו היה צדיק ואלו היה בדורו של אברהם לא היה נחשב לכלום.",explain:"רש\"י מביא שתי דעות: הייתה לנוח קל להיות צדיק כי כולם היו רעים, או דווקא קשה מאוד? בכל מקרה - נוח נשאר טוב גם כשכולם סביבו לא. זה קשה, וזה בדיוק מה שמיוחד בו."}],
lesson:"משל: בכיתה כולם צחקו על ילד אחד, ורק ילד אחד לא הצטרף. נמשל: נוח היה הילד ההוא. להיות צדיק כשכולם צדיקים - קל. להיות צדיק כשכולם סביבך מתנהגים רע - זה אומץ אמיתי."},
{id:"1-5",n:5,title:"מגדל בבל",book:"בראשית",chapters:"יא",ages:[5,11,13],holiday:"",topics:["מגדל בבל","שפות","גאווה"],characters:["בני האדם","אלוהים"],summary:"מגדל עד השמיים, ואיך נולדו השפות של העולם",
body:["אחרי המבול, כשמשפחת נוח גדלה והפכה לעמים, כל בני האדם דיברו שפה אחת והבינו זה את זה.","הם התיישבו בעמק בארץ שינער, ויום אחד אמרו: הבה נבנה לנו עיר, ומגדל שראשו בשמים! נעשה לנו שם מפורסם, ואיש לא יפזר אותנו.","הם אפו לבנים באש, הכינו חומר, ובנו. המגדל עלה קומה מעל קומה. הם היו גאים מאוד בעצמם - אולי קצת יותר מדי.","אלוהים ירד לראות את העיר ואת המגדל. הבעיה לא הייתה הבנייה עצמה, אלא שהבונים חשבו רק על התהילה שלהם - נעשה לנו שם - ולא על לעשות טוב בעולם.","אז אלוהים עשה דבר מפתיע: הוא בלבל את שפתם. פתאום בנאי אחד צועק תביא לבנה! והשני שומע מים! אחד מבקש חבל - והשני מביא חמור. אי אפשר היה להמשיך לבנות ככה.","הבנייה נעצרה, והאנשים התפזרו על פני כל הארץ, כל קבוצה עם השפה שלה. לכן העיר נקראה בבל - כי שם בלל אלוהים את שפת כל הארץ.","ואולי יש כאן גם בשורה: מאז יש בעולם שפות רבות, וכדי באמת להבין זה את זה, אנחנו צריכים להקשיב קצת יותר."],lesson:"משל: כיתה שכל ילד בה דיבר בשפה אחרת - אי אפשר היה אפילו לשחק יחד בהפסקה. נמשל: בוני מגדל בבל רצו רק להתפרסם, ולכן כשהשפה התבלבלה הכול קרס. כשרוצים רק כבוד לעצמנו, אפילו שפה משותפת לא מספיקה. אבל כשבאמת מקשיבים זה לזה - אפשר לבנות יחד דברים נפלאים."}
]},
{id:2,title:"האבות: אברהם ויצחק",book:"בראשית",chapters:"יב–כז",status:"ready",stories:[
{id:"2-1",n:6,title:"לך לך - אברהם יוצא לארץ",book:"בראשית",chapters:"יב",ages:[5,11,13],holiday:"",topics:["לך לך","אברהם","הבטחה","אמונה","התחלה"],characters:["אברם","שרי","לוט"],summary:"אברם עוזב הכול בגיל 75 ויוצא לארץ שלא ראה מימיו",
body:["אברם היה בן שבעים וחמש, וגר בחרן. יום אחד אמר לו אלוהים משפט ששינה את ההיסטוריה: לך לך מארצך, וממולדתך, ומבית אביך - אל הארץ אשר אראך.","לא פשוט לעזוב. ארץ, חברים, משפחה, הבית שמכירים. אבל אלוהים הבטיח: אעשך לגוי גדול, אברכך, ואגדל שמך - והיית לך לברכה.","אברם סמך. הוא לקח את שרי אשתו, את לוט אחיינו, את כל הרכוש ואת כל האנשים שהצטרפו אליו בחרן - ויצא לדרך ארוכה, לארץ כנען. בלי מפה, בלי GPS - עם הבטחה.","הם עברו את הארץ עד שכם. שם נראה אליו אלוהים ואמר: לזרעך אתן את הארץ הזאת. אברם בנה שם מזבח לאלוהים.","משם המשיך אברם להר, מזרחית לבית אל, ובנה עוד מזבח וקרא בשם ה'. לאט לאט הוא למד שגם הדרך עצמה היא חלק מההבטחה: כל עצירה יכולה להפוך למקום של תודה."],
rashi:[{ref:"בראשית יב, א",quote:"לך לך - להנאתך ולטובתך, שם אעשך לגוי גדול, כאן אי אתה זוכה לבנים.",explain:"רש\"י שם לב שאלוהים אומר לאברהם לך לך - לך, בשבילך. היציאה מהמקום הנוח נראית כמו הפסד, אבל היא דווקא להנאתך ולטובתך. לפעמים הצעד הקשה הוא בדיוק מה שטוב לנו."}],
lesson:"משל: ילד שעובר לכיתה חדשה ומפחד לעזוב את החברים - ובסוף מוצא שם את החבר הכי טוב. נמשל: אברהם לימד אותנו שהתחלות חדשות מפחידות, אבל לפעמים דווקא הצעד אל הלא נודע, כשעושים אותו באמונה וביושר, הוא מה שמביא את הברכה."},
{id:"2-2",n:7,title:"שלושת האורחים אצל אברהם",book:"בראשית",chapters:"יח",ages:[5,11,13],holiday:"",topics:["הכנסת אורחים","אברהם","שרה","חסד"],characters:["אברהם","שרה","שלושה מלאכים"],summary:"ביום חם, אברהם החולה רץ לקראת שלושה עוברי אורח",
body:["היה יום חם מאוד, באלוני ממרא. אברהם ישב בפתח האוהל - ורק שלושה ימים קודם עבר את ברית המילה, ועוד היה חלש.","פתאום הוא רואה שלושה אנשים עוברים. למרות החום והחולשה, אברהם רץ לקראתם, משתחווה ואומר: בבקשה, אל תעברו! נביא מעט מים, נרחץ רגליכם, ואקח פת לחם.","והוא לא מסתפק בלחם: הוא ממהר לאוהל אל שרה - מהרי, לושי ועשי עוגות! הוא רץ אל הבקר, בוחר בן בקר רך וטוב, ומגיש לאורחים חמאה, חלב ובשר.","האורחים אוכלים, ואחד מהם אומר: בעוד שנה בדיוק, בזמן הזה - יהיה לשרה בן. שרה, כבר קשישה, שומעת מאחורי דלת האוהל וצוחקת בלבה: בן? בגיל שלנו?","אבל אלוהים אומר: היפלא מה' דבר? - האם יש דבר שקשה על אלוהים? האורחים האלה היו מלאכים, והבשורה התקיימה: שנה אחר כך נולד יצחק."],
rashi:[{ref:"בראשית יח, א",quote:"וירא אליו ה' - לבקר את החולה. אמר רבי חמא בר חנינא, יום שלישי למילתו היה, ובא הקב\"ה ושאל בשלומו.",explain:"רש\"י מספר שאברהם היה חולה בדיוק באותו יום - ואלוהים עצמו בא לבקר אותו. ומה עשה אברהם החולה כשעברו אורחים? קם ורץ לקראתם. אם ככה מתנהגים לאורחים כשקשה לנו - ביקור חולים ואירוח הם מהמצוות הכי גדולות."},{ref:"בראשית יח, ז",quote:"בן בקר רך וטוב - ג' פרים היו, כדי להאכילן ג' לשונות בחרדל.",explain:"רש\"י מראה עד כמה אברהם השקיע: לא בשר כלשהו, אלא מנה מיוחדת לכל אורח. אירוח אמיתי זה לתת לאורח את הכי טוב שיש לך, לא את השאריות."}],
lesson:"משל: אורחים באו בדיוק כשיש לנו מבחן מחר ואין כוח לאף אחד. נמשל: אברהם לימד שהכנסת אורחים אמיתית נמדדת דווקא כשלא נוח לנו. לפתוח את הדלת ואת הלב - גם ביום חם, גם כשקשה - זה מה שעושה בית לבית של אברהם אבינו."},
{id:"2-3",n:8,title:"עקידת יצחק",book:"בראשית",chapters:"כב",ages:[11,13],holiday:"ראש השנה",topics:["עקידה","נסיון","אמונה","מסירות"],characters:["אברהם","יצחק","המלאך"],summary:"הנסיון הקשה מכולם - והמלאך שעוצר בו",
note:"סיפור עוצמתי וקשה. מומלץ לגילאי 11 ו-13, ולשיחה עם הורה אחרי הקריאה.",
body:["אחרי שנים של המתנה להבטחה, נולד יצחק - הבן המיוחל. ואז בא הנסיון הקשה מכולם: אלוהים ניסה את אברהם ואמר: קח נא את בנך, את יחידך, אשר אהבת, את יצחק, ולך אל ארץ המוריה.","אברהם קם בבוקר מחרת מוקדם. הוא חמש את החמור, לקח את יצחק ושני נערים, ובקע עצי עלה. שלושה ימים הלכו, וביום השלישי ראה אברהם את המקום מרחוק.","יצחק נשא את העצים, ואברהם נשא את האש ואת המאכלת. ובדרך שאל יצחק שאלה ששוברת את הלב: אבי? הנה האש והעצים - ואיה השה לעולה? ואברהם ענה: אלוהים יראה לו השה, בני. וילכו שניהם יחדיו.","על ההר אברהם בנה מזבח, ערך את העצים ועקד את יצחק. וברגע שהושיט את ידו - נשמע קול מהשמים: אברהם! אברהם! אל תשלח ידך אל הנער! כי עתה ידעתי כי יראה אלוהים אתה.","אברהם הרים את עיניו - והנה איל נתפס בקרניו בסבך. הוא הקריב את האיל במקום בנו, וקרא למקום ההוא ה' יראה.","ואז באה הברכה: ברך אברכך, והרבה ארבה את זרעך ככוכבי השמים וכחול אשר על שפת הים - עקב אשר שמעת בקולי."],
rashi:[{ref:"בראשית כב, ב",quote:"קח נא - אין נא אלא לשון בקשה, אמר לו בבקשה ממך, עמד לי בזה הנסיון, שלא יאמרו הראשונות לא היה בהן ממש.",explain:"רש\"י שם לב למילה הקטנה נא: אלוהים לא ציווה בכוח, הוא ביקש. גם במבחן הכי קשה, היחס הוא של בקשה ולא של כפייה - ככה מדברים עם מישהו שאוהבים."},{ref:"בראשית כב, יב",quote:"מוצא שפתי לא אשנה - לא אמרתי לך שחטהו אלא העלהו, אסקתיה, אחתיה.",explain:"רש\"י מדגיש: אלוהים מעולם לא התכוון שיפגעו ביצחק. הוא ביקש להעלות אותו על ההר - לא לפגוע בו. הנסיון היה במסירות, והמלאך עצר לפני כל פגיעה."}],
lesson:"משל ונמשל: מאמן שואל את השחקן \"אתה מוכן למסור הכול בשביל הקבוצה?\" - אבל הוא בודק את הלב, לא באמת מסכן אותו. הנמשל: אלוהים בדק את אברהם עד הסוף - אבל שם הקו האדום הכי חשוב בתנ\"ך: אלוהים לא רוצה שיפגעו בבני אדם, לעולם. גם כשהמסירות גדולה - החיים של אדם הם מעל הכול."},
{id:"2-4",n:9,title:"רבקה בבאר",book:"בראשית",chapters:"כד",ages:[5,11,13],holiday:"",topics:["רבקה","חסד","בחירת אשה","באר"],characters:["רבקה","עבד אברהם","יצחק"],summary:"מבחן החסד ליד הבאר - ומי שעברה אותו בגדול",
body:["אברהם הזקין, ורצה למצוא אשה ליצחק בנו. הוא קרא לעבדו הזקן, הממונה על כל אשר לו, ואמר: לך אל משפחתי הרחוקה בארם נהרים, ומשם תביא אשה ליצחק - לא מבנות כנען.","העבד לקח עשרה גמלים ומתנות ונסע. בערב, ליד באר המים, הוא התפלל: ה', הנערה שתאמר לי שתה, וגם גמליך אשקה - היא תהיה הנכונה. כי מי שמתנדבת לעזור מעבר למה שמבקשים - יש לה לב של חסד.","ועוד הוא מדבר - והנה רבקה יוצאת עם כדה על שכמה, נערה ממשפחת אברהם. העבד רץ לקראתה: הגמיאיני נא מעט מים מכדך.","רבקה אמרה: שתה, אדוני - וגם לגמליך אשאב עד אם כלו לשתות. עשרה גמלים צמאים! זו עבודה קשה של הרבה פעמים הלוך ושוב לבאר - ורבקה עשתה הכול, בריצה ובשמחה.","העבד נתן לה נזם זהב וצמידים, וכששמע שהיא ממשפחת אברהם - השתחוה לה'. הוא סיפר הכול למשפחתה, ובסוף שאלו את רבקה עצמה: התלכי עם האיש הזה? והיא ענתה מילה אחת אמיצה: אלך.","בערב, יצחק יצא לשוח בשדה. הוא ראה גמלים מתקרבים; רבקה ראתה אותו וירדה מעל הגמל. יצחק הביא אותה לאוהל שרה אמו, ואהב את רבקה - וננחם אחרי אמו."],
rashi:[{ref:"בראשית כד, יז",quote:"וירץ העבד לקראתה - לפי שראה שעלו המים לקראתה.",explain:"רש\"י מספר שהמים עלו לקראת רבקה - סימן קטן מן השמים שהיא מיוחדת. אבל שימו לב: הבחירה בה לא נפלה על נס - אלא על החסד שלה, על מה שהיא עשתה בידיים שלה."}],
lesson:"משל: מישהו מבקש מכם כוס מים, ואתם מביאים גם מגש עם עוגיות. נמשל: רבקה לא חיכתה שיבקשו ממנה הרבה - היא ראתה צורך והציעה מעבר. החסד הכי אמיתי הוא זה שעושים בלי שמבקשים, ובשמחה. ככה בונים משפחה."},
{id:"2-5",n:10,title:"יעקב ועשו - הנזיד והבכורה",book:"בראשית",chapters:"כה–כז",ages:[5,11,13],holiday:"",topics:["יעקב","עשו","בכורה","אחים","רמיה"],characters:["יעקב","עשו","יצחק","רבקה"],summary:"תאומים שונים, נזיד עדשים, וברכה שהוחלפה",
body:["ליצחק ורבקה נולדו תאומים: עשו הבכור - אדמוני ושעיר, צייד אמיץ שאוהב את השדה; ויעקב - איש תם יושב אוהלים, שקט, לומד. יצחק אהב את עשו, ורבקה אהבה את יעקב.","יום אחד חזר עשו מהשדה עייף ורעב, ויעקב בישל נזיד עדשים אדום וטעים. הלעיטני נא! צעק עשו. ויעקב ענה: מכור היום את בכורתך לי.","עשו חשב רק על הרגע: הנה אני הולך למות מרעב - למה לי בכורה? ומכר את הבכורה בנזיד עדשים. אכל, שתה, קם וילך - ויבז עשו את הבכורה.","שנים עברו. יצחק הזקין ועיניו כהו מראות. הוא קרא לעשו: צא לצוד לי ציד ועשה לי מטעמים, ואברכך לפני מותי. רבקה שמעה - ופעלה: היא לבשה את יעקב בבגדי עשו, כיסתה את ידיו וצווארו בעורות גדיים, ושלחה אותו אל אביו.","יצחק נבוך: הקל קול יעקב, והידים ידי עשו. הוא ברך את יעקב בטל השמים ובשמני הארץ. ואז נכנס עשו מהציד, הבין מה קרה - וצעק צעקה גדולה ומרה: ברכני גם אני, אבי!","אבל הברכה כבר ניתנה. עשו שנא את יעקב ורצח בלבו לפגוע בו - ויעקב נאלץ לברוח מהבית. ופה נעצור: המפגש הבא בין האחים, אחרי שנים ארוכות, יהיה סיפור בפני עצמו."],
rashi:[{ref:"בראשית כה, כז",quote:"ידע ציד - לצוד ולרמות את אביו בפיו ושואלו אבא, האיך מעשרין את המלח ואת התבן? כסבור אביו שהוא מדקדק במצות.",explain:"רש\"י חושף את עשו: הוא ידע לדבר יופי ולהיראות צדיק מול אביו - אבל בפועל רמה. רש\"י מזהיר: אל תשפטו אנשים רק לפי המילים והחיצוניות, אלא לפי המעשים."},{ref:"בראשית כז, כב",quote:"הקל קול יעקב - שמדבר בלשון תחנונים קום נא, אבל עשו קנטוריא דבר יקם אבי.",explain:"רש\"י שם לב לאיך מדברים: יעקב מדבר בנימוס ובעדינות, עשו בגסות. המילים שלנו מספרות מי אנחנו - והכוח האמיתי הוא בדיבור עדין, לא בידיים חזקות."}],
lesson:"משל ונמשל: ילד שמספר לחבר \"אני הכי טוב בכדורגל\" אבל במשחק לא מעביר פעס - מול ילד שקט שפשוט משחק יפה. הנמשל: עשו נראה גיבור, יעקב נשמע חלש - אבל התנ\"ך שופט לפי מעשים ולב, לא לפי רושם. ועוד לקח: הרמיה הצליחה לרגע, אבל המחיר היה שנים של פרידה וכעס במשפחה. קיצורי דרך לא ישרים עולים ביוקר."}
]},
{id:3,title:"יעקב ויוסף",book:"בראשית",chapters:"כח–נ",status:"ready",stories:[
{id:"3-1",n:11,title:"סולם יעקב - החלום בליל הבריחה",book:"בראשית",chapters:"כח",ages:[5,11,13],holiday:"",topics:["חלום","הבטחה","בית אל","בריחה"],characters:["יעקב","אלוהים","מלאכים","רבקה","יצחק"],summary:"יעקב בורח לבד מעשו, ישן על אבן בשדה, וחולם על סולם שמגיע לשמים",
body:["אחרי שיעקב לקח את הברכה, עשו היה כועס מאוד, ורבקה אמרה ליעקב: קום, ברח לחרן, אל לבן אחי, עד שישוב חמת אחיך. גם יצחק ברך את יעקב ושלח אותו לחרן למצוא שם אישה מבית המשפחה.","יעקב יצא לבדו לדרך הארוכה. ואז קרה דבר מוזר: השמש שקעה פתאום, מוקדם מהרגיל. החשכה ירדה, ויעקב נאלץ לעצור וללון שם, בשדה, בלי אוהל ובלי מיטה. הוא לקח אבן, שם אותה מתחת לראשו, ונרדם.","והוא חלם חלום מדהים: סולם ענק עומד על הארץ, וראשו מגיע לשמים, ומלאכי אלוהים עולים ויורדים בו. ומעל הכול - אלוהים עצמו, שאומר ליעקב: הארץ אשר אתה שוכב עליה, לך אתננה ולזרעך. והנה אנכי עמך, ושמרתיך בכל אשר תלך, והשיבתיך אל האדמה הזאת.","יעקב התעורר ואמר: אכן, יש ה׳ במקום הזה, ואנכי לא ידעתי! הוא קם בבוקר, נטל את האבן שהייתה מתחת לראשו, העמיד אותה מצבה ושפך עליה שמן, וקרא למקום בית אל - בית אלוהים.","ואז יעקב נדר נדר: אם יהיה אלוהים עמדי, וישמרני בדרך הזאת אשר אנכי הולך, וישובי בשלום אל בית אבי - ה׳ יהיה לי לאלוהים, ומכל אשר תתן לי אעשר לו עשר. ככה, בלילה הכי קשה והכי בודד שלו, יעקב גילה שהוא לא לבד."],lesson:"משל: לילה ראשון בקייטנה, רחוק מהבית, והלב קצת לחוץ - ואז המדריך אומר: אני כאן כל הלילה, תישן בשקט. נמשל: יעקב ברח לבד בחושך, ודווקא שם אלוהים הבטיח לו: אני אתך בכל אשר תלך. גם כשמרגישים לבד - אנחנו לא באמת לבד.",rashi:[{ref:"בראשית כח, יא",quote:"כי בא השמש - שקעה לו חמה פתאום, שלא בעונתה, כדי שילין שם.",explain:"רש״י מסביר שהשמש שקעה פתאום, לפני הזמן - כדי שיעקב יעצור וילין בדיוק במקום הקדוש הזה. כלומר: אלוהים סידר שהיעקב יישן שם, כי היה לו משהו חשוב להראות לו שם."}]},
{id:"3-2",n:12,title:"יעקב ורחל בבאר - והתרמית של לבן",book:"בראשית",chapters:"כט–לא",ages:[5,11,13],holiday:"",topics:["אהבה","רמאות","עבודה","משפחה","מידה כנגד מידה"],characters:["יעקב","רחל","לאה","לבן"],summary:"יעקב עובד שבע שנים בשביל רחל, לבן מרמה אותו, והרמאות חוזרת אל הרמאי",
body:["יעקב הגיע לחרן, ומי מחכה לו ליד הבאר? רחל, בתו של לבן, שהייתה רועה את צאן אביה - בדיוק כמו שרבקה אמו פגשה את אליעזר ליד באר, שנים קודם. על הבאר הייתה אבן ענקית שרק כל הרועים ביחד יכלו לגלגל - ויעקב גלגל אותה לבדו! הוא השקה את הצאן של רחל, ואמר לה שהוא בן דודה.","לבן, אביה של רחל, קיבל את יעקב בשמחה ואמר: תעבוד אצלי, ומה יהיה שכרך? ויעקב אמר: אעבוד אצלך שבע שנים עבור רחל. והשנים האלה היו בעיניו כימים אחדים, באהבתו אותה.","אבל בליל החתונה לבן עשה תרמית: הוא החביא את פניה של הכלה, ובבוקר התברר שהחתין את לאה הבת הגדולה במקום רחל! יעקב נדהם: למה רימיתני? ולבן ענה בחיוך: אצלנו לא נוהגים לתת את הצעירה לפני הבכירה. אם אתה רוצה את רחל - עבוד עוד שבע שנים. ויעקב עבד.","עשרים שנה עבד יעקב אצל לבן - על הנשים, על הילדים, על עדרי הצאן הענקיים שבנה. לבן שינה לו את השכר פעם אחר פעם, אבל אלוהים שמר על יעקב, והצאן שלו רק גדלה. לבסוף אלוהים אמר ליעקב: שוב אל ארץ אביך - ויעקב יצא עם כל משפחתו ורכושו.","לבן רדף אחריו, אבל אלוהים הופיע ללבן בחלום והזהיר אותו לא לפגוע ביעקב. בסוף הם עשו שלום ופקטו ערמת אבנים לסימן, וכל אחד הלך לדרכו. יעקב יצא מבית לבן עשיר ועם משפחה גדולה - אבל גם למד על בשרו איך מרגישים כשמרמים אותך."],lesson:"משל: ילד שגנב לחבר קלף בקלפים, ושבוע אחר כך גנבו לו שלושה קלפים באותו תרגיל. נמשל: יעקב רימה את אביו כשלקח את ברכת הבכורה - ואצל לבן רימו אותו באותה צורה, בחשכה ובתחפושת. הרמאות תמיד חוזרת לרמאי. האמת היא הדרך היחידה לבנות עליה.",rashi:[{ref:"בראשית כט, יז",quote:"רכות - שהיתה סבורה לעלות בגורלו של עשו ובוכה, שהיו הכל אומרים שני בנים לרבקה ושתי בנות ללבן, הגדולה לגדול והקטנה לקטן.",explain:"רש״י מסביר שלאה בכתה הרבה, כי כולם אמרו שהיא תינתן לעשו הרשע. מאחורי הפסוק הקצר מסתתרת בחורה עם לב שבור - ורש״י מזכיר לנו שלפני ששופטים מישהו, כדאי לדעת מה הוא עובר."}]},
{id:"3-3",n:13,title:"המאבק בלילה - ושמו החדש: ישראל",book:"בראשית",chapters:"לב–לג",ages:[5,11,13],holiday:"",topics:["תפילה","אומץ","שם חדש","פיוס"],characters:["יעקב","עשו","האיש הנאבק"],summary:"לפני הפגישה עם עשו, יעקב נאבק כל הלילה עם איש מסתורי - ויוצא מזה עם שם חדש",
body:["יעקב חזר לארץ - אבל דווקא משם באה הבשורה המפחידה: עשו בא לקראתך, ועמו ארבע מאות איש. יעקב פחד מאוד. הוא עשה שלושה דברים חכמים: התפלל לאלוהים, חילק את המחנה לשניים כדי שאם יפגעו באחד יישאר השני, ושלח לעשו מתנה ענקית - מאות חיות, גל אחר גל, לרכך את ליבו.","בלילה הוא העביר את המשפחה את נחל יבוק. ואז התברר שהוא שכח כמה פכים קטנים - צנצנות קטנות! - וחזר לבדו להביא אותן. ושם, לבדו בחושך, נאבק איתו איש מסתורי עד עלות השחר.","האיש ראה שהוא לא מנצח את יעקב, ונגע לו בכף הירך - ויעקב צלע. אבל יעקב לא ויתר. האיש אמר: שלחני כי עלה השחר, ויעקב ענה: לא אשלחך כי אם ברכתני. אמר לו האיש: מה שמך? ויאמר: יעקב. ויאמר: לא יעקב יאמר עוד שמך, כי אם ישראל - כי שרית עם אלוהים ועם אנשים, ותוכל!","יעקב קם בבוקר צולע על ירכו, אבל עם שם חדש ועם ברכה. ואז הרים את עיניו - והנה עשו וארבע מאות האיש. יעקב השתחווה שבע פעמים, ועשו... רץ לקראתו, חיבק אותו, ונשק לו. שניהם בכו. שנים של פחד נגמרו בחיבוק."],lesson:"משל: ערב משחק חשוב, והשחקן מתאמן עד חצות למרות שהרגל כואבת - כי החלום שווה את זה. נמשל: יעקב נאבק כל הלילה, נפצע, ולא ויתר - ובבוקר קיבל שם חדש: ישראל. שם המשפחה שלנו עד היום! לפעמים הדברים הכי חשובים מגיעים דווקא אחרי המאבק הכי קשה.",rashi:[{ref:"בראשית לב, כה",quote:"ויותר יעקב לבדו - שכח פכים קטנים וחזר עליהם.",explain:"רש״י מסביר שיעקב נשאר לבד כי חזר להביא פכים קטנים ששכח. צדיקים מקפידים גם על הדברים הקטנים, כי הכול אצלם בא ביושר. אחריות אמיתית היא גם על הדברים הכי קטנים."}]},
{id:"3-4",n:14,title:"יוסף והאחים - הבאר והמכירה",book:"בראשית",chapters:"לז",ages:[11,13],holiday:"",topics:["קנאה","אחים","חלומות","בגידה"],characters:["יוסף","אחיו","יעקב","יהודה","ראובן"],summary:"האחים קונאים ביוסף האהוב, זורקים אותו לבאר ומוכרים אותו למצרים - ומשקרים לאבא",
note:"סיפור קשה על קנאה ופגיעה בתוך משפחה. מומלץ לגילאי 11 ו-13, ולדבר עליו אחרי הקריאה.",
body:["יוסף היה בן שבע עשרה, והיה הבן האהוב על יעקב - כי בן זקנים הוא לו. יעקב עשה לו כתונת פסים, בגד מיוחד שאף אחד מהאחים לא קיבל. והאחים ראו את זה, ושנאו את יוסף, ולא יכלו דברו לשלום.","ואז יוסף סיפר חלומות: אנחנו קושרים אלומות בשדה, ופתאום האלומה שלי קמה וניצבה, ואלומותיכם מסתובבות ומשתחווות לאלומה שלי. וחלום שני: השמש והירח ואחד עשר כוכבים משתחווים לי. גם יעקב התפלא, והאחים קינאו עוד יותר.","יום אחד שלח יעקב את יוסף לבקר את האחים שרעו את הצאן בשכם. כשראו אותו מרחוק, אמרו: הנה בעל החלומות הזה בא! ובמקום להרוג אותו, זרקו אותו לבאר יבשה. ראובן תכנן להציל אותו אחר כך, אבל יהודה הציע: למכור אותו לסוחרים.","עברה שיירת ישמעאלים, ומכרו את יוסף בעשרים כסף. אחים מוכרים את אחיהם! ואז לקחו את כתונת הפסים, טבלו אותה בדם של גדי, והביאו לאביהם: את זה מצאנו. ויעקב בכה ובכה: חיה רעה אכלתהו! ומאב לבן אהוב.","ויוסף, בן שבע עשרה, ירד עם השיירה למצרים. לבד. רחוק מהבית. אבל כפי שנראה בסיפורים הבאים - אלוהים לא שכח אותו, וגם הבאר הכי עמוקה היא לא סוף הסיפור."],lesson:"משל: אח שמרגיש שאמא אוהבת יותר את אחותו - ובמקום לומר את זה, שובר לה את המשחק האהוב. נמשל: הקנאה של האחים התחילה במילים שלא נאמרו והסתיימה בבאר ובמכירה - ובשנים של צער לאבא. כשקונאים - אומרים את זה במילים, ומהר, לפני שהקנאה עושה את המעשים בשבילנו.",rashi:[{ref:"בראשית לז, ג",quote:"כי בן זקנים הוא לו - כל מה שלמד משם ועבר מסר לו.",explain:"רש״י מסביר שיוסף היה בן חכם: יעקב מסר לו את כל התורה שלמד בחייו. האהבה הגדולה הייתה גם אהבה של לימוד ומסירה - אבל ההבדל בין האחים הוא שזרע את הקנאה שפילגה את המשפחה."}]},
{id:"3-5",n:15,title:"יוסף בבית פוטיפר - לעשות את הנכון",book:"בראשית",chapters:"לט",ages:[11,13],holiday:"",topics:["יושר","ניסיון","כלא","אמונה"],characters:["יוסף","פוטיפר","אשת פוטיפר"],summary:"יוסף מצליח במצרים, מסרב לעשות רע גם כשאף אחד לא רואה - ומשלם על זה בכלא",
note:"הסיפור עוסק בניסיון ובהאשמה שקרית, בשפה מעודנת. מומלץ לגילאי 11 ו-13.",
body:["יוסף נמכר לפוטיפר, שר מצרי חשוב. ואלוהים היה את יוסף: כל מה שהוא עשה - הצליח. פוטיפר ראה את זה, ומינה אותו ממונה על כל ביתו. עבד נמכר הפך למנהל הבית!","אבל אשת פוטיפר התחילה להציק ליוסף ולדרוש ממנו לעשות דברים לא נכונים. יום אחר יום היא לחצה - ויום אחר יום יוסף סרב. הוא אמר לה: איך אעשה את הרעה הגדולה הזאת וחטאתי לאלוהים? הוא ידע שאלוהים רואה הכול, גם כשאף אחד אחר לא רואה.","יום אחד היא תפסה אותו בבגדו, והוא ברח והשאיר את הבגד בידה. אז היא שיקרה לפוטיפר והאשימה את יוסף בדבר שלא עשה. פוטיפר האמין לה - ויוסף הושלך לכלא.","עכשיו עצרו לרגע: יוסף עשה את הדבר הנכון, ומה קיבל? כלא. זה לא הוגן בכלל. אבל שימו לב לסוף הפסוקים: ויהי ה׳ את יוסף - גם בכלא. שר הכלא שם את כל האסירים בידו, וכל אשר הוא עושה - ה׳ מצליח.","ולפעמים זה בדיוק ככה בחיים: עושים את הנכון, ונראה שהפסדנו. אבל מי שקורא את הסיפור עד הסוף יודע - הכלא הזה הוא בדיוק המקום שממנו יעלה יוסף לגדולה."],lesson:"משל: מצאת ארנק עם כסף בשכונה, ואף אחד לא ראה - ועם זאת החזרת אותו לבעלים. נמשל: יוסף בחר את היושר בלי שאף אחד ראה, ושילם על זה בכלא - אבל אלוהים היה איתו גם שם, והיושר פתח לו בסוף את כל הדלתות. הנכון משתלם, גם אם לוקח זמן לראות את זה."},
{id:"3-6",n:16,title:"משר החלומות - מהכלא למלוכה",book:"בראשית",chapters:"מ–מא",ages:[5,11,13],holiday:"חנוכה (פרשות החורף)",topics:["חלומות","ענווה","רעב","מנהיגות"],characters:["יוסף","פרעה","שר המשקים","שר האופים"],summary:"יוסף פותר חלומות בכלא ולפרעה, אומר שהכוח לא שלו - ונהפך למשנה למלך",
body:["בכלא ישבו איתו שני שרים של פרעה: שר המשקים ושר האופים. לילה אחד שניהם חלמו חלומות, ובבוקר היו עצובים - אין מי שיפתור. יוסף אמר: הפותרים לאלוהים? ספרו לי. ופתר: שר המשקים יחזור לתפקידו בעוד שלושה ימים, ושר האופים - סופו רע. וכך היה בדיוק.","יוסף ביקש משר המשקים: זכרתני כאשר ייטב לך. אבל שר המשקים שכח אותו - שנתיים שלמות! ואז פרעה חלם: שבע פרות יפות ושמנות עלו מהיאור, ואחריהן שבע פרות רזות ורעות - והרזות בלעו את השמנות. ושבע שיבולים בריאות, ואחריהן שבע צנומות.","אף חכם במצרים לא פתר את החלום. ואז שר המשקים נזכר: יש נער עברי בכלא שפותר חלומות בדיוק! הוציאו את יוסף מהבור, גילחו אותו, החליפו לו בגדים - והוא עמד לפני פרעה.","פרעה סיפר את החלום, ויוסף אמר משפט שכדאי לזכור: בלעדי - אלוהים יענה את שלום פרעה. כלומר: לא החוכמה שלי! ואז פתר: שבע שנות שבע גדול באות למצרים, ואחריהן שבע שנות רעב שישכחו את הכול. עכשיו - תמנה איש חכם שיאגור אוכל בשנות השבע לשנות הרעב.","פרעה הביט בשרים ואמר: הנמצא כזה, איש אשר רוח אלוהים בו? הוא לבש את יוסף בבגדי משי, שם על צווארו שרשרת זהב, ומינה אותו משנה למלך - הממונה על כל מצרים. יוסף היה בן שלושים. האסיר של אתמול נהיה המנהיג של היום."],lesson:"משל: ילד שזכה באולימפיאדת החשבון, ובמקום לומר אני הגאון - אמר תודה למורה שלימדה אותי להתאמן. נמשל: יוסף עמד לפני המלך הכי חזק בעולם, הרגע הכי גדול שלו - ובחר לומר: זה לא ממני, זה מאלוהים. ענווה אמיתית היא לדעת שהכישרונות שלנו הם מתנה, ולהודות למי שנתן.",rashi:[{ref:"בראשית מא, טז",quote:"בלעדי - אין החכמה משלי, אלא אלהים יענה.",explain:"רש״י מסביר את מילותיו של יוסף לפרעה: לא בזכות החוכמה שלי אני פותר - אלוהים הוא שיתן את הפיתרון. ברגע הגדול שלו, יוסף נשאר עניו ונתן את הכבוד למקום הנכון."}]},
{id:"3-7",n:17,title:"אני יוסף אחיכם - הרגע הגדול",book:"בראשית",chapters:"מב–מה",ages:[5,11,13],holiday:"",topics:["סליחה","אחים","תשובה","משפחה"],characters:["יוסף","אחיו","יהודה","בנימין","יעקב","פרעה"],summary:"האחים יורדים למצרים בלי לדעת מי השר הגדול - ויוסף בוחר לסלוח",
body:["בארץ כנען היה רעב, אבל במצרים היה לחם - כי יוסף אגר אותו. יעקב שלח את עשרת האחים להביא אוכל, ובנימין הקטן נשאר איתו. האחים באו לפני השר הגדול של מצרים והשתחוו לו - והנה, החלומות של יוסף התגשמו! יוסף הכיר אותם מיד. הם לא הכירו אותו.","יוסף בדק אותם: הוא האשים אותם בריגול, עצר את שמעון, ודרש שיביאו את בנימין. יעקב כמעט התפרק מצער, אבל יהודה התחייב לאביו: אם לא אביאנו אליך - אשא באשמה כל הימים. הם ירדו שוב, עם בנימין.","ויוסף עשה להם עוד מבחן אחד: ציווה להחביא את גביע הכסף שלו בשק של בנימין. כשהגביע נמצא, יהודה עמד לפני יוסף ואמר: קח אותי לעבד במקומו, כי איך אעלה אל אבי והנער איננו אתי? זה היה אותו יהודה שהציע למכור את יוסף - והפעם הוא מוכן למכור את עצמו בשביל אחיו.","ואז יוסף לא יכול עוד להתאפק. הוא ציווה להוציא את כל המצרים מהחדר, ובכה בקול עד שנשמע בבית פרעה, ואמר: אני יוסף! העוד אבי חי? והאחים נבהלו מפניו ולא יכלו לענות.","ויוסף אמר את המשפט הכי מדהים בסיפור: ועתה אל תעצבו, ואל יחר בעיניכם כי מכרתם אותי הנה - כי למחיה שלחני אלוהים לפניכם. הוא לא שיקר על הכאב, אבל הוא ראה את התמונה הגדולה: השרשרת הכואבת הובילה להצלת כל המשפחה.","הוא שלח את האחים עם עגלות ומתנות להביא את יעקב, וכשהאחים סיפרו לאביהם עוד יוסף חי - לא האמין. אבל כשראה את העגלות, ותחי רוח יעקב אביהם. ויאמר: רב! עוד יוסף בני חי - אלכה ואראנו בטרם אמות. וכל משפחת יעקב ירדה למצרים, שבעים נפש, ופרעה נתן להם את ארץ גושן."],lesson:"משל: חברים שהוציאו אותך מהקבוצה והכעיסו אותך, ושנה אחר כך הם צריכים אותך בפרויקט - ואתה יכול לבחור איך להגיב. נמשל: יוסף עמד מול האחים שמכרו אותו, עם כל הכוח בעולם לנקום - ובחר לסלוח ולהציל אותם. סליחה היא לא חולשה. סליחה היא הכוח הכי גדול בסיפור.",rashi:[{ref:"בראשית מה, כד",quote:"ולפי פשוטו של מקרא יש לומר, לפי שהיו נכלמים, היה דואג, שמא יריבו בדרך על דבר מכירתו, להתוכח זה עם זה ולומר על ידך נמכר, אתה ספרת לשון הרע עליו, וגרמת לנו לשנאתו.",explain:"רש״י מסביר שיוסף דאג שהאחים יתחילו להאשים אחד את השני בדרך הביתה - מי אשם במכירה. אחרי הסליחה, הוראת אח אחד לכולם: אל תחזרו לריב על העבר. תסלחו גם ביניכם."},{ref:"בראשית מה, כז",quote:"וירא את העגלות אשר שלח יוסף - סימן מסר להם במה היה עוסק כשפרש ממנו – בפרשת עגלה ערופה.",explain:"רש״י מסביר שיוסף שלח לאביו סימן סודי: העגלות רמזו לעגלה ערופה, הנושא האחרון שלמדו יחד לפני שהופרדו. ככה יעקב ידע שזה באמת הוא. אפילו אחרי עשרים ושנה במצרים, יוסף שמר את הלימוד המשותף עם אביו."}]}
]},
{id:4,title:"יציאת מצרים",book:"שמות",chapters:"א–טז",status:"ready",stories:[
{id:"4-1",n:18,title:"התיבה ביאור - משה נולד",book:"שמות",chapters:"א–ב",ages:[5,11,13],holiday:"",topics:["משה","מצרים","עבדות","הצלה"],characters:["משה","מרים","יוכבד","בת פרעה","שפרה ופועה"],summary:"פרעה מצווה לזרוק תינוקות ליאור, ואמא אחת מסתירה את בנה בתיבה - שתגדל בארמון",
body:["בני ישראל היו למשפחה ענקית במצרים, ופרעה החדש פחד מהם. הוא שעבד אותם בעבודת פרך - בלבנים ובניין, מבוקר עד ערב. ואז הוא ציווה דבר נורא: כל הבן הילוד - היאורה תשליכוהו.","שתי מיילדות אמיצות, שפרה ופועה, סרבו לציית: ותיראנה המיילדות את אלוהים, ולא עשו כאשר דיבר אליהן מלך מצרים. הן הצילו את התינוקות.","לבית לוי נולד בן. אמו יוכבד הסתירה אותו שלושה חודשים, וכשכבר אי אפשר היה להסתיר, לקחה תיבת גומא, זפתה אותה, שמה בו את התינוק, והניחה בסוף על שפת היאור. ואחותו מרים עמדה מרחוק לראות מה יהיה.","ובת פרעה ירדה לרחוץ על היאור, וראתה את התיבה בין הקנים. היא פתחה - ותראהו את הילד, והנה נער בכה. ותחמול עליו ותאמר: מילדי העברים זה. מרים רצה ממחבאה: האלך וקראתי לך אישה מינקת מן העברים? והיא החזירה את התינוק לאימו - שתניק אותו בשכר!","הילד גדל, והובא לבת פרעה, והיה לה לבן. ותקרא שמו משה, ותאמר: כי מן המים משיתהו. התינוק שנועד לטביעה ביאור - נמשה דווקא ממנו, וגדל בארמון המלך.","משה גדל, ויצא אל אחיו וירא בסבלתם. הוא ראה מצרי מכה איש עברי, התערב והציל אותו - והדבר נודע לפרעה, ומשה ברח למדין. שם, ליד באר, הוא הגן על בנות יתרו הכהן מרועים שדחקו אותן, ונשא את צפורה לאישה. המושל העתידי של ישראל למד שני דברים: להגן על החלש - ולרעות צאן בסבלנות."],lesson:"משל: ילדה בגן שרואה שדורכים על נמלה ומזיזה בעדינות את הכיסא - כי גם נמלה היא חיה. נמשל: בית פרעה היה מלא עצמה, ודווקא שם שתי נשים - שפרה ופועה - ובת פרעה בחרו בחמלה כשזה היה מסוכן. אומץ אמיתי הוא לעשות טוב כשכולם מסביב מפחדים.",rashi:[{ref:"שמות ב, ו",quote:"ותראהו את הילד - ומדרשו (שם), שראתה עמו שכינה.",explain:"רש״י מביא את דברי חז״ל: כשבת פרעה פתחה את התיבה, היא ראתה את התינוק - ואיתו שכינה, נוכחות של אלוהים. גם בתיבה קטנה בין קנים, אלוהים היה שם."}]},
{id:"4-2",n:19,title:"הסנה הבוער",book:"שמות",chapters:"ג–ד",ages:[5,11,13],holiday:"",topics:["סנה","קריאה","משלחת","אמונה"],characters:["משה","אלוהים","אהרן","יתרו"],summary:"סנה בוער ולא נאכל, קול קורא ממנו, ומשה המפקח מקבל את המשימה הגדולה בעולם",
body:["משה רעה את צאן יתרו חמיו במדבר. יום אחד, בהר חורב, הוא ראה דבר מוזר: סנה בוער באש - והסנה איננו אוכל. עשב קטן וקוצני עולה באש, ולא נשרף! משה אמר: אסרה נא ואראה את המראה הגדול הזה - למה לא יבער הסנה?","ואלוהים קרא אליו מתוך הסנה: משה, משה! ויאמר: הנני. אל תקרב הלום - של נעליך מעל רגליך, כי המקום אשר אתה עומד עליו אדמת קודש הוא. אני אלוהי אביך, אלוהי אברהם, יצחק ויעקב. ומשה הסתיר פניו, כי ירא מהביט אל אלוהים.","ואלוהים אמר: ראה ראיתי את עני עמי במצרים, ואת צעקתם שמעתי, ואירד להצילו. לכה ואשלחך אל פרעה, והוצאת את עמי ממצרים. ומשה, הענו שבאדמים, אמר: מי אנכי כי אלך אל פרעה? ואלוהים ענה: כי אהיה עמך.","משה שאל: אם ישאלו אותי מה שמך - מה אומר? ואלוהים אמר: אהיה אשר אהיה. שם שאומר: אני אתכם בצרה - ואיתכם ביציאה.","משה עוד התקשה: הם לא יאמינו לי, ואני כבד פה וכבד לשון - שלח נא ביד תשלח, שלח מישהו אחר! ואלוהים נתן לו אותות: מטה שהופך לנחש וחוזר למטה, ויד שהופכת למצורעת וחוזרת לבריאה. ונתן לו גם אח: אהרן אחיך יצא לקראתך, והוא ידבר בעדך. משה לקח את המטה, את המשימה ואת אשתו ובניו - ויצא למצרים."],lesson:"משל: המורה מציעה לתלמיד ביישן להציג בטקס, והוא אומר אני לא יכול - אבל היא אומרת: אני אשב בשורה הראשונה. נמשל: משה היה בטוח שהוא לא מתאים, ואלוהים ענה לו: כי אהיה עמך - אתה לא הולך לבד. הכישרון הכי חשוב הוא לומר הנני כשקוראים לך, גם כשמפחד.",rashi:[{ref:"שמות ג, יד",quote:"אהיה אשר אהיה - אהיה עמם בצרה זו אשר אהיה עמם בשעבוד שאר מלכיות.",explain:"רש״י מסביר את השם המיוחד שאלוהים גילה למשה: אני אהיה עם ישראל בצרה הזאת - וגם בצרות שיבואו בעתיד. השם עצמו הוא הבטחה: אני איתכם תמיד."}]},
{id:"4-3",n:20,title:"עשר המכות",book:"שמות",chapters:"ז–יב",ages:[5,11,13],holiday:"",topics:["מכות","פרעה","עקשנות","גאולה"],characters:["משה","אהרן","פרעה"],summary:"שלח את עמי! עשר מכות ממטה המטה ועד מכת בכורות, ולב אחד שמתקשה שוב ושוב",
body:["משה ואהרן באו אל פרעה: כה אמר ה׳ - שלח את עמי ויעבדוני במדבר. ופרעה ענה בגאווה: מי ה׳ אשר אשמע בקלו? לא אשלח את ישראל! ואפילו הוסיף להם עבודה: תלכו לאסוף תבן בעצמכם, והמכסה לא תיגרע.","ואז החלו המכות, אחת אחרי השנייה, כשכל פעם פרעה מתקשה, מבטיח, וחוזר בו. היאור והמים הפכו לדם. צפרדעים עלו ומילאו את הבתים והתנורים. כינים, ערוב, דבר על המקנה, שחין פורח, ברד של אש בתוך קרח, ארבה שכיסה את פני הארץ ואכל כל עשב, וחושך - חושך שלושה ימים, איש לא ראה את אחיו, אבל לכל בני ישראל היה אור במושבתם.","בין מכה למכה, פרעה קרא למשה ונדבק בדרמות קטנות: אלכו, רק הצאן תישאר. אלכו, רק הגברים. ומשה עמד על שלו: גם מקנינו נלך עמנו, לא תישאר פרסה! כולם, עם כל מה שיש לנו.","אחרי מכת בכורות, המכה העשירית והקשה, פרעה קם בלילה וקרא למשה ואהרן: קומו, צאו מתוך עמי! גם אתם, גם בני ישראל, גם צאנכם, גם בקרכם - ובירכתם גם אותי. כל מצרים דחקה בעם לצאת מהר.","ככה יצא העם שהיה עבדים - עם גדול, כשש מאות אלף רגלי הגברים, ועם ערב רב וצאן ובקר. 430 שנה של גלות נגמרו בלילה אחד."],lesson:"משל: שחקן שמפסיד סט ראשון, מסרב להודות, מפסיד גם שני - ובסוף מפסיד את כל המשחק, כי לא הסכים לשנות משהו קטן בזמן. נמשל: פרעה קיבל עשר הזדמנויות להקשיב, וכל פעם הקשיח עוד. עקשנות יפה במאבק על דבר טוב - אבל עקשנות של גאווה הורסת. לדעת להגיד טעיתי זה כוח, לא חולשה."},
{id:"4-4",n:21,title:"ליל פסח - יציאת מצרים",book:"שמות",chapters:"יב",ages:[5,11,13],holiday:"פסח",topics:["פסח","מצוה ראשונה","מצה","גאולה"],characters:["משה","אהרן","בני ישראל","פרעה"],summary:"המצוה הראשונה לעם, דם על המשקוף, מצות שלא הספיקו להחמיץ - והלילה שבו יצאנו לחירות",
body:["לפני המכה האחרונה, אלוהים נתן לישראל את המצוה הראשונה שלהם כעם: החדש הזה לכם ראש חדשים. מעכשיו, לעם ישראל יש לוח שנה משלו - סימן לחיים חדשים של עם חופשי.","כל משפחה לקחה שה לבית, שמרה אותו, וביום הארבעה עשר שחטה אותו כקורבן פסח. מן הדם שמו על שתי המזוזות ועל המשקוף - סימן על הבתים של בני ישראל. ובלילה אכלו את הבשר צלי אש, עם מצות ומרורים, כשהם חגורים ומוכנים לדרך: נעליים ברגליים ומקל ביד.","ובחצי הלילה הלך ה׳ בארץ מצרים והכה כל בכור. והיה הדם לכם לאות על הבתים - וראיתי את הדם, ופסחתי עליכם. בבתים של מצרים היה צעקה גדולה, ובבתים של ישראל - שקט ואור.","פרעה קם בחצות וקרא למשה ואהרן: קומו צאו! העם אפילו לא הספיק לאפות: הבצק לא החמיץ - ואת שארית הבצק לקחו על שכמם, ובדרך אפו אותו למצות.","והלילה ההוא נשאר לנו לדורות: ואמרתם זבח פסח הוא לה׳, אשר פסח על בתי בני ישראל במצרים. כל שנה, בליל הסדר, אנחנו מספרים את הסיפור הזה מחדש - בדיוק כמו שהתורה ציוותה: והגדת לבנך ביום ההוא לאמר, בעבור זה עשה ה׳ לי בצאתי ממצרים."],lesson:"משל: לפני טיול גדול אבא תולה רשימה על הדלת: תנועל, תסדר, תזכור. נמשל: בני ישראל שמו סימן על הדלת ויצאו עם מצות - כי כשיוצאים לחירות לא מחכים לבצק שיתפח. לפעמים ההזדמנות באה פעם אחת, ומי שמוכן - יוצא לדרך. בפסח אנחנו נזכרים בזה כל שנה מחדש.",rashi:[{ref:"שמות יב, יג",quote:"והיה הדם לכם לאת - לכם לאות ולא לאחרים לאות (שם). מכאן שלא נתנו הדם אלא מבפנים.",explain:"רש״י מסביר שהסימן על הדלת היה בשביל בני ישראל עצמם - לא בשביל אחרים. לכן שמו אותו מבפנים. לפעמים הסימנים החשובים ביותר הם דווקא אלה שאנחנו שמים לעצמנו, כדי לזכור מי אנחנו."}]},
{id:"4-5",n:22,title:"קריעת ים סוף",book:"שמות",chapters:"יג–יד",ages:[5,11,13],holiday:"שביעי של פסח",topics:["ים סוף","נס","אמונה","הצלה"],characters:["משה","בני ישראל","פרעה","אלוהים"],summary:"הים לפניהם ופרעה מאחוריהם - ואז הים נקרע לשניים והם הולכים ביבשה בתוך הים",
body:["בני ישראל יצאו למדבר, ואלוהים הולך לפניהם: עמוד ענן ביום ועמוד אש בלילה. ואז פרעה חזר בו שוב: מה זאת עשינו, ששלחנו את ישראל מעבדנו? הוא רתם את מרכבתו ויצא עם שש מאות רכב בחור - לרדוף אחריהם.","בני ישראל הרימו את עיניהם: מצרים נוסע אחריהם! מלפנים הים, מאחור פרעה. וייראו מאוד, ויצעקו: המבלי אין קברים במצרים לקחת אותנו למות במדבר? ומשה ענה: אל תיראו, התיצבו וראו את ישועת ה׳.","ואלוהים אמר למשה: מה תצעק אלי? דבר אל בני ישראל - ויסעו! עכשיו לא הזמן לעמוד - הזמן ללכת. ומשה נטה את ידו על הים, וכל הלילה נשבה רוח קדים עזה.","והמים נבקעו! ויבאו בני ישראל בתוך הים ביבשה - והמים להם חומה מימינם ומשמאלם. דגים שוחים מעל הראשים, רצפה יבשה מתחת לרגליים. נס שאף אחד לא ראה מעולם.","בבוקר, המצרים רדפו פנימה - ומשה נטה את ידו שוב, והים חזר לעוצמתו וכיסה את הרכב ואת הפרשים. וירא ישראל את היד הגדולה - ויאמינו בה׳ ובמשה עבדו.","לפעמים בחיים עומדים בין ים לפרעה. ודווקא שם, במקום שנראה שאין דרך - נפתחת דרך."],lesson:"משל: שחקנית שעומדת על הקו, הכדור אצלה, הכול חסום - ובמקום לקפוא, היא מסתובבת ומוצאת מסירה שלא ראתה. נמשל: אלוהים אמר למשה ובני ישראל: מה תצעק אלי? ויסעו! גם כשמפחדים - לפעמים הצעד קדימה הוא התפילה הכי טובה. הדרך נפתחת למי שמתקדם.",rashi:[{ref:"שמות יד, טו",quote:"מה תצעק אלי - לא עת עתה להאריך בתפלה, שישראל נתונין בצרה.",explain:"רש״י מסביר: משה עמד והתפלל, ואלוהים אמר לו - זה לא הזמן לתפלה ארוכה, העם בצרה! יש זמן לתפילה ויש זמן לקום ולעשות."},{ref:"שמות יד, טו",quote:"דבר אל בני ישראל ויסעו - אין להם אלא לסע, שאין הים עומד בפניהם, כדאי הוא זכות אבותיהם והאמונה שהאמינו בי ויצאו, לקרע להם הים.",explain:"רש״י מסביר שהים נקרע בזכות האמונה - בני ישראל האמינו ויצאו למדבר בלי לדעת לאן. אמונה היא ללכת גם כשלא רואים את כל הדרך."}]},
{id:"4-6",n:23,title:"שירת הים",book:"שמות",chapters:"טו",ages:[5,11,13],holiday:"שבת שירה",topics:["שירה","הודיה","מים","נס"],characters:["משה","מרים","בני ישראל"],summary:"עם שלם עומד על חוף הים אחרי הנס - ופורץ בשירה שאנחנו אומרים עד היום",
body:["עברו בני ישראל את הים, והם עומדים על החוף בצד השני. מצרים שרדפה - איננה. העבדות - נגמרה. ואז משה ובני ישראל עשו משהו שאף עם לא עשה לפניהם: הם פרצו בשירה.","אשירה לה׳ כי גאה גאה - סוס ורוכבו רמה בים! עזי וזמרת יה ויהי לי לישועה. מי כמוך באלים ה׳, מי כמוך נאדר בקודש? שירה על נס, על ים שנקרע, על עם שנולד מחדש.","ומרים הנביאה, אחות משה - זו שעמדה על היאור ושמרה על התיבה - לקחה את התוף בידה, וכל הנשים יצאו אחריה בתופים ובמחולים. ותען להם מרים: שירו לה׳ כי גאה גאה!","בני ישראל שרים את השירה הזאת עד היום, בכל בוקר, בתפילה. וכל שנה בשבת שירה - השבת שבה קוראים את הפרשה - יהודים בכל העולם קמים בבית הכנסת כשקוראים את אז ישיר.","כי כשקורה נס, לא מספיק לומר תודה. צריך לשיר."],lesson:"משל: קבוצה שזוכה באליפות ברגע האחרון, ואף אחד לא נשאר יבש - כולם צועקים ושרים. נמשל: בני ישראל לא אמרו סתם תודה - הם שרו. הודיה אמיתית היא כזאת שמתפרצת. טוב לזכור את הרגעים הטובים ולהגיד להם תודה בקול - זה מחזק אותנו לרגעים הקשים."},
{id:"4-7",n:24,title:"המן והשבת - לחם מהשמים",book:"שמות",chapters:"טז",ages:[5,11,13],holiday:"",topics:["מן","שבת","אמונה","פרנסה"],characters:["משה","אהרן","בני ישראל","אלוהים"],summary:"במדבר אין מלטות - וכל בוקר יורד לחם מהשמים, ובשישי כפל, כי מחר שבת",
body:["חודש וחצי אחרי יציאת מצרים, האוכל נגמר. במדבר אין סופר ואין מלטות. והעם התלונן: מי יתן מותנו בארץ מצרים, כשישבנו על סיר הבשר? הם כבר שכחו את עבודת הפרך וזכרו רק את הבשר.","ואלוהים אמר למשה: הנני ממטיר לכם לחם מן השמים. וכל בוקר, כשטל הבוקר עלה, נמצא על פני המדבר דבר דק, מכופס, דק ככפור על הארץ. בני ישראל ראו ואמרו איש אל אחיו: מן הוא? כי לא ידעו מה הוא. ומשה אמר: הוא הלחם אשר נתן ה׳ לכם לאכלה.","והטעם? כצפיחת בדבש. וכל אחד ליקט בדיוק כמה שהיה צריך - דבר יום ביומו. מי שלקט הרבה לא נשאר לו יותר, ומי שלקט מעט - לא חסר לו. ומי שניסה לשמור למחרת - התעורר למן רקוב ותולעים. מן היום לא ממשיכים למחר: כל יום צריך לסמוך על היום.","וביום השישי קרה דבר חדש: ירדה מנת כפול! ומשה אמר: מחר שבת, שבתון קודש לה׳. היום תאפו ותבשלו - ומחר תנוחו. וביום השבת יצאו חלק מהעם ללקט - ולא מצאו דבר. כי בשבת המן לא יורד.","ככה ארבעים שנה. ארבעים שנה של בוקר אחד כמו השני, ולחם יורד מהשמים. ובכל שישי - מנה כפולה, בשביל שבת. המן לא רק האכיל את העם - הוא למד אותם שבת, ולימד אותם לסמוך."],lesson:"משל: כיס שבועי ביום ראשון - ואסור לבזבז הכול ביום אחד, כי בכל בוקר מחדש מחכה סכום חדש. נמשל: המן למד את ישראל שני דברים: לסמוך שמחר יהיה מה לאכול - ולנוח בשבת. מי שממהר לאגור הכול, מפסיד את המנוחה. יש יום להשתדל, ויש יום לנוח.",rashi:[{ref:"שמות טז, ד",quote:"דבר יום ביומו - צרך אכילת יום ילקטו ביומו ולא היום לצרך מחר.",explain:"רש״י מסביר: כל יום ליקטו רק את מה שצריך לאותו יום - לא לאגור למחר. אלוהים לימד את העם לסמוך עליו מחדש כל בוקר. אמונה היא גם לישון בשקט, בלי לדאוג למחרתיים."}]}
]},

{id:"5-1",n:25,title:"מתן תורה - כאיש אחד בלב אחד",book:"שמות",chapters:"יט–כ",ages:[5,11,13],holiday:"שבועות",topics:["מתן תורה","סיני","עשרת הדברות","אחדות"],characters:["משה","בני ישראל","אלוהים"],summary:"העם חונה מול ההר כאיש אחד בלב אחד, ההר עולה באש - והתורה ניתנת",
body:["חמישים יום אחרי יציאת מצרים, בני ישראל הגיעו למדבר סיני, ויחן שם ישראל נגד ההר. רש״י אומר: הפעם חנו כאיש אחד בלב אחד. אין מחלוקת, אין תרעומות - עם אחד מול הר אחד.","משה עלה לאלוהים, ואלוהים אמר: כה תאמר לבית יעקב: אם שמוע תשמעו בקולי ושמרתם את בריתי - והייתם לי סגולה מכל העמים. משה מסר לעם, והעם ענה בקול אחד: כל אשר דיבר ה׳ נעשה!","בבוקר היום השלישי קרה דבר שלא קרה מעולם: קולות וברקים, ענן כבד על ההר, וקול שופר חזק מאוד. הר סיני עשן כולו כי ירד עליו ה׳ באש, וקול השופר הולך וחזק מאוד. כל העם ראה את הקולות - רואים את הנשמע!","ומתוך האש נשמעו עשרת הדברות: אנכי ה׳ אלוהיך אשר הוצאתיך מארץ מצרים. לא יהיה לך אלוהים אחרים. כבד את אביך ואת אמך. זכור את יום השבת. לא תרצח, לא תגנוב, לא תענה ברעך עד שקר, לא תחמוד.","העם עמד מרחוק, ומשה נכנס אל הערפל ונשאר על ההר ארבעים יום וארבעים לילה - לקבל את התורה ואת הלוחות. מאז ועד היום, בכל שבועות, אנחנו חוזרים לעמוד מול סיני."],lesson:"משל: מקהלה ששרה באיזו גובה שכל אחד רוצה - צריך שכולם יקשיבו לאותו קצב, ואז יוצא שיר אחד ענק. נמשל: כשישראל חנו כאיש אחד בלב אחד - רק אז יכלה התורה להינתן. אחדות היא לא בונוס. אחדות היא התנאי.",rashi:[{ref:"שמות יט, ב",quote:"ויחן שם ישראל - כאיש אחד בלב אחד, אבל שאר כל החניות בתרעומות ובמחלקת.",explain:"רש״י שם לב: כתוב ויחן ביחיד, לא ויחנו! מול סיני העם היה כמו אדם אחד עם לב אחד - בלי ריב ובלי מחלוקת. באחדות כזאת אפשר לקבל תורה."}]},
{id:"5-2",n:26,title:"עגל הזהב",book:"שמות",chapters:"לב",ages:[11,13],holiday:"",topics:["עגל הזהב","טעות","סליחה","יום כיפור"],characters:["משה","אהרן","בני ישראל"],summary:"ארבעים יום משה לא יורד, העם בונה עגל מזהב - ומשה שובר את הלוחות ומתפלל על העם",
note:"סיפור על טעות גדולה של עם שלם - ועל סליחה. מומלץ לגילאי 11 ו-13.",
body:["משה עלה להר סיני לקבל את הלוחות, והעם חיכה למטה. יום אחרי יום, עשרים, שלושים - ומשה לא יורד. העם נבהל: כי באשר האיש משה... לא ידענו מה היה לו. ויאסף העם על אהרן: קום, עשה לנו אלוהים אשר ילכו לפנינו!","אהרן אמר: תורידו את נזמי הזהב. הביאו זהב, הוא יצק אותו - ויצא עגל. והם אמרו: אלה אלוהיך ישראל, אשר העלוך מארץ מצרים! ובבוקר השכימו, הקריבו קורבנות, וישבו לאכול ולשתות ויקומו לצחק. העם שמכר את יוסף, ששר על הים - עושה עגל מזהב.","ואלוהים אמר למשה: לך רד, כי שחת עמך. משה ירד, וכשראה את העגל ואת המחלות - ויחר אף משה, וישלך מידו את הלוחות, וישבר אותם תחת ההר. לוחות שכתב עליהם אצבע אלוהים - שבורים.","אבל משה לא זרק את העם. הוא חזר אל אלוהים והתפלל: ועתה, אם תשא חטאתם - ואם אין, מחני נא מספרך. ארבעים יום נוספים הוא ביקש סליחה. ואלוהים סלח: ויאמר ה׳ סלחתי כדבריך.","בעשירי לחודש השביעי - יום כיפור - ירד משה עם לוחות שניים, לוחות חדשים. הלוחות הראשונים נשברו על העגל, והשניים ירדו בסליחה. ומאז, יום כיפור הוא יום הסליחה של כולנו."],lesson:"משל: שברת את הכוס האהובה על אמא. אפשר להסתיר את השברים - או להגיד אמיתי, אני שברתי, סליחה. נמשל: העם עשה טעות ענקית, ומשה לא ויתר עליהם - הוא התפלל עליהם ארבעים יום עד שבאה הסליחה. טועים כולם. להודות, לבקש סליחה ולהתחיל דף חדש - זה יום כיפור, וזה החיים."},
{id:"5-3",n:27,title:"המרגלים - ענבים ענקיים ודיווח מפחיד",book:"במדבר",chapters:"יג–יד",ages:[5,11,13],holiday:"",topics:["מרגלים","אמונה","לשון הרע","כלב","יהושע"],characters:["משה","כלב","יהושע","עשרת המרגלים","בני ישראל"],summary:"שנים עשר מרגלים יוצאים לראות את הארץ - עשרה מפחידים את העם, ושניים אומרים: עלה נעלה!",
body:["משה שלח שנים עשר נשיאים - אחד מכל שבט - לתור את ארץ כנען: מה הארץ, מה העם היושב בה, הערים מבוצרות, הטובה היא? ארבעים יום הלכו בארץ מראשה ועד סופה.","בנחל אשכול מצאו אשכול ענבים כל כך ענק, ששניים נשאו אותו על מוט! הביאו גם רימונים ותאנים. הארץ הייתה מדהימה. ואז בא הדיווח לעם.","התחילו באמת: ארץ זבת חלב ודבש היא! - ואז הוסיפו: אבל. אבל העם עז, והערים גדולות ומבוצרות, ושם ראינו ענקים! עשרה מרגלים הפחידו את העם עד שהעם בכה באותו לילה: לולו מתנו במצרים!","רק שניים עמדו מול הכולם: כלב השתיק את העם ואמר: עלה נעלה וירשנו אותה, כי יכול נוכל לה! ויהושע וכלב קרעו את בגדיהם: הארץ טובה מאוד מאוד! אם חפץ בנו ה׳ - יביא אותנו. רק בה׳ אל תמרודו, ואתם אל תיראו!","אבל העם בחר בפחד. ואלוהים גזר: בני עשרים שנה ומעלה לא יראו את הארץ - ארבעים שנה במדבר, שנה לכל יום שהמרגלים תורו. רק כלב ויהושע ייכנסו לארץ. והלילה ההוא - תשעה באב - נשאר לדורות לילה של בכייה."],lesson:"משל: שני חברים טועמים אותה עוגה: אחד אומר טעים, אבל קצת מתוק - וכולם זוכרים רק את המתוק. נמשל: המרגלים פתחו באמת על ארץ טובה, ואז הוסיפו פחד ודיווח עקום - והעם בחר להאמין לפחד. רש״י מלמד: שקר צריך קצת אמת כדי להתקיים. תשאלו תמיד: מה כאן אמת, ומה כאן פחד?",rashi:[{ref:"במדבר יג, כז",quote:"זבת חלב ודבש הוא - כל דבר שקר שאין אומרים בו קצת אמת בתחלתו, אין מתקים בסופו.",explain:"רש״י שם לב שהמרגלים פתחו במילים נכונות - ארץ זבת חלב ודבש - כדי שהשקר שלהם אחר כך יישמע אמין. ככה עובד שקר: קצת אמת בהתחלה, הרבה רע בסוף. לכן בודקים הכול, לא רק את ההתחלה."}]},
{id:"5-4",n:28,title:"בלעם והאתון המדברת",book:"במדבר",chapters:"כב–כד",ages:[5,11,13],holiday:"",topics:["בלעם","אתון","ברכה","מה טבו"],characters:["בלעם","בלק","האתון","המלאך"],summary:"בלק שכר את בלעם לקלל את ישראל, האתון רואה מה שהנביא לא רואה - ובמקום קללה יוצאת ברכה",
body:["בני ישראל חנו בעבר הירדן, ובלק מלך מואב פחד מהם. הוא שלח שליחים עם כסף לבלעם בן בעור, נביא מפורסם: בא, קלל לי את העם הזה! ואלוהים אמר לבלעם: לא תלך עמם, לא תאר את העם - כי ברוך הוא.","בלעם סרב, אבל כשהשליחים חזרו עם עוד כסף וכבוד, הוא מאוד רצה ללכת. אלוהים נתן לו ללכת - אבל רק לדבר את מה שיאמר לו. בלעם רכב על אתונו ויצא.","ובדרך עמד מלאך ה׳ בדרך, עם חרב שלופה. האתון ראתה את המלאך - בלעם לא! היא פנתה לשדה, ובלעם הכה אותה. המלאך עמד במסלול צר, והאתון נצמדה לקיר ולחצה את רגל בלעם - והוא הכה אותה שוב. שלישית, לא היה מקום לפנות - והאתון שכבה תחתיו. ובלעם הכה אותה במקל.","ואז קרה דבר שלא קרה מעולם: ויפתח ה׳ את פי האתון! ותאמר לבלעם: מה עשיתי לך, כי הכיתני זה שלוש רגלים? ובלעם, בלי לחשוב פעמיים, ענה לה - מדבר עם אתון! - כי התעללת בי, לו יש חרב בידי הרגתיך!","ויגל ה׳ את עיני בלעם - והנה המלאך עומד בדרך וחרבו שלופה. בלעם נפל על פניו. הבינאי הגדול ראה פחות מהאתון שלו.","בלעם עלה לגבעות להסתכל על מחנה ישראל, פתח את פיו לקלל - ויצאה ברכה: מה טבו אהליך יעקב, משכנותיך ישראל! שלוש פעמים ניסה לקלל, שלוש פעמים בירך. בלק זעם, וישראל קיבלו ברכה שאנחנו אומרים בבית הכנסת עד היום."],lesson:"משל: תלמיד שכועס על החבר ומכין דבר מר לומר לו - וכשהוא פותח את הפה יוצא משהו אחר לגמרי, כי אמא מסתכלת. נמשל: בלעם רצה לקלל וברך - כי אלוהים שולט במילים. והאתון? לפעמים מי שנראה פשוט רואה את האמת לפני החכם הגדול. לא להכות את מי שמנסה לעצור אותך - לשאול למה הוא נעצר.",rashi:[{ref:"במדבר כב, כח",quote:"זה שלש רגלים - רמז לו: אתה מבקש לעקר אמה החוגגת שלש רגלים בשנה?",explain:"רש״י מסביר שהאתון אמרה שלוש רגלים כרמז: שלוש פעמים בשנה - פסח, שבועות וסוכות - ישראל עולים לרגל לאלוהים. עם עם קשר כזה לאלוהים, בלעם, אתה לא תעקור."},{ref:"במדבר כד, ה",quote:"מה טבו אהליך - על שראה פתחיהם שאינן מכונין זה מול זה.",explain:"רש״י מסביר שבלעם התרשם שהאוהלים של ישראל נבנו כך שאף פתח לא מול פתח - כדי שלא להציץ זה לזה. צניעות וכבוד לפרטיות של אחרים - זה מה שגרם לו לברך."}]},
{id:"5-5",n:29,title:"בנות צלפחד - משפט צודק",book:"במדבר",chapters:"כז",ages:[5,11,13],holiday:"",topics:["צדק","בנות צלפחד","נחלה","אומץ"],characters:["בנות צלפחד","משה","אלוהים"],summary:"חמש אחיות עומדות לפני משה ודורשות צדק - ואלוהים עצמו אומר: כן דוברות",
body:["בספירת הארץ חילקו את הנחלות לפי משפחות - ונחלה עברה לבנים, לא לבנות. ואז הגיעו חמש אחיות: מחלה, נעה, חגלה, מלכה ותרצה - בנות צלפחד, שמת במדבר ולא היו לו בנים.","הן לא התלוננו בצד. הן עמדו לפני משה ואלעזר הכהן וכל העדה, פתח אוהל מועד, ואמרו: אבינו מת במדבר, ולא היו לו בנים. למה יגרע שם אבינו מתוך משפחתו, כי אין לו בן? תנה לנו אחוזה בתוך אחי אבינו!","ומשה, הגדול בשופטים, לא ידע מה לענות. ויקרב משה את משפטן לפני ה׳ - הוא שאל את אלוהים.","ואלוהים ענה: כן בנות צלפחד דוברות! נתון תתן להם אחוזת נחלה בתוך אחי אביהם, והעברת את נחלת אביהן להן. ויותר מזה: מכאן נולד חוק לדורות - אם אין בן, הבת יורשת.","חמש אחיות שאלו שאלה אמיצה - ושינו את החוק. לפעמים צריך רק לעמוד, לדבר ביושר, ולבקש צדק."],lesson:"משל: בכיתה חילקו טופסי טיול רק לבנים, ושלוש בנות ניגשו למורה בשקט ובנימוקים - והמורה שינתה את ההחלטה לכולם. נמשל: בנות צלפחד לא קרעו ולא צעקו - עמדו בפתח אוהל מועד ודיברו בצדק, ואלוהים אמר: כן דוברות. כשרואים עוול - מדברים. בצדק, ביושר, ועד הסוף.",rashi:[{ref:"במדבר כז, ז",quote:"כן בנות צלפחד דוברות - כך כתובה פרשה זו לפני במרום, מגיד שראתה עינן מה שלא ראתה עינו של משה.",explain:"רש״י מסביר: אלוהים אמר שהדין הזה היה כתוב למעלה במדויק כמו שהן אמרו - ושהן ראו דבר שאפילו עינו של משה לא ראתה. כמה חשוב להקשיב לכל דעה - גם למי שאף אחד לא ציפה שילמד את הגדולים."}]},
{id:"5-6",n:30,title:"ספר דברים - משה מלמד את העם מחדש",book:"דברים",chapters:"א–ו",ages:[5,11,13],holiday:"",topics:["דברים","שמע ישראל","מסירה","תורה"],characters:["משה","בני ישראל","יהושע"],summary:"לפני סוף הדרך משה עוצר, מספר את כל הסיפור מחדש - ונותן לעם את שמע ישראל",
body:["ארבעים שנה נגמרו. בני ישראל עומדים בעבר הירדן, מול הארץ. ומשה, שהוליך אותם מיציאת מצרים, יודע שהוא לא ייכנס אתם. לפני שהוא נפרד - הוא עוצר הכול ומדבר. חמישה שבועות של דברים, ומהם נולד ספר שלם: דברים.","משה מספר את כל הסיפור מההתחלה: סיני, המרגלים, המדבר, המלחמות. הוא מזכיר את הטעויות - לא כדי להכעיס, אלא כדי שהדור החדש, שנולד במדבר, ידע מאיפה בא ולא יחזור עליהן.","והוא נותן להם את הלב של כל התורה בכמה משפטים: שמע ישראל, ה׳ אלוהינו, ה׳ אחד! ואהבת את ה׳ אלוהיך בכל לבבך ובכל נפשך ובכל מאודך.","ואיך שומרים את זה? והיו הדברים האלה על לבבך, ושיננתם לבניך - ללמד את הילדים! - ודברת בם בשבתך בביתך ובלכתך בדרך, ובשכבך ובקומך. תורה לא נשמרת בארון. תורה חיה בבית, בדרך, בערב ובבוקר.","בכל יום, שחרית וערבית, ילדים בכל העולם אומרים את שמע ישראל עד היום - בדיוק המילים שמשה אמר בעבר הירדן, לפני שלושת אלפים ומשהו שנה."],lesson:"משל: לפני שאבא נוסע לנסיעה ארוכה הוא יושב עם הילדים ואומר: בואו נדבר. הוא מסכם מה למדנו, ומה חשוב באמת. נמשל: משה ידע שהוא לא ייכנס לארץ - אז הוא השאיר את הדברים הכי חשובים, שאנחנו עד היום אומרים בוקר וערב. דברים חכמים שמוסרים באהבה נשארים לדורות."},
{id:"5-7",n:31,title:"על הר נבו - משה נפרד",book:"דברים",chapters:"לב–לד",ages:[5,11,13],holiday:"",topics:["משה","הר נבו","פרידה","ירושה"],characters:["משה","יהושע","בני ישראל","אלוהים"],summary:"משה מברך את השבטים, עולה להר נבו, רואה את הארץ - ולא קם נביא עוד בישראל כמשה",
body:["בסוף הדרך, משה עשה שני דברים: שר שירה אחרונה - שירת האזינו - וברך את כל שבטי ישראל, שבט שבט, כמו אבא שמברך את ילדיו לפני שהוא נפרד. ואז הוא שם את ידיו על יהושע, והעביר אליו את ההנהגה.","ואלוהים אמר למשה: עלה אל הר נבו, וראה את הארץ. משה עלה לבדו, ומשם ראה את הכול: מגלעד עד דן, ואת כל נפתלי וארץ אפרים ומנשה, עד הים האחרון. הארץ שהבטיח לאברהם, יצחק ויעקב - הוא ראה אותה. אל תוך הארץ לא נכנס, אבל הוא ראה אותה.","וימת שם משה עבד ה׳, בארץ מואב - על פי ה׳. ויקבר אותו בגיא, ולא ידע איש את קברו עד היום הזה. ומשה בן מאה ועשרים שנה במותו - לא כהתה עינו, ולא נס ליחו. כוחו וראייתו נשארו עד הרגע האחרון.","ובני ישראל בכו את משה בעברי מואב שלושים יום. והתורה מסיימת במילים: ולא קם נביא עוד בישראל כמשה, אשר ידעו ה׳ פנים אל פנים.","אבל הסיפור לא נגמר - הוא עובר ידיים: ויהושע בן נון מלא רוח חוכמה, כי סמך משה את ידיו עליו. וישמעו אליו בני ישראל. מכאן מתחילה יחידה 6: כניסה לארץ עם יהושע."],lesson:"משל: קפטן קבוצה שפורש, ובמשחק האחרון מעביר את סרט הקפטן לשחקן הצעיר שאימן. נמשל: משה לא נכנס לארץ, אבל בנה את מי שייכנס - יהושע. לא תמיד מסיימים את כל מה שהתחלנו, וזה בסדר. אם הכנו את מי שממשיך אחרינו - לא הפסדנו, ניצחנו.",rashi:[{ref:"דברים לד, ה",quote:"אפשר משה מת וכתב וימת שם משה? אלא עד כאן כתב משה, מכאן ואילך כתב יהושע.",explain:"רש״י שואל: איך יכול משה לכתוב את המילים על מותו? תשובה אחת: עד כאן כתב משה, ומכאן כתב יהושע. ורבי מאיר אומר תשובה מרגשת: אלוהים אמר, ומשה כתב - בדמע. גם את הפסוקים הכי קשים לו, משה כתב במסירות מלאה."}]}
]},

/* ===== STATE ===== */
const $=id=>document.getElementById(id);
let read={};try{read=JSON.parse(localStorage.getItem("tsr-read")||"{}")}catch(e){read={}}
function saveRead(){try{localStorage.setItem("tsr-read",JSON.stringify(read))}catch(e){}}
let dark=localStorage.getItem("tsr-dark")==="1";
function applyDark(){document.documentElement.classList.toggle("dark",dark);$("darkBtn").textContent=dark?"☀️":"🌙"}
$("darkBtn").onclick=()=>{dark=!dark;localStorage.setItem("tsr-dark",dark?"1":"0");applyDark()};
/* ===== SPEECH ===== */
const synth=window.speechSynthesis;
let speaking=false,paused=false;
function heVoice(){if(!synth)return null;const vs=synth.getVoices();return vs.find(v=>/^he/i.test(v.lang))||vs.find(v=>/hebrew|עברית/i.test(v.name))||null}
if(synth)synth.onvoiceschanged=()=>{};
function stopSpeak(){if(synth)synth.cancel();speaking=false;paused=false;updPlayer()}
function speakStory(st){if(!synth){alert("הדפדפן הזה לא תומך בהקראה");return}stopSpeak();const parts=[st.title+"."].concat(st.body);if(st.lesson)parts.push("מה לומדים? "+st.lesson);(st.rashi||[]).forEach(r=>{parts.push("רשי אומר, על "+r.ref+": "+r.quote+" "+r.explain)});const v=heVoice();const rate=parseFloat(localStorage.getItem("tsr-rate")||"0.95");
parts.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang="he-IL";if(v)u.voice=v;u.rate=rate;u.onend=()=>{if(i===parts.length-1){speaking=false;updPlayer()}};synth.speak(u)});speaking=true;paused=false;updPlayer()}
function updPlayer(){const b=$("playBtn");if(!b)return;b.textContent=speaking&&!paused?"⏸ השהה":"▶ הקראה";const st=$("pState");if(st)st.textContent=speaking?(paused?"מושהה":"מקריא..."):"";}
function cycleRate(){let r=parseFloat(localStorage.getItem("tsr-rate")||"0.95");r=r>=1.2?0.8:r>=1?1.2:1;localStorage.setItem("tsr-rate",r);const b=$("rateBtn");if(b)b.textContent="מהירות "+r;return r}
/* ===== VIEWS ===== */
const app=$("app");
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function viewHome(q){q=(q||"").trim();let h="";
if(q){h+='<input class="searchbox" id="q" placeholder="חיפוש סיפור..." value="'+esc(q)+'">';let found=[];UNITS.forEach(u=>u.stories.forEach(s=>{if((s.title+s.summary+(s.topics||[]).join(" ")+(s.characters||[]).join(" ")+(s.lesson||"")+(s.rashi||[]).map(r=>r.quote+r.explain).join(" ")).includes(q))found.push([u,s])}));
h+='<div class="card"><b>'+found.length+' תוצאות</b></div>';found.forEach(([u,s])=>{h+='<button class="storybtn" onclick="goStory('+u.id+',\''+s.id+'\')"><span class="num">'+s.n+'</span><span><h3>'+esc(s.title)+'</h3><div class="src">'+esc(s.book)+' '+esc(s.chapters)+' · יחידה '+u.id+'</div></span><span class="tick">'+(read[s.id]?"✅":"")+'</span></button>'});app.innerHTML=h;const qi=$("q");qi.focus();qi.oninput=()=>{const v=qi.value;const pos=qi.selectionStart;viewHome(v);const q2=$("q");q2.setSelectionRange(pos,pos)};return}
h+='<input class="searchbox" id="q" placeholder="חיפוש סיפור...">';
const totalRead=UNITS.reduce((a,u)=>a+u.stories.filter(s=>read[s.id]).length,0);
const totalStories=UNITS.reduce((a,u)=>a+u.stories.length,0);
h+='<div class="card">כאן אוספים את סיפורי התנ״ך הגדולים, <b>לפי הסדר</b> - מהבריאה ועד שיבת ציון. כל סיפור עם מקור מדויק, התאמה לגיל, וכפתור הקראה בקול - לפני השינה או בנסיעה. 🌙🚗<div class="progressline">נקראו '+totalRead+' מתוך '+totalStories+' סיפורים שפורסמו · יחידה 1 מוכנה, והשאר בדרך</div></div>';
UNITS.forEach(u=>{if(u.status==="ready"){const done=u.stories.filter(s=>read[s.id]).length;
h+='<button class="unit" onclick="goUnit('+u.id+')"><h2>'+u.id+". "+esc(u.title)+'</h2><div class="meta">'+esc(u.book)+(u.chapters?' '+esc(u.chapters):'')+' · '+u.stories.length+' סיפורים <span class="badge'+(done===u.stories.length?' done':'')+'">'+(done===u.stories.length?'הושלמה ✓':'זמינה עכשיו')+'</span></div></button>'}
else{h+='<button class="unit soon" disabled><h2>'+u.id+". "+esc(u.title)+'</h2><div class="meta">'+esc(u.book)+' · '+u.planned+' סיפורים <span class="badge soonb">בקרוב</span></div></button>'}});
app.innerHTML=h;$("q").oninput=e=>viewHome(e.target.value)}
function viewUnit(uid){const u=UNITS.find(x=>x.id===uid);if(!u)return viewHome();
let h='<button class="back" onclick="viewHome()">→ חזרה למפה</button><div class="card"><h2 style="color:var(--accent)">'+u.id+". "+esc(u.title)+'</h2><div class="meta" style="color:var(--muted)">'+esc(u.book)+(u.chapters?' '+esc(u.chapters):'')+'</div></div>';
u.stories.forEach(s=>{h+='<button class="storybtn" onclick="goStory('+u.id+',\''+s.id+'\')"><span class="num">'+s.n+'</span><span><h3>'+esc(s.title)+'</h3><div class="src">'+esc(s.book)+' '+esc(s.chapters)+' · '+s.ages.map(a=>'<span class="agetag">'+a+'+</span>').join(" ")+'</div></span><span class="tick">'+(read[s.id]?"✅":"")+'</span></button>'});
app.innerHTML=h;window.scrollTo(0,0)}
function viewStory(uid,sid){const u=UNITS.find(x=>x.id===uid);const s=u&&u.stories.find(x=>x.id===sid);if(!s)return viewHome();stopSpeak();
let h='<button class="back" onclick="viewUnit('+uid+')">→ חזרה ליחידה</button><div class="card story"><h2>'+esc(s.title)+'</h2><div class="src">'+esc(s.book)+', פרקים '+esc(s.chapters)+(s.holiday?' · 🗓 '+esc(s.holiday):'')+' · '+s.ages.map(a=>'<span class="agetag">'+a+'+</span>').join(" ")+'</div>';
if(s.note)h+='<div class="note">⚠️ '+esc(s.note)+'</div>';
s.body.forEach(p=>{h+='<p>'+esc(p)+'</p>'});
if(s.lesson)h+='<div class="lesson"><b>💡 מה לומדים?</b><div style="margin-top:4px">'+esc(s.lesson)+'</div></div>';
(s.rashi||[]).forEach(r=>{h+='<div class="rashic"><b>📜 רש״י - '+esc(r.ref)+'</b><div class="rq">'+esc(r.quote)+'</div><div>'+esc(r.explain)+'</div></div>'});
h+='<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="iconbtn" style="padding:0 16px;font-size:.95rem" onclick="toggleRead(\''+s.id+'\')">'+(read[s.id]?"✅ נקרא!":"סמן כנקרא")+'</button>';
const idx=u.stories.indexOf(s);if(idx<u.stories.length-1)h+='<button class="iconbtn" style="padding:0 16px;font-size:.95rem" onclick="goStory('+uid+',\''+u.stories[idx+1].id+'\')">הסיפור הבא ←</button>';
h+='</div></div>';
h+='<div class="player"><button class="main" id="playBtn">▶ הקראה</button><button id="stopBtn">⏹</button><button id="rateBtn">מהירות '+(localStorage.getItem("tsr-rate")||"0.95")+'</button><div class="st" id="pState"></div></div>';
app.innerHTML=h;window.scrollTo(0,0);updPlayer();
$("playBtn").onclick=()=>{if(!speaking)speakStory(s);else if(!paused){synth.pause();paused=true;updPlayer()}else{synth.resume();paused=false;updPlayer()}};
$("stopBtn").onclick=stopSpeak;
$("rateBtn").onclick=()=>{const r=cycleRate();if(speaking){speakStory(s)}}}
function toggleRead(sid){read[sid]=!read[sid];saveRead();const m=location.hash.match(/#u(\d+)\/(.+)/);if(m)viewStory(+m[1],m[2])}
function goUnit(uid){location.hash="#u"+uid}
function goStory(uid,sid){location.hash="#u"+uid+"/"+sid}
function route(){const h=location.hash;let m=h.match(/#u(\d+)\/(.+)/);if(m)return viewStory(+m[1],m[2]);m=h.match(/#u(\d+)/);if(m)return viewUnit(+m[1]);viewHome()}
window.addEventListener("hashchange",route);
applyDark();route();
</script>
