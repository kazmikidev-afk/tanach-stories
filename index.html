{id:"5-1",n:25,title:"מתן תורה - כאיש אחד בלב אחד",book:"שמות",chapters:"יט–כ",ages:[5,11,13],holiday:"שבועות",topics:["מתן תורה","סיני","עשרת הדברות","אחדות"],characters:["משה","בני ישראל","אלוהים"],summary:"העם חונה מול ההר כאיש אחד בלב אחד, ההר עולה באש - והתורה ניתנת",
body:["חמישים יום אחרי יציאת מצרים, בני ישראל הגיעו למדבר סיני, ויחן שם ישראל נגד ההר. רש״י אומר: הפעם חנו כאיש אחד בלב אחד. אין מחלוקת, אין תרעומות - עם אחד מול הר אחד.","משה עלה לאלוהים, ואלוהים אמר: כה תאמר לבית יעקב: אם שמוע תשמעו בקולי ושמרתם את בריתי - והייתם לי סגולה מכל העמים. משה מסר לעם, והעם ענה בקול אחד: כל אשר דיבר ה׳ נעשה!","בבוקר היום השלישי קרה דבר שלא קרה מעולם: קולות וברקים, ענן כבד על ההר, וקול שופר חזק מאוד. הר סיני עשן כולו כי ירד עליו ה׳ באש, וקול השופר הולך וחזק מאוד. כל העם ראה את הקולות - רואים את הנשמע!","ומתוך האש נשמעו עשרת הדברות: אנכי ה׳ אלוהיך אשר הוצאתיך מארץ מצרים. לא יהיה לך אלוהים אחרים. כבד את אביך ואת אמך. זכור את יום השבת. לא תרצח, לא תגנוב, לא תענה ברעך עד שקר, לא תחמוד.","העם עמד מרחוק, ומשה נכנס אל הערפל ונשאר על ההר ארבעים יום וארבעים לילה - לקבל את התורה ואת הלוחות. מאז ועד היום, בכל שבועות, אנחנו חוזרים לעמוד מול סיני."],lesson:"משל: מקהלה ששרה באיזו גובה שכל אחד רוצה - צריך שכולם יקשיבו לאותו קצב, ואז יוצא שיר אחד ענק. נמשל: כשישראל חנו כאיש אחד בלב אחד - רק אז יכלה התורה להינתן. אחדות היא לא בונוס. אחדות היא התנאי.",rashi:[{ref:"שמות יט, ב",quote:"ויחן שם ישראל - כאיש אחד בלב אחד, אבל שאר כל החניות בתרעומות ובמחלקת.",explain:"רש״י שם לב: כתוב ויחן ביחיד, לא ויחנו! מול סיני העם היה כמו אדם אחד עם לב אחד - בלי ריב ובלי מחלוקת. באחדות כזאת אפשר לקבל תורה."}]},
{id:"5-2",n:26,title:"עגל הזהב",book:"שמות",chapters:"לב",ages:[11,13],holiday:"",topics:["עגל הזהב","טעות","סליחה","יום כיפור"],characters:["משה","אהרן","בני ישראל"],summary:"ארבעים יום משה לא יורד, העם בונה עגל מזהב - ומשה שובר את הלוחות ומתפלל על העם",
note:"סיפור על טעות גדולה של עם שלם - ועל סליחה. מומלץ לגילאי 11 ו-13.",
body:["משה עלה להר סיני לקבל את הלוחות, והעם חיכה למטה. יום אחרי יום, עשרים, שלושים - ומשה לא יורד. העם נבהל: כי באשר האיש משה... לא ידענו מה היה לו. ויאסף העם על אהרן: קום, עשה לנו אלוהים אשר ילכו לפנינו!","אהרן אמר: תורידו את נזמי הזהב. הביאו זהב, הוא יצק אותו - ויצא עגל. והם אמרו: אלה אלוהיך ישראל, אשר העלוך מארץ מצרים! ובבוקר השכימו, הקריבו קורבנות, וישבו לאכול ולשתות ויקומו לצחק. העם שמכר את יוסף, ששר על הים - עושה עגל מזהב.","ואלוהים אמר למשה: לך רד, כי שחת עמך. משה ירד, וכשראה את העגל ואת המחלות - ויחר אף משה, וישלך מידו את הלוחות, וישבר אותם תחת ההר. לוחות שכתב עליהם אצבע אלוהים - שבורים.","אבל משה לא זרק את העם. הוא חזר אל אלוהים והתפלל: ועתה, אם תשא חטאתם - ואם אין, מחני נא מספרך. ארבעים יום נוספים הוא ביקש סליחה. ואלוהים סלח: ויאמר ה׳ סלחתי כדבריך.","בעשירי לחודש השביעי - יום כיפור - ירד משה עם לוחות שניים, לוחות חדשים. הלוחות הראשונים נשברו על העגל, והשניים ירדו בסליחה. ומאז, יום כיפור הוא יום הסליחה של כולנו."],lesson:"משל: שברת את הכוס האהובה על אמא. אפשר להסתיר את השברים - או להגיד אמיתי, אני שברתי, סליחה. נמשל: העם עשה טעות ענקית, ומשה לא ויתר עליהם - הוא התפלל עליהם ארבעים יום עד שבאה הסליחה. טועים כולם. להודות, לבקש סליחה ולהתחיל דף חדש - זה יום כיפור, וזה החיים."},
{id:"5-3",n:27,title:"המרגלים - ענבים ענקיים ודיווח מפחיד",book:"במדבר",chapters:"יג–יד",ages:[5,11,13],holiday:"",topics:["מרגלים","אמונה","לשון הרע","כלב","יהושע"],characters:["משה","כלב","יהושע","עשרת המרגלים","בני ישראל"],summary:"שנים עשר מרגלים יוצאים לראות את הארץ - עשרה מפחידים את העם, ושניים אומרים: עלה נעלה!",
body:["משה שלח שנים עשר נשיאים - אחד מכל שבט - לתור את ארץ כנען: מה הארץ, מה העם היושב בה, הערים מבוצרות, הטובה היא? ארבעים יום הלכו בארץ מראשה ועד סופה.","בנחל אשכול מצאו אשכול ענבים כל כך ענק, ששניים נשאו אותו על מוט! הביאו גם רימונים ותאנים. הארץ הייתה מדהימה. ואז בא הדיווח לעם.","התחילו באמת: ארץ זבת חלב ודבש היא! - ואז הוסיפו: אבל. אבל העם עז, והערים גדולות ומבוצרות, ושם ראינו ענקים! עשרה מרגלים הפחידו את העם עד שהעם בכה באותו לילה: לולו מתנו במצרים!","רק שניים עמדו מול הכולם: כלב השתיק את העם ואמר: עלה נעלה וירשנו אותה, כי יכול נוכל לה! ויהושע וכלב קרעו את בגדיהם: הארץ טובה מאוד מאוד! אם חפץ בנו ה׳ - יביא אותנו. רק בה׳ אל תמרודו, ואתם אל תיראו!","אבל העם בחר בפחד. ואלוהים גזר: בני עשרים שנה ומעלה לא יראו את הארץ - ארבעים שנה במדבר, שנה לכל יום שהמרגלים תורו. רק כלב ויהושע ייכנסו לארץ. והלילה ההוא - תשעה באב - נשאר לדורות לילה של בכייה."],lesson:"משל: שני חברים טועמים אותה עוגה: אחד אומר טעים, אבל קצת מתוק - וכולם זוכרים רק את המתוק. נמשל: המרגלים פתחו באמת על ארץ טובה, ואז הוסיפו פחד ודיווח עקום - והעם בחר להאמין לפחד. רש״י מלמד: שקר צריך קצת אמת כדי להתקיים. תשאלו תמיד: מה כאן אמת, ומה כאן פחד?",rashi:[{ref:"במדבר יג, כז",quote:"זבת חלב ודבש הוא - כל דבר שקר שאין אומרים בו קצת אמת בתחלתו, אין מתקים בסופו.",explain:"רש״י שם לב שהמרגלים פתחו במילים נכונות - ארץ זבת חלב ודבש - כדי שהשקר שלהם אחר כך יישמע אמין. ככה עובד שקר: קצת אמת בהתחלה, הרבה רע בסוף. לכן בודקים הכול, לא רק את ההתחלה."}]},
{id:"5-4",n:28,title:"בלעם והאתון המדברת",book:"במדבר",chapters:"כב–כד",ages:[5,11,13],holiday:"",topics:["בלעם","אתון","ברכה","מה טבו"],characters:["בלעם","בלק","האתון","המלאך"],summary:"בלק שכר את בלעם לקלל את ישראל, האתון רואה מה שהנביא לא רואה - ובמקום קללה יוצאת ברכה",
body:["בני ישראל חנו בעבר הירדן, ובלק מלך מואב פחד מהם. הוא שלח שליחים עם כסף לבלעם בן בעור, נביא מפורסם: בא, קלל לי את העם הזה! ואלוהים אמר לבלעם: לא תלך עמם, לא תאר את העם - כי ברוך הוא.","בלעם סרב, אבל כשהשליחים חזרו עם עוד כסף וכבוד, הוא מאוד רצה ללכת. אלוהים נתן לו ללכת - אבל רק לדבר את מה שיאמר לו. בלעם רכב על אתונו ויצא.","ובדרך עמד מלאך ה׳ בדרך, עם חרב שלופה. האתון ראתה את המלאך - בלעם לא! היא פנתה לשדה, ובלעם הכה אותה. המלאך עמד במסלול צר, והאתון נצמדה לקיר ולחצה את רגל בלעם - והוא הכה אותה שוב. שלישית, לא היה מקום לפנות - והאתון שכבה תחתיו. ובלעם הכה אותה במקל.","ואז קרה דבר שלא קרה מעולם: ויפתח ה׳ את פי האתון! ותאמר לבלעם: מה עשיתי לך, כי הכיתני זה שלוש רגלים? ובלעם, בלי לחשוב פעמיים, ענה לה - מדבר עם אתון! - כי התעללת בי, לו יש חרב בידי הרגתיך!","ויגל ה׳ את עיני בלעם - והנה המלאך עומד בדרך וחרבו שלופה. בלעם נפל על פניו. הבינאי הגדול ראה פחות מהאתון שלו.","בלעם עלה לגבעות להסתכל על מחנה ישראל, פתח את פיו לקלל - ויצאה ברכה: מה טבו אהליך יעקב, משכנותיך ישראל! שלוש פעמים ניסה לקלל, שלוש פעמים בירך. בלק זעם, וישראל קיבלו ברכה שאנחנו אומרים בבית הכנסת עד היום."],lesson:"משל: תלמיד שכועס על החבר ומכין דבר מר לומר לו - וכשהוא פותח את הפה יוצא משהו אחר לגמרי, כי אמא מסתכלת. נמשל: בלעם רצה לקלל וברך - כי אלוהים שולט במילים. והאתון? לפעמים מי שנראה פשוט רואה את האמת לפני החכם הגדול. לא להכות את מי שמנסה לעצור אותך - לשאול למה הוא נעצר.",rashi:[{ref:"במדבר כב, כח",quote:"זה שלש רגלים - רמז לו: אתה מבקש לעקר אמה החוגגת שלש רגלים בשנה?",explain:"רש״י מסביר שהאתון אמרה שלוש רגלים כרמז: שלוש פעמים בשנה - פסח, שבועות וסוכות - ישראל עולים לרגל לאלוהים. עם עם קשר כזה לאלוהים, בלעם, אתה לא תעקור."},{ref:"במדבר כד, ה",quote:"מה טבו אהליך - על שראה פתחיהם שאינן מכונין זה מול זה.",explain:"רש״י מסביר שבלעם התרשם שהאוהלים של ישראל נבנו כך שאף פתח לא מול פתח - כדי שלא להציץ זה לזה. צניעות וכבוד לפרטיות של אחרים - זה מה שגרם לו לברך."}]},
{id:"5-5",n:29,title:"בנות צלפחד - משפט צודק",book:"במדבר",chapters:"כז",ages:[5,11,13],holiday:"",topics:["צדק","בנות צלפחד","נחלה","אומץ"],characters:["בנות צלפחד","משה","אלוהים"],summary:"חמש אחיות עומדות לפני משה ודורשות צדק - ואלוהים עצמו אומר: כן דוברות",
body:["בספירת הארץ חילקו את הנחלות לפי משפחות - ונחלה עברה לבנים, לא לבנות. ואז הגיעו חמש אחיות: מחלה, נעה, חגלה, מלכה ותרצה - בנות צלפחד, שמת במדבר ולא היו לו בנים.","הן לא התלוננו בצד. הן עמדו לפני משה ואלעזר הכהן וכל העדה, פתח אוהל מועד, ואמרו: אבינו מת במדבר, ולא היו לו בנים. למה יגרע שם אבינו מתוך משפחתו, כי אין לו בן? תנה לנו אחוזה בתוך אחי אבינו!","ומשה, הגדול בשופטים, לא ידע מה לענות. ויקרב משה את משפטן לפני ה׳ - הוא שאל את אלוהים.","ואלוהים ענה: כן בנות צלפחד דוברות! נתון תתן להם אחוזת נחלה בתוך אחי אביהם, והעברת את נחלת אביהן להן. ויותר מזה: מכאן נולד חוק לדורות - אם אין בן, הבת יורשת.","חמש אחיות שאלו שאלה אמיצה - ושינו את החוק. לפעמים צריך רק לעמוד, לדבר ביושר, ולבקש צדק."],lesson:"משל: בכיתה חילקו טופסי טיול רק לבנים, ושלוש בנות ניגשו למורה בשקט ובנימוקים - והמורה שינתה את ההחלטה לכולם. נמשל: בנות צלפחד לא קרעו ולא צעקו - עמדו בפתח אוהל מועד ודיברו בצדק, ואלוהים אמר: כן דוברות. כשרואים עוול - מדברים. בצדק, ביושר, ועד הסוף.",rashi:[{ref:"במדבר כז, ז",quote:"כן בנות צלפחד דוברות - כך כתובה פרשה זו לפני במרום, מגיד שראתה עינן מה שלא ראתה עינו של משה.",explain:"רש״י מסביר: אלוהים אמר שהדין הזה היה כתוב למעלה במדויק כמו שהן אמרו - ושהן ראו דבר שאפילו עינו של משה לא ראתה. כמה חשוב להקשיב לכל דעה - גם למי שאף אחד לא ציפה שילמד את הגדולים."}]},
{id:"5-6",n:30,title:"ספר דברים - משה מלמד את העם מחדש",book:"דברים",chapters:"א–ו",ages:[5,11,13],holiday:"",topics:["דברים","שמע ישראל","מסירה","תורה"],characters:["משה","בני ישראל","יהושע"],summary:"לפני סוף הדרך משה עוצר, מספר את כל הסיפור מחדש - ונותן לעם את שמע ישראל",
body:["ארבעים שנה נגמרו. בני ישראל עומדים בעבר הירדן, מול הארץ. ומשה, שהוליך אותם מיציאת מצרים, יודע שהוא לא ייכנס אתם. לפני שהוא נפרד - הוא עוצר הכול ומדבר. חמישה שבועות של דברים, ומהם נולד ספר שלם: דברים.","משה מספר את כל הסיפור מההתחלה: סיני, המרגלים, המדבר, המלחמות. הוא מזכיר את הטעויות - לא כדי להכעיס, אלא כדי שהדור החדש, שנולד במדבר, ידע מאיפה בא ולא יחזור עליהן.","והוא נותן להם את הלב של כל התורה בכמה משפטים: שמע ישראל, ה׳ אלוהינו, ה׳ אחד! ואהבת את ה׳ אלוהיך בכל לבבך ובכל נפשך ובכל מאודך.","ואיך שומרים את זה? והיו הדברים האלה על לבבך, ושיננתם לבניך - ללמד את הילדים! - ודברת בם בשבתך בביתך ובלכתך בדרך, ובשכבך ובקומך. תורה לא נשמרת בארון. תורה חיה בבית, בדרך, בערב ובבוקר.","בכל יום, שחרית וערבית, ילדים בכל העולם אומרים את שמע ישראל עד היום - בדיוק המילים שמשה אמר בעבר הירדן, לפני שלושת אלפים ומשהו שנה."],lesson:"משל: לפני שאבא נוסע לנסיעה ארוכה הוא יושב עם הילדים ואומר: בואו נדבר. הוא מסכם מה למדנו, ומה חשוב באמת. נמשל: משה ידע שהוא לא ייכנס לארץ - אז הוא השאיר את הדברים הכי חשובים, שאנחנו עד היום אומרים בוקר וערב. דברים חכמים שמוסרים באהבה נשארים לדורות."},
{id:"5-7",n:31,title:"על הר נבו - משה נפרד",book:"דברים",chapters:"לב–לד",ages:[5,11,13],holiday:"",topics:["משה","הר נבו","פרידה","ירושה"],characters:["משה","יהושע","בני ישראל","אלוהים"],summary:"משה מברך את השבטים, עולה להר נבו, רואה את הארץ - ולא קם נביא עוד בישראל כמשה",
body:["בסוף הדרך, משה עשה שני דברים: שר שירה אחרונה - שירת האזינו - וברך את כל שבטי ישראל, שבט שבט, כמו אבא שמברך את ילדיו לפני שהוא נפרד. ואז הוא שם את ידיו על יהושע, והעביר אליו את ההנהגה.","ואלוהים אמר למשה: עלה אל הר נבו, וראה את הארץ. משה עלה לבדו, ומשם ראה את הכול: מגלעד עד דן, ואת כל נפתלי וארץ אפרים ומנשה, עד הים האחרון. הארץ שהבטיח לאברהם, יצחק ויעקב - הוא ראה אותה. אל תוך הארץ לא נכנס, אבל הוא ראה אותה.","וימת שם משה עבד ה׳, בארץ מואב - על פי ה׳. ויקבר אותו בגיא, ולא ידע איש את קברו עד היום הזה. ומשה בן מאה ועשרים שנה במותו - לא כהתה עינו, ולא נס ליחו. כוחו וראייתו נשארו עד הרגע האחרון.","ובני ישראל בכו את משה בעברי מואב שלושים יום. והתורה מסיימת במילים: ולא קם נביא עוד בישראל כמשה, אשר ידעו ה׳ פנים אל פנים.","אבל הסיפור לא נגמר - הוא עובר ידיים: ויהושע בן נון מלא רוח חוכמה, כי סמך משה את ידיו עליו. וישמעו אליו בני ישראל. מכאן מתחילה יחידה 6: כניסה לארץ עם יהושע."],lesson:"משל: קפטן קבוצה שפורש, ובמשחק האחרון מעביר את סרט הקפטן לשחקן הצעיר שאימן. נמשל: משה לא נכנס לארץ, אבל בנה את מי שייכנס - יהושע. לא תמיד מסיימים את כל מה שהתחלנו, וזה בסדר. אם הכנו את מי שממשיך אחרינו - לא הפסדנו, ניצחנו.",rashi:[{ref:"דברים לד, ה",quote:"אפשר משה מת וכתב וימת שם משה? אלא עד כאן כתב משה, מכאן ואילך כתב יהושע.",explain:"רש״י שואל: איך יכול משה לכתוב את המילים על מותו? תשובה אחת: עד כאן כתב משה, ומכאן כתב יהושע. ורבי מאיר אומר תשובה מרגשת: אלוהים אמר, ומשה כתב - בדמע. גם את הפסוקים הכי קשים לו, משה כתב במסירות מלאה."}]}
]},
{id:6,title:"כניסה לארץ וכיבושה",book:"יהושע",chapters:"",status:"ready",stories:[
{id:"6-1",n:32,title:"רחב וחוט השני",book:"יהושע",chapters:"ב",ages:[5,11,13],holiday:"",topics:["רחב","מרגלים","אמונה","יריחו"],characters:["יהושע","רחב","שני המרגלים"],summary:"שני מרגלים נכנסים ליריחו, רחב מסתירה אותם על הגג - ומבקשת חיים בתמורה",
body:["יהושע שלח שני מרגלים - לא שנים עשר! - לתור בשקט את יריחו. הם באו לבית רחב, שביתו היה בתוך חומת העיר. אבל מלך יריחו שמע: נכנסו הנה אנשים מבני ישראל! הוא שלח לרחב: הוציאי את האנשים!","ורחב לקחה את שני האנשים, העלתה אותם לגג, וטמנה אותם בפשתן. ולשליחי המלך אמרה: נכון, אנשים באו - אבל כבר יצאו בשער, מהרו לרדוף אחריהם! הרודפים יצאו, והשער נסגר.","ואז רחב עלתה לגג ואמרה דברים מדהימים: ידעתי כי נתן ה׳ לכם את הארץ! שמענו איך הוביש ה׳ את מי ים סוף, ונמס לבבנו ולא קמה עוד רוח באיש. אישה פשוטה ביריחו שמעה על הנסים - והאמינה.","היא ביקשה: תשבעו לי בה׳ שתשמרו על ביתי. והמרגלים נשבעו: תקשרי את חוט השני הזה בחלון, ותאספי אלייך את אביך ואמך ואחיך וכל ביתך - וכל אשר יהיה בבית, דמו בראשינו אם יגעו בו.","רחב השליכה אותם בחבל דרך החלון, והם ברחו להר, הסתתרו שלושה ימים, וחזרו ליהושע עם בשורה: כי נתן ה׳ בידינו את הארץ! וחוט השני נשאר בחלון - סימן של הבטחה שנשמרת."],lesson:"משל: ילד חדש בכיתה שכולם לוחשים שהקבוצה שלו תפסיד - והוא מחליט לשחק איתם בכל הכוח בכל זאת. נמשל: רחב שמעה על ים סוף והאמינה, כשכל העיר פחדה. אמונה אמיתית היא לבחור צד לפי מה שצודק - לא לפי מה שכולם אומרים. ומי שבוחר נכון - ניצל עם כל ביתו."},
{id:"6-2",n:33,title:"הירדן נעצר - ושנים עשר אבנים",book:"יהושע",chapters:"ג–ד",ages:[5,11,13],holiday:"",topics:["ירדן","נס","אבני זכרון","גלגל"],characters:["יהושע","הכוהנים","בני ישראל"],summary:"הכוהנים נוגעים במי הירדן - והנהר עוצר. העם עובר ביבשה, ויוציאים מהנהר שתים עשרה אבנים",
body:["שלושה ימים אחרי שהמרגלים חזרו, העם עמד מול הירדן. הירדן בשלב הגשמים מלא ושוצף עד כל גדותיו - נהר חזק ומהיר. ויהושע אמר: התקדשו, כי מחר יעשה ה׳ בקרבכם נפלאות.","הכוהנים נשאו את ארון הברית וירדו ראשונים לנהר. וכאשר נטבלו רגלי הכוהנים בשפה - המים העולים מלמעלה עמדו קום נד אחד! הם נערמו כמו חומה, והנהר למטה נכרת לגמרי.","הכוהנים עמדו עם הארון באמצע הירדן, ביבשה, על קרקע הנהר - וכל ישראל עוברים ביבשה, שבט אחר שבט, עד אשר תם כל הגוי לעבור את הירדן. בדיוק כמו ים סוף, דור חדש - נס חדש.","ואז פקודה מיוחדת: שתים עשרה אבנים - אבן לכל שבט - ייקחו מקרקע הירדן, מהמקום שעמדו בו רגלי הכוהנים, ויועברו למחנה בגלגל. למה? כי כאשר ישאלון בניכם מחר לאמר: מה האבנים האלה לכם? - ואמרתם להם: אשר נכרתו מי הירדן מפני ארון ברית ה׳!","האבנים נועדו לשאלות של ילדים. כל דור שואל, וכל דור מספר. בדיוק כמו ליל הסדר."],lesson:"משל: סבתא שומרת בארון כפתור מהמעיל של אבא כשהיה קטן - כדי שפעם הוא ישאל מה זה, והיא תספר. נמשל: שתים עשרה אבנים מקרקע הירדן נועדו בדיוק לזה: שילדים ישאלו מה האבנים האלה? וההורים יספרו. זיכרון חי לא בא מלעצמו - מישהו צריך לשמור אותו, ומישהו צריך לשאול."},
{id:"6-3",n:34,title:"חצוצרות יריחו - החומה נופלת",book:"יהושע",chapters:"ה–ו",ages:[5,11,13],holiday:"",topics:["יריחו","חומה","שופר","נס"],characters:["יהושע","הכוהנים","בני ישראל","רחב"],summary:"שבעה ימים מקיפים את העיר, שבע פעמים בשביעי - ובריעה אחת גדולה החומה נופלת",
body:["יריחו הייתה העיר המבוצרת הראשונה בארץ - חומות ענק, שערים נעולים. בגלגל חגגו קודם את פסח הראשון בארץ, ואז באה התוכנית המוזרה ביותר בהיסטוריה של המלחמות: לא סולמות, לא אילי ניגוח - חצוצרות.","ששה ימים, כל יום אחד: הלוחמים והכוהנים עם שבע חצוצרות היקיפו את העיר פעם אחת - ושתקו. איש לא אמר מילה. רק צעדים ושקט. וביום השביעי - השכימו כעלות השחר, והקיפו שבע פעמים!","ובפעם השביעית, יהושע אמר לעם: הריעו! כי נתן ה׳ לכם את העיר! הכוהנים תקעו בחצוצרות בתקיעה אחת ארוכה - והעם הריע תרועה גדולה. והנה - ותפל החומה! החומה הענקית של יריחו קרסה. העם עלה לעיר ולכד אותה.","והשבועה לרחב נשמרה: שני המרגלים הוציאו את רחב ואת משפחתה - כל מי שהיה בבית עם חוט השני בחלון - והם חיו בישראל. הבטחה היא הבטחה, גם לאישה זרה ביריחו.","החומה הכי מפורסמת בתנ״ך לא נפלה ממכשירי מלחמה. היא נפלה מציות, סבלנות ותרועה. שבעה ימים של שקט - ואז רגע אחד."],lesson:"משל: מתאמן בג׳ודו שכל אימון חוזר על אותה תנועה, שוב ושוב, ורק במבחן מבין למה. נמשל: שישה ימים של הקפה שקטה נראו חסרי טעם - וביום השביעי החומה נפלה. לא כל צעד מראה תוצאה מיד. מי שממשיך לצעוד לפי התוכנית - רואה את החומה נופלת."},
{id:"6-4",n:35,title:"עכן - איש אחד, כל עם אחד",book:"יהושע",chapters:"ז–ח",ages:[11,13],holiday:"",topics:["עכן","חרם","אחריות","העי"],characters:["יהושע","עכן","בני ישראל"],summary:"אחרי ניצחון ענק - מפלה קטנה בעי, בגלל איש אחד שלקח מהחרם",
note:"הסיפור עוסק בחטא ובעונש קשה. מומלץ לגילאי 11 ו-13, ולדבר עליו אחרי הקריאה.",
body:["אחרי יריחו, הכול נראה קל. שלחו לעי הקטנה כמה אלפי חיילים - והם הובסו וברחו! יהושע נפל על פניו: למה? ואלוהים ענה: חטא ישראל! לקחו מן החרם - דברים שהוקדשו לה׳. נסעתם להילחם עם חטא במחנה.","בבוקר, גורלות: שבט אחר שבט, משפחה אחר משפחה, עד שנתפס עכן בן כרמי משבט יהודה. ויהושע אמר לו: בני, שים נא כבוד לה׳ - והודה לו. ועכן הודה: אמנה, אנכי חטאתי לה׳. ראיתי בביזה אדרת שינער יפה, מאתיים שקלים כסף ולשון זהב - ואחמדם ואקחם. והנה הם טמונים בארץ בתוך אהלי.","שליחים רצו לאוהל - ומצאו. בדיוק כמו שאמר. האדרת היפה והכסף והזהב של עיר שלמה, טמונים מתחת לאוהל. בשביל זה נפלו שלושים ושישה חיילים בעי.","עכן נענש בחומרה, כמו שהחוק ציווה. ואז, אחרי שהחטא טופל - עלו שוב לעי, והפעם ניצחו. אותה עיר, אותם חיילים - בלי חטא במחנה.","והלקח נשאר: עם הוא לא סתם הרבה אנשים. כשאחד גונב בחשאי - כולם משלמים. וכשהצדק נעשה - כולם חוזרים לנצח."],lesson:"משל: קבוצה ששחקן אחד בה עבר על החוקים בסתר - והכול התגלגל: כל הקבוצה הושעתה. נמשל: עכן לקח בסתר, והעם הפסיד בגללו. אנחנו אחראים אחד על השני - בסתר ובגלוי. ותשומת לב: עכן אמר ואחמדם ואקחם - קודם היה הרגש, אחר כך המעשה. עוצרים ברגש.",rashi:[{ref:"יהושע ז, כא",quote:"וירא בשלל - התבוננתי במה שכתוב בתורה.",explain:"רש״י מסביר את מילותיו של עכן: הוא הסתכל בשלל והתבונן - חשב. הבעיה התחילה במבט ארוך מדי על דבר אסור. רש״י מזכיר לנו שמעשים מתחילים במבטים ובמחשבות - ושם הכי קל לעצור אותם."}]},
{id:"6-5",n:36,title:"התחבולת של הגבעונים",book:"יהושע",chapters:"ט",ages:[5,11,13],holiday:"",topics:["גבעונים","רמאות","שבועה","בדיקה"],characters:["יהושע","הגבעונים","נשיאי העדה"],summary:"שכנים מתחפשים לשליחים מארץ רחוקה, מקבלים ברית - ואז מתברר שהם גרים ממש כאן",
body:["כל מלכי הארץ שמעו על יריחו והעי - ונאספו להילחם בישראל. אבל יושבי גבעון בחרו בדרך אחרת: תחבולה. הם לבשו בגדים בלים ונעלים מטולאות, לקחו שקים קרועים ונודות יין קרועים וסדורים, ולחם יבש ונקודים - פירורים מעופשים.","הם באו לגלגל ואמרו: מארץ רחוקה מאוד באנו! שמענו את שמע ה׳ אלוהיכם וכל אשר עשה במצרים. עכשיו - כרתו לנו ברית! וישראל הסתכלו על הלחם היבש והבגדים הבלים - ונשמעו.","ויקחו האנשים מצידם - טעמו מהלחם שלהם, בדקו את הראיות - ואת פי ה׳ לא שאלו. יהושע כרת איתם שלום, והנשיאים נשבעו להם.","אחרי שלושה ימים התברר: הם שכנים! גרים בגבעון, כמה ימי הליכה משם! העדה הרגיזה - אבל הנשיאים אמרו: נשבענו להם בה׳. שבועה היא שבועה, גם כשמרמים אותך. הגבעונים נשארו בחיים - ושימשו חוטבי עצים ושואבי מים לעדה.","שני לקחות מסתירים זה את זה: מצד אחד - תמיד לבדוק ולהתייעץ לפני שמחליטים (ואת פי ה׳ לא שאלו). ומצד שני - מילה שניתנה, נשמרת. גם כשמתחרטים."],lesson:"משל: קנית כרטיס למשחק ממישהו עם סיפור משכנע, וביקרת רק את הכרטיס - לא את הזמינות באתר. נמשל: הנשיאים בדקו את הלחם ולא שאלו את אלוהים. הראיות יכולות לשקר, ולכן שואלים, בודקים, מתייעצים - לפני ההחלטה, לא אחריה. ואם כבר נשבעת? עומדים בזה. ככה נראית אמינות."},
{id:"6-6",n:37,title:"שמש בגבעון דום",book:"יהושע",chapters:"י",ages:[5,11,13],holiday:"",topics:["שמש בגבעון","נס","מלחמה","יהושע"],summary:"חמישה מלכים נגד גבעון, צעדת לילה - ויהושע אומר לשמש: דום! והיום לא נגמר",
body:["חמישה מלכי האמורי נתפסו על גבעון - כי עשתה שלום עם ישראל. גבעון שלחה ליהושע: הצילו אותנו! ויהושע קם ועלה בלילה, פתעם - כל הלילה עלה מן הגלגל - ופגע במלכים. וה׳ המם אותם לפני ישראל, והם נמלטו בדרך.","ובמלחמה ההיא יהושע עשה את הדבר הכי נועז שאדם עשה אי פעם: הוא דיבר עם השמש. שמש בגבעון דום, וירח בעמק איילון! - שמש, עמוד. ירח, עמוד. יש עוד מלחמה לנצח, והלילה לא יוריד אותה.","והשמש עמדה! וידום השמש וירח עמד. ויעמוד השמש בחצי השמים, ולא אץ לבוא כיום תמים - כיום שלם! ולא היה כיום ההוא לפניו ואחריו, להשמע ה׳ בקול איש. יום שלם של ניצחון, ואור שלא נגמר.","חמישה מלכים נמלטו למערה במקדה - ונתפסו. והדרך מיריחו דרך העי ועד עמק איילון נפתחה: הארץ נכבשת, צעד אחר צעד, נס אחר נס.","כל ילד שמדליק נר שישי יודע שהשמש שוקעת בזמן. אבל פעם אחת, בשביל עם ישראל בגבעון - השמש חיכתה."],lesson:"משל: משחק שהולך להארכה, ופתאום השופט נותן עוד זמן - ואת הקבוצה שרצתה באמת, זה משנה הכול. נמשל: יהושע לא ביקש נס בשביל הכבוד - הוא ביקש זמן בשביל המשימה. כשיש מטרה גדולה באמת, מבקשים את מה שצריך - גם אם זה נשמע בלתי אפשרי. ואל תמהרו לומר אין זמן: פעם אחת, אפילו השמש עצרה.",rashi:[{ref:"יהושע י, יג",quote:"ביום שעמדה חמה ליהושע, נתמלא כל העולם שמעו של יהושע, ויעמד השמש בחצי השמים ולא אץ לבא כיום תמים.",explain:"רש״י מסביר שביום שהשמש עמדה בשביל יהושע, כל העולם התמלא בשמעו - כולם שמעו על הנס. ככה אלוהים הראה שמה שהיה עם משה - הוא גם עם יהושע."}]},
{id:"6-7",n:38,title:"בחרו לכם היום - ועצמות יוסף בשכם",book:"יהושע",chapters:"כג–כד",ages:[5,11,13],holiday:"",topics:["הבחירה","נאום פרידה","עצמות יוסף","שכם"],characters:["יהושע","בני ישראל"],summary:"יהושע זקן כולל את העם בשכם לברית אחרונה - ואז קוברים שם את עצמות יוסף",
body:["שנים רבות אחרי הכיבוש, יהושע הזקין. הוא אסף את כל השבטים לשכם, והזכיר את כל הדרך: מאברהם עבר הנהר, דרך מצרים והמדבר, ועד הארץ הטובה. ואז הוא שם על השולחן את השאלה הגדולה: בחרו לכם היום את מי תעבדון!","והוא הוסיף את המשפט שכתוב היום על קירות בתים: ואנכי וביתי נעבוד את ה׳! העם ענה: חלילה לנו מעזוב את ה׳! ויהושע בדק אותם שוב: לא תוכלו לעבוד את ה׳, כי אלוהים קדושים הוא! והם עמדו על שלהם: לא! כי את ה׳ נעבוד. ויהושע כרת ברית, וכתב את הדברים בספר תורת אלהים, והעמיד אבן גדולה לעד.","ואז - אירוע קטן בסוף הפרק, שסוגר מעגל של מאות שנים: ואת עצמות יוסף אשר העלו בני ישראל ממצרים - קברו בשכם! יוסף, שמכרו אותו אחיו ליד שכם, והשביע את אחיו: פקד יפקד אלוהים אתכם, והעליתם את עצמותי מזה - חזר הביתה. הבטחה מלפני דורות נקיימה בדיוק כפי שנאמרה.","ויהושע בן נון, עבד ה׳, מת בן מאה ועשר שנים - וקברו אותו בתחום נחלתו. וישראל עבדו את ה׳ כל ימי יהושע, וכל ימי הזקנים אשר האריכו ימים אחרי יהושע.","הספר נסגר, והשאלה נשארת פתוחה לכל דור: בחרו לכם היום. גם לנו."],lesson:"משל: סוף שנת קייטנה, והמדריך שואל כולם: את הערכים של הקייטנה - תיקחו הביתה? נמשל: יהושע לא פקד על הדור הבא - הוא ביקש מהם לבחור. אמונה לא עוברת בירושה, היא נבחרת מחדש כל יום. ועצמות יוסף? הבטחות מקיימים - גם אם לוקח מאתיים שנה.",rashi:[{ref:"יהושע כד, לב",quote:"קברו בשכם - משכם גנבוהו, לשכם החזירוהו.",explain:"רש״י מסביר: משכם גנבו את יוסף, ולשכם החזירו אותו. המעגל נסגר במקום שהכול התחיל. אלוהים זוכר הבטחות יותר טוב מכל אחד - ומחזיר הכול למקום."}]}
]},
{id:7,title:"שופטים - מנהיגים בעם",book:"שופטים",chapters:"",status:"ready",stories:[
{id:"7-1",n:39,title:"אהוד והחרב בעלת שני פיות",book:"שופטים",chapters:"ג",ages:[11,13],holiday:"",topics:["אהוד","עגלון","מואב","תושיע"],characters:["אהוד בן גרא","עגלון מלך מואב"],summary:"בעל יד שמאל נכנס לחדרו של המלך השמן - עם חרב חבויה בירך ימינו",
body:["עגלון מלך מואב הכביד על בני ישראל שמונה עשרה שנה. בני ישראל זעקו לה׳, וה׳ הקים להם מושיע: אהוד בן גרא, איש איטר יד ימינו - בעל יד שמאל.","אהוד הביא מנחה לעגלון, ועל ירכו חבש חרב בעלת שני פיות, תחת בגדיו. השומרים בדקו אותו - מי מחביא נשק על ירך ימין? והוא נכנס פנימה.","ואהוד אמר: דבר סתר יש לי אליך, המלך. המלך אמר: הס! ויצאו ממנו כל העומדים עליו. ואהוד נכנס אליו אל המסדרון בעלית המקרה, כשהוא יושב לו לבדו.","אהוד אמר: דבר א-להים לי אליך. עגלון קם מעל הכסא - ואהוד שלח את יד שמאלו, לקח את החרב מעל ירך ימינו, ויתקעה בבטנו. ויצא הפרשדונה - ואהוד נמלט דרך המסדרון.","וכאשר באו עבדיו וראו את דלתות העלייה נעולות, אמרו: אכן מכסה הוא את רגליו. וחילו עד בוש - והנה אין פותח. לקחו המפתח ופתחו - והנה אדוניהם נופל ארצה מת. ואהוד נמלט עד שהם מתמהמהים, ועבר את הפסילים, וינמל השעירתה.","ויהי כבואו ויתקע בשופר בהר אפרים, וירדו עמו בני ישראל, והוא לפניהם. ויאמר אליהם: רדפו אחרי, כי נתן ה׳ את איביכם את מואב בידכם! והם לכדו את מעברות הירדן למואב, ויכו את מואב כעשרת אלפים איש. ותשקט הארץ שמונים שנה."],
lesson:"אהוד היה שונה - שמאלי, כנראה נחשב לחלש. דווקא מה שחשבו שהוא חולשה היה הכלי להצלה. לפעמים דווקא מה ששונה אצלך הוא מה שאתה יכול לתת לעולם.",
note:"אהוד הורג את עגלון במלכודת - נאמר לילדים בהתאם לגיל."},
{id:"7-2",n:40,title:"דבורה וברק - ואתדו של יעל",book:"שופטים",chapters:"ד-ה",ages:[5,11,13],holiday:"",topics:["דבורה","ברק","סיסרא","יעל","נביאה","שירה"],characters:["דבורה הנביאה","ברק בן אבינועם","סיסרא","יעל אשת חבר"],summary:"אשה נביאה שופטת תחת התמר, אשה אחרת מכניסה את סיסרא לאהל - וישראל שר שירה",
body:["אחרי מות אהוד החזיק יבין מלך כנען בישראל, ושר צבאו סיסרא עם תשע מאות רכבי ברזל - עשרים שנה. ודבורה אשה נביאה, אשת לפידות, היא שפטה את ישראל בעת ההיא, והיא יושבת תחת תמר דבורה, ויעלו אליה בני ישראל למשפט.","ותשלח דבורה ותקרא לברק בן אבינועם: הלוא צוה ה׳ - לך ומשכת בהר תבור ולקחת עמך עשרת אלפים איש! ואולך אליך את סיסרא ונתתיו בידך. וברק אמר: אם תלכי עמי והלכתי, ואם לא תלכי עמי לא אלך. ותאמר דבורה: הלוך אלך עמך - אפס כי לא תהיה תפארתך על הדרך אשר אתה הולך, כי ביד אשה ימכר ה׳ את סיסרא.","ותפרוש ה׳ - הרקיעו אבנים והנהר קישון גרפם. סיסרא ירד מעל המרכבה וברח רגלי - ויבוא לאהל יעל אשת חבר הקיני. יעל הוציאה לו חלב, כיסתו בשמיכה - וכשנרדם לקחה את יתד האהל, תשם את ידה השמאלית על היתד וימינה על מקבת, ותתקע את היתד ברקתו ותצנח ארצה.","וברק רדף אחרי סיסרא - ויעל יצאה לקראתו: לך ואראך את האיש אשר אתה מבקש. ויבא אליה - והנה סיסרא נופל מת.","ויתפרץ עם ישראל לשר שירה: אשרי דבורה, אשרי יעל. ותשקט הארץ ארבעים שנה."],
lesson:"שתי נשים חזקות - נביאה שמנהיגה עם, ואשה פשוטה שאומרת אמת במקום מפחד - משנות דור שלם. לא צריך תואר כדי להיות גדול; צריך אמת ואומץ.",
rashi:[{ref:"שופטים ד, ד",quote:"אשת לפידות - שהיתה עושה פתילות למקדש.",explain:"רש״י מסביר שדבורה עסקה בפתילות של נרות המקדש - אשה שנותנת אור לעם, ממש כמו שהיא עצמה הדליקה אור בישראל."}]},
{id:"7-3",n:41,title:"גדעון - למה אתה מצא אותי?",book:"שופטים",chapters:"ו",ages:[5,11,13],holiday:"",topics:["גדעון","מלאך","נס","גיזת הצמר"],characters:["גדעון בן יואש","מלאך ה׳"],summary:"הדל שבביתו מנקב בגרן - ומלאך קורא לו גיבור החיל",
body:["מדיין עושק את ישראל שבע שנים - באו כאכבה לרב, ובני ישראל עשו להם מנהרות בהרים ומערות. וגדעון בן יואש מנקב חטים בגת, להניס מפני מדיין.","וירא אליו מלאך ה׳ ויאמר לו: ה׳ עמך, גיבור החיל! וגדעון עונה: בי אדוני, ויש ה׳ עמנו - ולמה מצאתנו כל זאת? ואיפה כל נפלאותיו אשר ספרו לנו אבותינו?","ויפן אליו ה׳ ויאמר: לך בכחך זה והושעת את ישראל מכף מדיין - הלוא שלחתיך! וגדעון אומר: בי אדוני, במה אושיע את ישראל? הנה אלפי הדל במנשה, ואנכי הצעיר בבית אבי. ויאמר ה׳ אליו: כי אהיה עמך והכית את מדיין כאיש אחד.","גדעון מבקש אות: תעשה טל על גיזת הצמר לבדה, ועל כל הארץ יהיה חרב. ויהי כן - ויער מן הגיזה טל, מלא הספל מים. ואז הפוך: תהיה הגיזה חרבה ועל כל הארץ יהיה טל. ויהי כן.","ובלילה ההוא, בציווי ה׳, גדעון לוקח עשרה אנשים מעבדיו ומפר את מזבח הבעל של אביו. ויקום ביום - והנה נתץ מזבח הבעל! ויקראו לו ירבעל, לאמר: ירב בו הבעל."],
lesson:"גדעון הרגיש קטן - וה׳ ראה בו גיבור. גודל האדם לא נמדד בכמה הוא גדול בעיני עצמו, אלא במה שהוא עושה עם מה שיש לו."},
{id:"7-4",n:42,title:"שלוש מאות המלקקים",book:"שופטים",chapters:"ז",ages:[5,11,13],holiday:"",topics:["גדעון","שלוש מאות","נס","מלקקים"],characters:["גדעון","שלוש מאות האנשים"],summary:"ה׳ מקטין את הצבא מ-32,000 ל-300 - כדי שכולם ידעו מי הנצח",
body:["צבא מדיין ועמלק ובני קדם שוכן בעמק יזרעאל כארבה לרב. גדעון מגייס 32,000 איש. ויאמר ה׳ אל גדעון: רב העם אשר אתך מתתי את מדיין בידם - פן יתפאר עלי ישראל לאמר, ידי הושיעה לי. קרא נא באזני העם: מי ירא וחרד ישוב ויצפר מהר הגלעד! וישבו עשרים ושנים אלף, וישארו עשרת אלפים.","ויאמר ה׳: עוד העם רב. הורד אותם אל המים ואצרפנו לך שם. גדעון מוריד אותם לשתות: כל אשר ילק בלשונו מן המים כאשר ילק הכלב - תציג אותו לבד. ויהי מספר המלקקים בידם אל פיהם - שלוש מאות איש. ויאמר ה׳: בשלוש מאות האנשים המלקקים אושיע אתכם ונתתי את מדיין בידך!","ובלילה גדעון יורד למחנה עם פורה נערו ושומע איש מספר חלום: הנה ככר צליל לחם שעורים מתהפך במחנה מדיין ויפול על האהל ויהפכהו למעלה ונפל! ויען רעהו: אין זאת בלתי אם חרב גדעון - נתן הא-להים בידו את מדיין!","גדעון חולק את שלוש המאות לשלושה ראשים, ונותן ביד כולם שופרות וכדים ריקים ולפידים בתוך הכדים. תקעו בשופרות ונפצו הכדים ואמרו: חרב לה׳ ולגדעון! והמחנה כולו מתבלבל וישיתו איש חרבו ברעהו - והמחנה נס עד בית השטה."],
lesson:"ה׳ הקטין את הצבא דווקא כדי שאף אחד לא יאמר ידי הושיעה לי. לפעמים דווקא כשיש לנו פחות כוח - רואים מי באמת עוזר לנו.",
rashi:[{ref:"שופטים ז, ו",quote:"המלקקים בידם - אין זה דרך כריעה כלוקק בלשונו.",explain:"רש״י מסביר: מי שמלקק מים מהיד אל הפה מראה שהוא לא מתכופף לקרקע - לא רגיל להשתחוות לעבודה זרה. הצבא הנבחר היה מי שלא כרע מעולם."}]},
{id:"7-5",n:43,title:"יפתח - מילה שנאמרה מוקדם מדי",book:"שופטים",chapters:"יא",ages:[11,13],holiday:"",topics:["יפתח","נדר","בת יפתח"],characters:["יפתח הגלעדי","בת יפתח","זקני גלעד"],summary:"שופט שנדחה חוזר להציל את עמו - ונדר אחד הורס הכול",
body:["יפתח הגלעדי גיבור חיל - אבל אחיו גירשו אותו מבית אביו. הוא ברח לגלות ואספו אליו אנשים ריקים. ואז באו בני עמון להילחם בישראל - וזקני גלעד הלכו לבקש את יפתח בחזרה: לכה ונלחמת בבני עמון. ויפתח אומר: הלוא אתם שנאתם אותי ותגרשוני מבית אבי? וזקני גלעד אומרים: על כן נהיה לך לראש לכל יושבי גלעד. ויפתח הולך עמם - והעם שם אותו לראש ולקצין.","ותהי עליו רוח ה׳, ויעבור את גלעד ומנשה. ואז - רגע לפני המלחמה - יפתח נודר נדר לה׳: אם נתון תתן את בני עמון בידי, והיה היוצא אשר יצא מדלתי ביתי לקראתי בשובי בשלום - והיה לה׳, והעליתהו עולה. מילים מסוכנות.","ויכ את בני עמון מכה גדולה מאד - עשרים עיר. וישוב יפתח המצפה אל ביתו - והנה בתו יוצאת לקראתו בתופים ובמחולות. רק היא יחידה - אין לו זולתה בן או בת. ויהי כראותו אותה ויקרע את בגדיו ויאמר: אהה בתי הכרע הכרעתני!","ותאמר אליו: אבי, פצית את פיך אל ה׳ - עשה לי כאשר יצא מפיך. וביקשה חודשיים ללכת ולבכות על הרים עם רעותיה - ואחר שבה אל אביה, ויעש לה את נדרו אשר נדר. והיתה חק בישראל: מימים ימימה תלכנה בנות ישראל לתנות לבת יפתח הגלעדי ארבעת ימים בשנה."],
lesson:"חכמי ישראל קבעו מיפתח חק: אל תנדרו נדרים בלי לחשוב, ואם נפלת בנדר - לך לחכם, לא אל התקלה. לפני שאומרים הבטחה גדולה - עוצרים רגע וחושבים.",
note:"סוף הסיפור קשה מאוד - בת יפתח נקרבת על נדר אביה. רש״י מסביר שזו הייתה טעות שאפשר היה למנוע בהתייעצות עם פנחס הכהן. מומלץ לקרוא עם הילדים ולדבר על זהירות בדיבור.",
rashi:[{ref:"שופטים יא, לט",quote:"ותהי חק - גזרו שלא יעשה אדם עוד כן, שאלו הלך אצל פנחס, או הוא בא אצלו, היה מתיר לו נדרו, עמדו בגדלתן, ומבין שניהם אבדה.",explain:"רש״י מסביר שיפתח יכול היה להתיר את הנדר אצל פנחס הכהן - אבל שניהם, בגאוותם, חיכו שהשני יבוא. ומחמת הגאווה נאבדה בת יפתח."}]},
{id:"7-6",n:44,title:"שמשון - נזיר מהרחם",book:"שופטים",chapters:"יג-יד",ages:[5,11,13],holiday:"",topics:["שמשון","נזיר","מלאך","אריה"],characters:["מנוח","אשת מנוח","מלאך ה׳","שמשון"],summary:"מלאך מבשר להרה איילת - הבן יהיה נזיר א-להים מהבטן",
body:["אשת מנוח עקרה - אין לה ילדים. וירא אליה מלאך ה׳: הנה נא את הרית וילדת בן. ועתה הישמרי נא ואל תשתי יין ושכר - כי נזיר א-להים יהיה הנער מן הבטן, והוא יחל להושיע את ישראל מיד פלשתים.","מנוח מתפלל לראות את האיש - והמלאך שב. מנוח שואל: מה שמך? והמלאך: למה זה תשאל לשמי - והוא פלאי. מנוח מעלה עולה על הסלע - ויהי בעלות הלהבה מעל המזבח השמימה, ויעל מלאך ה׳ בלהב המזבח! ומנוח אומר לאשתו: מות נמות כי א-להים ראינו. ואשתו החכמה: לו חפץ ה׳ להמיתנו, לא לקח מידנו עולה.","ותלד האשה בן ותקרא את שמו שמשון, ויגדל הנער ויברכהו ה׳. ותחל רוח ה׳ לפעמו במחנה דן.","שמשון יורד תמנתה ורואה אשה מבנות פלשתים. באביו הולכים - והנה כפיר אריות שואג לקראתו! ותצלח עליו רוח ה׳ וישסעהו כשסע הגדי - ומאומה אין בידו. ואחר ימים עובר לראות את פגר האריה - והנה עדת דבורים בגוית האריה, ודבש. וירדהו אל כפיו ויאכל.","ובמשתה שמשון חוד חידה: מהאוכל יצא מאכל, ומעז יצא מתוק. שלושים חברים לא הצליחו לפתור בשבעה ימים."],
lesson:"שמשון קיבל כוח עצום מה׳ - וגם כללים: לא יין, לא טומאה, לא גילוח. כוח גדול בא עם אחריות גדולה. והכוח עצמו הוא לא המתנה - אלא מה שעושים איתו.",
rashi:[{ref:"שופטים יג, ה",quote:"ומורה - תער, על שם שמורה ומשליך את השער.",explain:"רש״י מסביר שהמילה מורה היא תער - כי הנזיר מוריד את שערו בסוף ימי נזירותו, ושמשון נזיר כל ימיו."}]},
{id:"7-7",n:45,title:"שמשון האחרון - תמות נפשי עם פלשתים",book:"שופטים",chapters:"טז",ages:[11,13],holiday:"",topics:["שמשון","דלילה","שער","תשובה"],characters:["שמשון","דלילה","סרני פלשתים"],summary:"דלילה גוזזת את השער, פלשתים מנקרים את העיניים - ושמשון מבקש תפילה אחרונה",
body:["שמשון אהב אשה בנחל שורק ושמה דלילה. ויאמרו אליה סרני פלשתים: פתי אותו וראי במה כחו גדול, ואנחנו נתן לך איש אלף ומאה כסף.","דלילה שואלת: הגידה לי במה כחך גדול. שלוש פעמים שמשון מרמה אותה - עשרת יתרים לחים, חבלים חדשים, שבע מחלפות ראשי עם המסכת. בכל פעם היא קוראת: פלשתים עליך שמשון! והוא נצר. אז היא אמרה לו: איך תאמר אהבתיך ואין לבך אתי! ותאלצהו בדבריה כל היום ותקצר נפשו למות - ויגד לה את כל לבו: מורה לא עלה על ראשי, כי נזיר א-להים אני מבטן אמי. אם גולחתי וסר ממני כחי.","ותישנהו על ברכיה, ותקרא לאיש ותגלח שבע מחלפות ראשו - ותחל לענותו, וסר כחו מעליו. ותאמר פלשתים עליך שמשון! ויער משנתו ויאמר אצא כפעם בפעם ואנער - והוא לא ידע כי ה׳ סר מעליו. ויאחזוהו פלשתים וינקרו את עיניו, ויורידו אותו עזתה ויאסרוהו בנחשתים, ויהי טוחן בבית האסורים.","ושער ראשו החל לצמח כאשר גולח. וסרני פלשתים נאספו לחגוג לדגון - כשלושת אלפים איש ואשה על הגג. ויקראו לשמשון וישחק לפניהם, ויעמידו אותו בין העמודים. ויאמר שמשון אל הנער המחזיק בידו: הניחה אותי והמישני את העמודים.","ויאמר שמשון אל ה׳: אדוני ה׳, זכרני נא וחזקני נא אך הפעם הזה הא-להים! וילפות שמשון בשני עמודי התוך, וינט בכחו - ויפל הבית על הסרנים ועל כל העם. ויהיו המתים אשר המית במותו רבים מאשר המית בחייו. וירדו אחיו ויקברו אותו בקבר מנוח אביו. והוא שפט את ישראל עשרים שנה."],
lesson:"שמשון שילם מחיר כבד - אבל ברגע האחרון חזר אל ה׳ בתפילה, ודווקא זה נכתב. תשובה אמיתית יכולה להיות בשנייה האחרונה, והיא אמיתית לגמרי.",
note:"קץ שמשון אכזרי - עיניים מנוקרות, מוות עם האויב. ספרו לפי הגיל; הנקודה המרכזית לילדים היא התפילה והתשובה.",
rashi:[{ref:"שופטים טז, כח",quote:"זכרני נא - זכר עשרים שנה ששפטתי את ישראל, ולא אמרתי לאחד מהם העבר לי מקל זה ממקום למקום.",explain:"רש״י מסביר מה שמשון ביקש שיזכרו לו: עשרים שנה שפט את ישראל ומעולם לא הטריח אף אחד, אפילו להעביר לו מקל ממקום למקום - ענווה של מנהיג ענק."}]}]},
{id:8,title:"רות - חסד שנבנת ממנו מלכות",book:"רות",chapters:"",status:"ready",stories:[
{id:"8-1",n:46,title:"אל תפגעי בי - רות נצמדת בנעמי",book:"רות",chapters:"א",ages:[5,11,13],holiday:"שבועות",topics:["רות","נעמי","ערפה","חסד","בית לחם"],characters:["נעמי","רות","ערפה"],summary:"אלמנה מואביה מסרבת לעזוב את חמותה - באשר תלכי אלך",
body:["ויהי בימי שפוט השופטים - רעב בארץ. איש מבית לחם יהודה, אלימלך, יורד לשדה מואב עם נעמי אשתו ושני בניו, מחלון וכליון. ואלימלך מת. הבנים נושאים להם נשים מואביות - ערפה ורות - וגם הם מתים. ונעמי נשארת לבדה: בלי בעל, בלי בנים, בארץ זרה.","ותשמע נעמי כי פקד ה׳ את עמו לתת להם לחם - והיא חוזרת לבית לחם. שתי כלותיה הולכות עמה, ונעמי אומרת להן: לכנה שובנה אשה לבית אמה. עשה ה׳ עמכם חסד, כאשר עשיתם עם המתים ועמדי. תתן ה׳ לכם ומצאנה מנוחה אשה בית אישה. ותשק להן ותשאנה קולן ותבכינה.","וערפה נושקת לחמותה - וחוזרת אל עמה ואל א-להיה. ורות - דבקה בה. נעמי אומרת: שובי אחרי יבמתך! ורות עונה את התשובה המפורסמת בתנ״ך: אל תפגעי בי, לעזבך לשוב מאחריך. כי אל אשר תלכי אלך, ובאשר תליני אלין; עמך עמי, וא-להיך א-להי. באשר תמותי אמות ושם אקבר. כה יעשה ה׳ לי וכה יוסיף, כי המוות יפריד ביני ובינך.","ותרא נעמי כי מתאמצת היא ללכת אתה - ותחדל לדבר אליה. והן באות בית לחם בתחילת קציר שעורים, וכל העיר הומה עליהן: הזאת נעמי? ונעמי אומרת: אל תקראנה לי נעמי - קראן לי מרא, כי המר שד-י לי מאד. אני מלאה הלכתי, וריקם השיבני ה׳."],
lesson:"ערפה בכתה וחזרה - ורות בכתה ונשארה. חסד אמיתי הוא לא דיבורים גדולים אלא להישאר כשקשה. רות לא ידעה מה יהיה; היא רק ידעה שהיא לא עוזבת.",
rashi:[{ref:"רות א, טז",quote:"אל תפגעי בי - אל תפצרי בי.",explain:"רש״י מסביר: רות מבקשת מנעמי - אל תלחצי עלי יותר לחזור. היא החליטה, והלב שלה כבר קשור."}]},
{id:"8-2",n:47,title:"אלכה נא השדה - לקט וחסד",book:"רות",chapters:"ב",ages:[5,11,13],holiday:"שבועות",topics:["רות","בועז","לקט","שדה"],characters:["רות","נעמי","בועז"],summary:"גריה ענייה יוצאת ללקט שיבולים - ומקרה שלה נופל דווקא בשדה של בועז",
body:["בבית לחם רעב כבר אין, אבל כסף גם אין. רות אומרת לנעמי: אלכה נא השדה ואלקטה בשבלים אחרי אשר אמצא חן בעיניו. לקט - זכות של עניים: הפועלים חוזרים על שיבולים שנפלו, והעניים מלקטים אחריהם.","ותלך ותבוא ותלקט בשדה אחרי הקוצרים. ויקר מקרה - חלקת השדה לבועז, ממשפחת אלימלך, איש גיבור חיל.","ובועז בא מבית לחם ואומר לקוצרים: ה׳ עמכם! והם עונים: יברכך ה׳. וירא את רות וישאל: למי הנערה הזאת? ועבדו עונה: נערה מואביה היא, השבה עם נעמי משדה מואב. ותאמר אליי: אלקטה נא ואספתי בעמרים אחרי הקוצרים. ותבוא ותעמוד מאז הבקר - עד עתה, ושבתה הבית מעט.","בועז שמע מי היא - אשת החסד שלא עזבה את נעמי."],
lesson:"רות יכולה הייתה לשבת ולבכות. במקום זה היא קמה והלכה לעבוד בשביל זקנה אחרת. כשהחיים קשים - הצעד הקטן של הבוקר הוא שמשנה הכול.",
rashi:[{ref:"רות ב, ב",quote:"אלכה נא השדה - לאחד משדות אנשי העיר אחרי אחד מהם \"אשר אמצא חן בעיניו\", שלא יגער בי.",explain:"רש״י מסביר את כוונת רות: היא חיפשה שדה של מי שיקבל אותה בחן - לא לגער בה על שהיא לוקטת. גם בענייה, היא מחפשת מקום של כבוד."}]},
{id:"8-3",n:48,title:"שי ותשארי - בועז דואג לרות",book:"רות",chapters:"ב",ages:[5,11,13],holiday:"שבועות",topics:["בועז","רות","חסד","כנפיים"],characters:["בועז","רות","הקוצרים"],summary:"בועז אומר לרות: אל תלכי ללקט בשדה אחר - ומצווה על הקוצרים להשליך לה",
body:["בועז קורא לרות: הלוא שמעת בתי? אל תלכי ללקט בשדה אחר, וגם לא תעבורי מזה. וכה תדבקין עם נערותי. וכשצמאת והלכת אל הכלים ושתית מאשר ישאבון הנערים.","ותפול רות על פניה ותשתחו ארצה: מדוע מצאתי חן בעיניך להכירני, ואנכי נכריה? ויען בועז: הוספור הוסף לי כל אשר עשית את חמותך אחרי מות אישך - ותעזבי אביך ואמך וארץ מולדתך, ותלכי אל עם אשר לא ידעת אתמול שלשום. ישלם ה׳ פעלך, ותהי משכרתך שלמה מעם ה׳ א-להי ישראל, אשר באת לחסות תחת כנפיו.","ובעת האכול אומר לה בועז: גשי הלום ואכלת מן הלחם. ובקציר מצווה את נעריו בסתר: וגם של תשלו לה מן הצבתים, ועזבתם ולקטה - ולא תגערו בה.","ותלקט רות עד הערב - ותחבוט את אשר לקטה: כאיפה שעורים! תביא לנעמי, ונעמי שואלת: איפה לקטת היום? ורות מספרת: שם האיש בועז. ונעמי אומרת: ברוך הוא לה׳, אשר לא עזב חסדו את החיים ואת המתים! מקרוב לנו האיש - מגאלנו הוא."],
lesson:"בועז לא נתן לרות צדקה מלמעלה. הוא נתן לה לעבוד בכבוד, ואפילו ציווה להשליך לה שיבולים בחשאי. חסד הכי גדול הוא חסד ששומר על הכבוד של מי שמקבל."},
{id:"8-4",n:49,title:"הגרן בלילה - פרש כנפך",book:"רות",chapters:"ג",ages:[11,13],holiday:"שבועות",topics:["רות","בועז","גרן","גאולה"],characters:["רות","בועז","נעמי"],summary:"נעמי שולחת את רות לגרן בלילה - ובועז מתעורר בחצי הלילה",
body:["נעמי רואה שהקציר נגמר והלב שלה דואג: בתי, הלא אבקש לך מנוחה, אשר ייטב לך? והיא אומרת לרות: הלוא בועז מדעתנו? הנה הוא זורה את הגרן הלילה. ורחצת וסכת ושמת שמלותיך עליך, וירדת הגרן. כאשר ישכב, ראי את המקום, ובאת וגלית מרגלותיו ושכבת - והוא יגיד לך מה תעשין. ורות עונה: כל אשר תאמרי - אעשה.","ותרד רות הגרן ותעש ככל אשר צותה חמותה. בועז אוכל ושותה וייטב לבו, וישכב בקצה הערמה. ורות באה בלט, ותגל את מרגלותיו, ותשכב.","ויהי בחצי הלילה ויחרד האיש וילפת - והנה אשה שוכבת מרגלותיו! ויאמר: מי את? ותאמר: אנכי רות אמתך. ופרשת כנפך על אמתך, כי גואל אתה.","ובועז עונה: ברוכה את לה׳ בתי! הטבת חסדך האחרון מן הראשון, לבלתי לכת אחרי הבחורים. ועתה בתי אל תיראי - כל אשר תאמרי אעשה לך, כי יודע כל שער עמי כי אשת חיל את. וגם אמת: יש גואל קרוב ממני. ליני הלילה - והיה בבוקר, אם יגאלך טוב יגאל, ואם לא יחפץ לגאלך וגאלתיך אנכי, חי ה׳!","ותשכב עד הבוקר ותקם בטרום יכיר איש את רעהו, ובועז נותן לה שש שעורים - ותבוא העיר. נעמי שואלת: מי את בתי? ורות מספרת הכול, ונעמי אומרת: שבי בתי עד אשר תדעין איך יפול דבר - כי לא ישקט האיש כי אם כלה הדבר היום."],
lesson:"רות ובועז שניהם נזהרים בכל פרט - בלילה, בלט, בכבוד. דווקא כשהדבר רגיש, הכבוד ההדדי הוא שהופך אותו לברכה ולא לצרה.",
note:"סצנת הגרן עדינה ומרומזת במקור. לילדים צעירים מספיק: רות באה לבקש מבועז שיגאל את המשפחה.",
rashi:[{ref:"רות ג, יג",quote:"ליני הלילה - ליני בלא איש.",explain:"רש״י מסביר את כוונת בועז: רות לא תישאר בגרן כפי שבאה - הכול ייעשה ביושר, בשער העיר, בפני זקנים."}]},
{id:"8-5",n:50,title:"השער - הגואל שלא רצה, ובועז שרצה",book:"רות",chapters:"ד",ages:[5,11,13],holiday:"שבועות",topics:["בועז","גאולה","שער העיר","חליצה","נעל"],characters:["בועז","פלוני אלמוני","עשרה זקנים"],summary:"בועז יושב בשער, מזמן עשרה זקנים - ומחכה שהגואל הקרוב יעבור",
body:["ובועז עלה השערה וישב שם. והנה הגואל עובר, אשר דבר בועז! ויאמר: סורה שבה פה, פלוני אלמוני. ויסר וישב. ויקח עשרה אנשים מזקני העיר ויאמר: שבו פה.","ויאמר לגואל: חלקת השדה אשר לאחינו לאלימלך, מכרה נעמי. ואני אמרתי אגלה אוזנך: קנה נגד היושבים ונגד זקני עמי. אם תגאל - גאל; ואם לא יגאל - הגידה לי. ויאמר: אנכי אגאל.","ויאמר בועז: ביום קנותך השדה מיד נעמי, ומאת רות המואביה אשת המת קנית - להקים שם המת על נחלתו. ויאמר הגואל: לא אוכל לגאול לי, פן אשחית את נחלתי! גאל לך את גאולתי, כי לא אוכל לגאול.","וזאת לפנים בישראל על הגאולה ועל התמורה לקים כל דבר: שלף איש נעלו ונתן לרעהו. ויאמר הגואל לבועז: קנה לך - וישלף נעלו.","ויאמר בועז לזקנים ולכל העם: עדים אתם היום, כי קניתי את כל אשר לאלימלך מיד נעמי. וגם את רות המואביה אשת מחלון קניתי לי לאשה, להקים שם המת על נחלתו. וכל העם אשר בשער עונים: עדים! ומברכים: יתן ה׳ את האשה הבאה אל ביתך כרחל וכלאה, אשר בנו שתיהן את בית ישראל!"],
lesson:"הגואל הקרוב אמר כן - ואז אמר לא. בועז אמר כן - ועשה. דיבור יפה לא בונה בית; מעשים בונים.",
rashi:[{ref:"רות ד, יא",quote:"כרחל וכלאה - אף על פי שהיו משבט יהודה ומבני לאה, מודים הם על רחל שהיתה עקרה של בית, והקדימו רחל ללאה.",explain:"רש״י מסביר: אפילו אנשי יהודה, צאצאי לאה, הודו שרחל הייתה עקרת הבית - ככה העם בירך את רות שתהיה עקרת בית ישראל."}]},
{id:"8-6",n:51,title:"ותקראנה לו שם - עובד אבי דוד",book:"רות",chapters:"ד",ages:[5,11,13],holiday:"שבועות",topics:["עובד","דוד","משפחה","תולדות"],characters:["רות","בועז","נעמי","עובד","השכנות"],summary:"ילוד בן - והשכנות אומרות לנעמי: היא טובה לך משבעה בנים",
body:["ויקח בועז את רות ותהי לו לאשה - ויתן ה׳ לה הריון, ותלד בן.","ותאמרנה הנשים אל נעמי: ברוך ה׳ אשר לא השבית לך גואל היום! והיה לך למשיב נפש ולכלכל את שיבתך - כי כלתך אשר אהבתך ילדתו, אשר היא טובה לך משבעה בנים.","ותקח נעמי את הילד ותשיתהו בחיקה, ותהי לו לאומנת. ותקראנה לו השכנות שם לאמר: ילד בן לנעמי! ותקראנה שמו עובד.","והוא אבי ישי - אבי דוד. רות המואביה, הגריה שבאה עם כלום, היא הסבתא של דוד מלך ישראל.","וזה הסוד של מגילת רות: מלכות בית דוד לא נולדה מכוח ומגדולה. היא נולדה מחסד קטן בשדה, מנאמנות של אלמנה, ומאדם ישר בשער העיר."],
lesson:"אף אחד לא יודע מה גדל מהחסד שלו. רות חשבה שהיא עוזרת לאישה זקנה אחת - ובנתה את בית דוד. החסד הקטן של היום הוא שורש של דברים גדולים."}]},
{id:9,title:"שמואל א - נביא אחרון ומלך ראשון",book:"שמואל א",chapters:"",status:"ready",stories:[
{id:"9-1",n:52,title:"חנה - התפילה שנולדה בלחש",book:"שמואל א",chapters:"א-ב",ages:[5,11,13],holiday:"",topics:["חנה","שמואל","תפילה","שילה","עלי"],characters:["חנה","אלקנה","פנינה","עלי הכהן"],summary:"אישה עקרה מתפללת בשפתיים בלבד - ועלי הכהן חושב שהיא שיכורה",
body:["ברמותים חי איש אחד, אלקנה, ולו שתי נשים: לפנינה ילדים, ולחנה אין ילדים. וכל שנה היו עולים לשילה להשתחוות לה׳ - ופנינה הייתה מכעיסה את חנה, כי סגר ה׳ את רחמה. וחנה בכתה ולא אכלה.","ביום אחד, אחרי אכילה ושתיה בשילה, חנה קמה ונצבה לפני ה׳. ועלי הכהן יושב על הכסא על מזוזת היכל ה׳. וחנה מרת נפש - ותתפלל על ה׳, ובכה תבכה. ותנדר נדר: אם ראה תראה בעני אמתך ונתת לאמתך זרע אנשים - ונתתיו לה׳ כל ימי חייו, ומורה לא יעלה על ראשו.","והיא מדברת על לבה - רק שפתיה נעות, וקולה לא יישמע. ועלי רואה את שפתיה וחושב שהיא שיכורה! ויאמר אליה: עד מתי תשתכרין? וחנה עונה: לא אדוני, אשה קשת רוח אנכי. את מרי נפשי שפכתי לפני ה׳. ויען עלי: לכי לשלום - א-להי ישראל יתן את שלתך אשר שאלת מעמו.","ותלד חנה בן ותקרא את שמו שמואל - כי מה׳ שאלתיו. וכאשר גמלה אותו, העלתה אותו לשילה, עם פרים ואיפה קמח ונבל יין. ותאמר לעלי: אנכי האשה הנצבת עמכה בזה להתפלל אל ה׳! אל הילד הזה התפללתי - וגם אנכי השאלתהו לה׳ כל הימים אשר הוא שאול לה׳.","ותתפלל חנה שירה גדולה: רמה קרני בה׳! ושמואל נשאר בשילה, משרת לפני ה׳ - נער חגור אפוד בד."],
lesson:"תפילה לא חייבת להיות בקול גדול. חנה דיברה על לבה, בשפתיים נעות בלי קול - וממנה למדנו איך מתפללים עד היום. לפעמים הדברים הכי אמיתיים נאמרים בלחש.",
rashi:[{ref:"שמואל א א, יג",quote:"ויחשבה עלי לשכורה - שלא היו רגילין להתפלל בלחש.",explain:"רש״י מסביר למה עלי טעה: באותם ימים אף אחד לא התפלל בלחש. חנה המציאה תפילה חדשה - וממנה באה תפילת העמידה שלנו."}]},
{id:"9-2",n:53,title:"הנער שמואל - ה׳ קורא בלילה",book:"שמואל א",chapters:"ג",ages:[5,11,13],holiday:"",topics:["שמואל","עלי","נבואה","שילה"],characters:["שמואל","עלי הכהן"],summary:"קול קורא בלילה לנער - שלוש פעמים הוא רץ לעלי, עד שעלי מבין",
body:["והנער שמואל משרת את ה׳ לפני עלי. ודבר ה׳ היה יקר בימים ההם - אין נבואה מפרצת. ויהי ביום ההוא: עלי שוכב במקומו, ועיניו החלו כהות, ונר א-להים טרם יכבה, ושמואל שוכב בהיכל ה׳ אשר שם ארון א-להים.","ויקרא ה׳ אל שמואל! ויאמר: הנני. וירץ אל עלי: הנני, כי קראת לי. ועלי אומר: לא קראתי - שוב שכב. וילך וישכב. ויקרא ה׳ עוד, שמואל! ויקם שמואל וילך אל עלי: הנני. ויאמר: לא קראתי בני, שוב שכב. ופעם שלישית! ועלי מבין כי ה׳ קורא לנער.","ויאמר עלי: לך שכב, והיה אם יקרא אליך ואמרת: דבר ה׳ כי שומע עבדך. ויבוא ה׳ ויתיצב ויקרא כפעם בפעם: שמואל, שמואל! ויאמר שמואל: דבר, כי שומע עבדך.","וה׳ גילה לו דברים קשים על בית עלי - ושמואל פתח את דלתות בית ה׳ כרגיל בבוקר, ופחד מהגיד לעלי. ועלי קרא לו: שמואל בני. ויאמר: הנני. ויעל עליו שבועה שלא יכחד ממנו דבר - ושמואל הגיד לו הכול. ויאמר עלי: ה׳ הוא, הטוב בעיניו יעשה.","ויגדל שמואל, וה׳ היה עמו, ולא הפיל מכל דבריו ארצה. וידע כל ישראל מדן ועד באר שבע כי נאמן שמואל לנביא לה׳."],
lesson:"שמואל היה ילד - וה׳ דיבר דווקא אליו. ומה שהוא אמר בבוקר? דבר, כי שומע עבדך. הכנה להקשיב היא ההתחלה של כל גדולה."},
{id:"9-3",n:54,title:"הארון נלקח - ודגון נופל על פניו",book:"שמואל א",chapters:"ד-ו",ages:[5,11,13],holiday:"",topics:["ארון","פלשתים","דגון","עלי","אשדוד"],characters:["עלי הכהן","חופני ופינחס","איש בנימין","פלשתים"],summary:"ישראל מוציא את הארון למלחמה כמו קמע - והארון נלקח בשבי",
body:["פלשתים יוצאים למלחמה בישראל - וישראל מובס, ארבעת אלפים איש. וזקני ישראל אומרים: נקחה אלינו משילה את ארון ברית ה׳, ויבוא בקרבנו ויושיענו! הם חשבו שהארון עצמו יושיע - בלי לב.","וכאשר בא ארון ברית ה׳ אל המחנה, ויריעו כל ישראל תרועה גדולה. ופלשתים נבהלו: אל אלינו, היום! ופלשתים נלחמו - וישראל נפלו שלושים אלף רגלי. וארון הא-להים נלקח, ושני בני עלי - חופני ופינחס - מתו.","ואיש בנימין רץ מהמערכה ויבוא שילה, בגדיו קרועים ואדמה על ראשו. ועלי יושב על הכסא בדרך מסכל - כי היה לבו חרד על ארון הא-להים. והאיש מספר: נס ישראל, ושני בניך מתו, וארון הא-להים נלקח. וכאשר הזכיר את ארון הא-להים - ויפל עלי מעל הכסא אחורנית, ותשבר מפרקתו וימת. תשעים ושמונה שנה, ושפט את ישראל ארבעים שנה.","ופלשתים שמים את הארון בבית דגון באשדוד. וישכימו אשדודים למחרת - והנה דגון נופל לפניו ארצה, לפני ארון ה׳! הם מחזירים אותו - ובבוקר הבא דגון נופל, וראש דגון ושתי כפות ידיו כרותות אל המפתן; רק דגון נשאר עליו. ויד ה׳ תכבד על האשדודים. שבעה חודשים היה הארון בשדה פלשתים - עד שהחזירו אותו עם מנחה: עגלה חדשה וקרון."],
lesson:"ישראל חשבו שהארון הוא קמע - סמל שמציל בלי קשר ללב. הפלשתים למדו שהארון הוא דבר אמיתי. הלקח לשני הצדדים: ה׳ לא גר בתיבה; ה׳ גר בלב.",
note:"מתים בסיפור: חופני ופינחס ועלי. השלב של דגון והמחלות בפלשתים - ספרו בעדינות לפי הגיל."},
{id:"9-4",n:55,title:"שאול - מחפש אתונות, נמצא מלך",book:"שמואל א",chapters:"ט-י",ages:[5,11,13],holiday:"",topics:["שאול","שמואל","מלך","אתונות"],characters:["שאול בן קיש","שמואל","נערו של שאול"],summary:"בחור גבוה שיצא לחפש אתונות אבודות - ושמואל סך אותו למלך",
body:["בני ישראל מבקשים מלך - ככל הגויים. שמואל מתרעם, וה׳ אומר לו: שמע בקול העם - כי לא אותך מאסו, כי אותי מאסו ממלוך עליהם.","ובזמן ההוא אבדו אתונות לקיש איש בנימין. וקיש אומר לבנו שאול: קח נא אתך את אחד הנערים ולך בקש את האתונות. שאול והנער עוברים בהר אפרים ובארץ שלשה - ולא מצאו. שאול רוצה לחזור: פן יחדל אבי מן האתונות ודאג לנו. והנער אומר: הנה נא איש א-להים בעיר הזאת, והאיש נכבד - כל אשר ידבר בוא יבוא! נלכה שמה.","הם עולים לעיר - ושמואל יוצא לקראתם. וה׳ כבר גילה את אוזן שמואל: בעת מחר אשלח אליך איש מארץ בנימין, ומשחתו לנגיד על עמי ישראל! וכאשר ראה שמואל את שאול - וה׳ ענהו: הנה האיש! ושאול גבה מכל העם משכמו ומעלה.","ושמואל לוקח את שאול ונערו ללשכה, נותן לו את השוק הטובה. ולמחרת בבוקר, על הגג, שמואל מושח את שאול בשמן ונותן לו אותות. ובמסיבת הגורל במצפה - שאול נבחר, ומתחבא בין הכלים! מבושת של מלך ענו. וכל העם מריע: יחי המלך!"],
lesson:"שאול יצא לחפש אתונות - ומצא מלכות. אבל שימו לב: הוא לא חיפש מלכות. הוא עשה את השליחות הקטנה של אביו בדיוק - ודרכה בא הדבר הגדול.",
rashi:[{ref:"שמואל א ט, כ",quote:"ולמי כל חמדת ישראל - כאן בא לרמוז לו דבר המלוכה.",explain:"רש״י מסביר: שמואל רמז לשאול עוד לפני המשיחה - כל מה שישראל מייחלים לו, כל החמדה, הולך להיות עליו ועל בית אביו."}]},
{id:"9-5",n:56,title:"להשמיע טוב מזבח - שאול ועמלק",book:"שמואל א",chapters:"טו",ages:[11,13],holiday:"",topics:["שאול","עמלק","שמואל","אגג","מלכות"],characters:["שאול","שמואל","אגג מלך עמלק"],summary:"שאול חוס על אגג ועל הטוב שבצאן - ומאבד את המלכות",
body:["ה׳ ציווה דרך שמואל: לך והכיתה את עמלק - מה שעמלק עשה לישראל בדרך ממצרים, כשתקף את הנחשלים אחריך. והחרמתם את כל אשר לו, ולא תחמול עליו.","ושאול יוצא למלחמה - והכה את עמלק מהבילה עד שור. ויתפס את אגג מלך עמלק חי. וישאו ויחמול שאול והעם על אגג, ועל מיטב הצאן והבקר - ולא החרימו.","ויהי דבר ה׳ אל שמואל: ניחמתי כי המלכתי את שאול למלך, כי שב מאחרי. ושמואל זעק אל ה׳ כל הלילה. ובבוקר שמואל בא אל שאול - ושאול אומר: ברוך אתה לה׳, הקימותי את דבר ה׳! ושמואל: ומה קול הצאן הזה באזני, וקול הבקר אשר אנכי שומע? ושאול אומר: מעמלקי הביאום, אשר חמל העם על מיטב הצאן - למען זבוח לה׳!","ושמואל עונה את המשפט המפורסם: החפץ לה׳ בעולות וזבחים - כשמוע בקול ה׳? הנה שמוע מזבח טוב, להקשיב מחלב אילים! כי חטאת קסם מרי, ואון ותרפים הפצר. יען מאסת את דבר ה׳ - וימאסך ממלך.","ואגג מלך עמלך מת. ושמואל לא יסף עוד לראות את שאול עד יום מותו - כי התאבל שמואל על שאול."],
lesson:"שאול עשה כמעט הכול - אבל החליט בעצמו איזה חלק לקיים. להשמיע טוב מזבח: מצווה היא לא מה שנוח לנו ממנה, אלא כולה.",
note:"עונשו של שאול קשה, והחרמת עמלק היא פסוקים שקשה לילדים לעכל - התמקדו במסר של שמוע מזבח ובבחירה של שאול לחמול דווקא על הטוב.",
rashi:[{ref:"שמואל א טו, כב",quote:"הנה שמע - בקולו, טוב מזבח.",explain:"רש״י מסביר: לשמוע בקול ה׳ - זה טוב יותר מזבח. הכוונה במילה שמוע היא הקשבה מלאה, לא חצי שמיעה."}]},
{id:"9-6",n:57,title:"דוד וגליית - בא לך בשם ה׳",book:"שמואל א",chapters:"יז",ages:[5,11,13],holiday:"",topics:["דוד","גליית","קלע","אבן","ישי","אליעב"],characters:["דוד","גליית","שאול","ישי","אליעב"],summary:"רועה צעיר יוצא עם חמש אבני חלוק - נגד ענק שחרף את ישראל ארבעים יום",
body:["גליית הפלשתי מגת, גבוהו שש אמות וזרת, שריון משקל חמשת אלפים שקלים - יוצא ומתחרף את מערכות ישראל ארבעים יום: אני חרפתי את מערכות ישראל! תנו לי איש ונלחמה יחד. ואיש מישראל לא עונה - כולם פוחדים.","ודוד בן ישי אפרתי מבית לחם - צעיר האחים, רועה צאן. אביו שולח אותו להביא לחם לאחיו במחנה. דוד שומע את גליית - ושואל: מי הפלשתי הערל הזה כי חרף מערכות א-להים חיים? ואליעב אחיו הגדול כועס עליו: למה זה ירדת, ועל מי נטשת מעט הצאן ההנה במדבר?","שאול שומע ומזמין את דוד. דוד אומר: את הארי ואת הדוב הכה עבדך, כשבא על הצאן! ה׳ אשר הצילני מיד הארי ומיד הדוב - הוא יצילני מיד הפלשתי הזה. שאול מלביש אותו שריון - ודוד מנסה ואומר: לא אוכל ללכת באלה, כי לא נסיתי. ויסרם מעליו.","ויקח דוד מקלו בידו, ויבחר לו חמשה חלוקי אבנים מן הנחל, ויקרב אל הפלשתי. גליית רואה נער אדמוני עם יפה עינים ומזלזל בו: הכלב אנכי כי אתה בא אלי במקלות? ודוד עונה: אתה בא אלי בחרב ובחנית ובכידון - ואנכי בא אליך בשם ה׳ צבאות, א-להי מערכות ישראל אשר חרפת! והיום הזה יסגרך ה׳ בידי - וידעה כל הארץ כי יש א-להים לישראל.","וימהר דוד וירץ המערכה לקראת הפלשתי, וישלח ידו אל הכלי, ויקח משם אבן, ויקלע - ויך את הפלשתי אל מצחו, ותטבע האבן במצחו, ויפל על פניו ארצה. וירץ דוד ויעמד על הפלשתי, ויקח את חרבו וימתהו. ופלשתים נסו - ובני ישראל רדפו אחריהם עד שערי עקרון."],
lesson:"דוד לא ניצח בגלל שהיה חזק - הוא ניצח כי ידע למי הוא שייך. חמש אבנים ושם ה׳ מנצחים שריון של חמשת אלפים שקלים. הגדולה האמיתית היא לדעת עם מה באים.",
rashi:[{ref:"שמואל א יז, מט",quote:"ויפל על פניו - לא היה לו לפול אלא לאחוריו, שהרי על מצחו הכה, אלא כדי שלא יצטער דוד לילך ולחתך את ראשו.",explain:"רש״י שם לב לפרט מוזר: גליית נפל קדימה על פניו, אף שהאבן פגעה במצחו. רש״י מסביר: נס קטן בתוך הנס - כדי שלא יצטרך דוד ללכת עוד מלא קומה כדי לחתוך את ראשו."}]},
{id:"9-7",n:58,title:"אביגיל - אשה שעצרה מלך בדרך",book:"שמואל א",chapters:"כה",ages:[11,13],holiday:"",topics:["אביגיל","נבל","דוד","חכמה"],characters:["דוד","אביגיל","נבל הכרמלי"],summary:"נבל מסרב לתת לחם לדוד - ואביגיל יוצאת לקראתו עם שני מאות ככרות",
body:["דוד בורח משאול במדבר פארן, והאנשים שלו שומרים על הצאן של נבל הכרמלי - איש עשיר מאוד, אך קשה ורע מעללים, כשמו כן הוא: נבל שמו ונבלה עמו. וביום גזז הצאן דוד שולח עשרה נערים לבקש בנימוס: תנו נא את אשר תמצא ידך לעבדיך ולבנך לדוד.","ונבל עונה בגסות: מי דוד ומי בן ישי? ואקחתי את לחמי ואת מימי ואת טבחתי אשר טבחתי לגוזזי - ונתתי לאנשים אשר לא ידעתי אי מזה המה? והנערים חוזרים לדוד - ודוד אומר לאנשיו: חגרו איש את חרבו! ויעלו אחריו כארבע מאות איש לנקום.","ועבד אחד מספר לאביגיל אשת נבל - אשת טובת שכל ויפת תואר. ותמהר אביגיל, ותקח מאתיים לחם ושני נבלי יין וחמש צאן עשויות, ותרכב על החמור ותרד בסתר ההר - והנה דוד ואנשיו יורדים לקראתה!","ותפל אביגיל לרגלי דוד, ותקח את האשמה עליה: בי אני אדוני העון! ואל ישום לבו אל איש הבליעל על נבל - כי כשמו כן הוא. ועתה, חי ה׳ אשר מנעך מבוא בדמים והושע ידך לך! ואם לא היית מיהרת ותבאת לקראתי - לא נותר לנבל עד אור הבוקר משתין בקיר. ותבקש סליחה: והיה כי ייטיב ה׳ לאדוני - וזכרת את אמתך.","ודוד מקבל: ברוך ה׳ אשר שלחך היום הזה לקראתי, וברוך טעמך! ואביגיל חוזרת הביתה. ויהי בבוקר - ויגדה לו את הדברים האלה, וימת לבו בקרבו. ויהי כעשרת ימים ויגף ה׳ את נבל וימת. ודוד שולח ויקח את אביגיל לו לאשה."],
lesson:"אביגיל לא התווכחה ולא צעקה. היא באה מוכנה - עם לחם, עם כבוד, ועם דברי אמת קשים אבל עדינים. חכמה וכבוד עוצרים מלחמה טוב יותר מכל חרב."}]},

/* ===== STATE ===== */
const $=id=>document.getElementById(id);
let read={};try{read=JSON.parse(localStorage.getItem("tsr-read")||"{}")}catch(e){read={}}
function saveRead(){try{localStorage.setItem("tsr-read",JSON.stringify(read))}catch(e){}}
let dark=localStorage.getItem("tsr-dark")==="1";
function applyDark(){document.documentElement.classList.toggle("dark",dark);$("darkBtn").textContent=dark?"☀️":"🌙"}
$("darkBtn").onclick=()=>{dark=!dark;localStorage.setItem("tsr-dark",dark?"1":"0");applyDark()};
/* ===== SPEECH ===== */
const synth=window.speechSynthesis;
let speaking=false,paused=false;
function heVoice(){if(!synth)return null;const vs=synth.getVoices();return vs.find(v=>/^he/i.test(v.lang))||vs.find(v=>/hebrew|עברית/i.test(v.name))||null}
if(synth)synth.onvoiceschanged=()=>{};
function stopSpeak(){if(synth)synth.cancel();speaking=false;paused=false;updPlayer()}
function speakStory(st){if(!synth){alert("הדפדפן הזה לא תומך בהקראה");return}stopSpeak();const parts=[st.title+"."].concat(st.body);if(st.lesson)parts.push("מה לומדים? "+st.lesson);(st.rashi||[]).forEach(r=>{parts.push("רשי אומר, על "+r.ref+": "+r.quote+" "+r.explain)});const v=heVoice();const rate=parseFloat(localStorage.getItem("tsr-rate")||"0.95");
parts.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang="he-IL";if(v)u.voice=v;u.rate=rate;u.onend=()=>{if(i===parts.length-1){speaking=false;updPlayer()}};synth.speak(u)});speaking=true;paused=false;updPlayer()}
function updPlayer(){const b=$("playBtn");if(!b)return;b.textContent=speaking&&!paused?"⏸ השהה":"▶ הקראה";const st=$("pState");if(st)st.textContent=speaking?(paused?"מושהה":"מקריא..."):"";}
function cycleRate(){let r=parseFloat(localStorage.getItem("tsr-rate")||"0.95");r=r>=1.2?0.8:r>=1?1.2:1;localStorage.setItem("tsr-rate",r);const b=$("rateBtn");if(b)b.textContent="מהירות "+r;return r}
/* ===== VIEWS ===== */
const app=$("app");
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function viewHome(q){q=(q||"").trim();let h="";
if(q){h+='<input class="searchbox" id="q" placeholder="חיפוש סיפור..." value="'+esc(q)+'">';let found=[];UNITS.forEach(u=>u.stories.forEach(s=>{if((s.title+s.summary+(s.topics||[]).join(" ")+(s.characters||[]).join(" ")+(s.lesson||"")+(s.rashi||[]).map(r=>r.quote+r.explain).join(" ")).includes(q))found.push([u,s])}));
h+='<div class="card"><b>'+found.length+' תוצאות</b></div>';found.forEach(([u,s])=>{h+='<button class="storybtn" onclick="goStory('+u.id+',\''+s.id+'\')"><span class="num">'+s.n+'</span><span><h3>'+esc(s.title)+'</h3><div class="src">'+esc(s.book)+' '+esc(s.chapters)+' · יחידה '+u.id+'</div></span><span class="tick">'+(read[s.id]?"✅":"")+'</span></button>'});app.innerHTML=h;const qi=$("q");qi.focus();qi.oninput=()=>{const v=qi.value;const pos=qi.selectionStart;viewHome(v);const q2=$("q");q2.setSelectionRange(pos,pos)};return}
h+='<input class="searchbox" id="q" placeholder="חיפוש סיפור...">';
const totalRead=UNITS.reduce((a,u)=>a+u.stories.filter(s=>read[s.id]).length,0);
const totalStories=UNITS.reduce((a,u)=>a+u.stories.length,0);
h+='<div class="card">כאן אוספים את סיפורי התנ״ך הגדולים, <b>לפי הסדר</b> - מהבריאה ועד שיבת ציון. כל סיפור עם מקור מדויק, התאמה לגיל, וכפתור הקראה בקול - לפני השינה או בנסיעה. 🌙🚗<div class="progressline">נקראו '+totalRead+' מתוך '+totalStories+' סיפורים שפורסמו · יחידה 1 מוכנה, והשאר בדרך</div></div>';
UNITS.forEach(u=>{if(u.status==="ready"){const done=u.stories.filter(s=>read[s.id]).length;
h+='<button class="unit" onclick="goUnit('+u.id+')"><h2>'+u.id+". "+esc(u.title)+'</h2><div class="meta">'+esc(u.book)+(u.chapters?' '+esc(u.chapters):'')+' · '+u.stories.length+' סיפורים <span class="badge'+(done===u.stories.length?' done':'')+'">'+(done===u.stories.length?'הושלמה ✓':'זמינה עכשיו')+'</span></div></button>'}
else{h+='<button class="unit soon" disabled><h2>'+u.id+". "+esc(u.title)+'</h2><div class="meta">'+esc(u.book)+' · '+u.planned+' סיפורים <span class="badge soonb">בקרוב</span></div></button>'}});
app.innerHTML=h;$("q").oninput=e=>viewHome(e.target.value)}
function viewUnit(uid){const u=UNITS.find(x=>x.id===uid);if(!u)return viewHome();
let h='<button class="back" onclick="viewHome()">→ חזרה למפה</button><div class="card"><h2 style="color:var(--accent)">'+u.id+". "+esc(u.title)+'</h2><div class="meta" style="color:var(--muted)">'+esc(u.book)+(u.chapters?' '+esc(u.chapters):'')+'</div></div>';
u.stories.forEach(s=>{h+='<button class="storybtn" onclick="goStory('+u.id+',\''+s.id+'\')"><span class="num">'+s.n+'</span><span><h3>'+esc(s.title)+'</h3><div class="src">'+esc(s.book)+' '+esc(s.chapters)+' · '+s.ages.map(a=>'<span class="agetag">'+a+'+</span>').join(" ")+'</div></span><span class="tick">'+(read[s.id]?"✅":"")+'</span></button>'});
app.innerHTML=h;window.scrollTo(0,0)}
function viewStory(uid,sid){const u=UNITS.find(x=>x.id===uid);const s=u&&u.stories.find(x=>x.id===sid);if(!s)return viewHome();stopSpeak();
let h='<button class="back" onclick="viewUnit('+uid+')">→ חזרה ליחידה</button><div class="card story"><h2>'+esc(s.title)+'</h2><div class="src">'+esc(s.book)+', פרקים '+esc(s.chapters)+(s.holiday?' · 🗓 '+esc(s.holiday):'')+' · '+s.ages.map(a=>'<span class="agetag">'+a+'+</span>').join(" ")+'</div>';
if(s.note)h+='<div class="note">⚠️ '+esc(s.note)+'</div>';
s.body.forEach(p=>{h+='<p>'+esc(p)+'</p>'});
if(s.lesson)h+='<div class="lesson"><b>💡 מה לומדים?</b><div style="margin-top:4px">'+esc(s.lesson)+'</div></div>';
(s.rashi||[]).forEach(r=>{h+='<div class="rashic"><b>📜 רש״י - '+esc(r.ref)+'</b><div class="rq">'+esc(r.quote)+'</div><div>'+esc(r.explain)+'</div></div>'});
h+='<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="iconbtn" style="padding:0 16px;font-size:.95rem" onclick="toggleRead(\''+s.id+'\')">'+(read[s.id]?"✅ נקרא!":"סמן כנקרא")+'</button>';
const idx=u.stories.indexOf(s);if(idx<u.stories.length-1)h+='<button class="iconbtn" style="padding:0 16px;font-size:.95rem" onclick="goStory('+uid+',\''+u.stories[idx+1].id+'\')">הסיפור הבא ←</button>';
h+='</div></div>';
h+='<div class="player"><button class="main" id="playBtn">▶ הקראה</button><button id="stopBtn">⏹</button><button id="rateBtn">מהירות '+(localStorage.getItem("tsr-rate")||"0.95")+'</button><div class="st" id="pState"></div></div>';
app.innerHTML=h;window.scrollTo(0,0);updPlayer();
$("playBtn").onclick=()=>{if(!speaking)speakStory(s);else if(!paused){synth.pause();paused=true;updPlayer()}else{synth.resume();paused=false;updPlayer()}};
$("stopBtn").onclick=stopSpeak;
$("rateBtn").onclick=()=>{const r=cycleRate();if(speaking){speakStory(s)}}}
function toggleRead(sid){read[sid]=!read[sid];saveRead();const m=location.hash.match(/#u(\d+)\/(.+)/);if(m)viewStory(+m[1],m[2])}
function goUnit(uid){location.hash="#u"+uid}
function goStory(uid,sid){location.hash="#u"+uid+"/"+sid}
function route(){const h=location.hash;let m=h.match(/#u(\d+)\/(.+)/);if(m)return viewStory(+m[1],m[2]);m=h.match(/#u(\d+)/);if(m)return viewUnit(+m[1]);viewHome()}
window.addEventListener("hashchange",route);
applyDark();route();
</script>
</body>
</html>
