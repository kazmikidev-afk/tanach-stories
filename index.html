{id:"7-1",n:39,title:"אהוד והחרב בעלת שני פיות",book:"שופטים",chapters:"ג",ages:[11,13],holiday:"",topics:["אהוד","עגלון","מואב","תושיע"],characters:["אהוד בן גרא","עגלון מלך מואב"],summary:"בעל יד שמאל נכנס לחדרו של המלך השמן - עם חרב חבויה בירך ימינו",
body:["עגלון מלך מואב הכביד על בני ישראל שמונה עשרה שנה. בני ישראל זעקו לה׳, וה׳ הקים להם מושיע: אהוד בן גרא, איש איטר יד ימינו - בעל יד שמאל.","אהוד הביא מנחה לעגלון, ועל ירכו חבש חרב בעלת שני פיות, תחת בגדיו. השומרים בדקו אותו - מי מחביא נשק על ירך ימין? והוא נכנס פנימה.","ואהוד אמר: דבר סתר יש לי אליך, המלך. המלך אמר: הס! ויצאו ממנו כל העומדים עליו. ואהוד נכנס אליו אל המסדרון בעלית המקרה, כשהוא יושב לו לבדו.","אהוד אמר: דבר א-להים לי אליך. עגלון קם מעל הכסא - ואהוד שלח את יד שמאלו, לקח את החרב מעל ירך ימינו, ויתקעה בבטנו. ויצא הפרשדונה - ואהוד נמלט דרך המסדרון.","וכאשר באו עבדיו וראו את דלתות העלייה נעולות, אמרו: אכן מכסה הוא את רגליו. וחילו עד בוש - והנה אין פותח. לקחו המפתח ופתחו - והנה אדוניהם נופל ארצה מת. ואהוד נמלט עד שהם מתמהמהים, ועבר את הפסילים, וינמל השעירתה.","ויהי כבואו ויתקע בשופר בהר אפרים, וירדו עמו בני ישראל, והוא לפניהם. ויאמר אליהם: רדפו אחרי, כי נתן ה׳ את איביכם את מואב בידכם! והם לכדו את מעברות הירדן למואב, ויכו את מואב כעשרת אלפים איש. ותשקט הארץ שמונים שנה."],
lesson:"אהוד היה שונה - שמאלי, כנראה נחשב לחלש. דווקא מה שחשבו שהוא חולשה היה הכלי להצלה. לפעמים דווקא מה ששונה אצלך הוא מה שאתה יכול לתת לעולם.",
note:"אהוד הורג את עגלון במלכודת - נאמר לילדים בהתאם לגיל."},
{id:"7-2",n:40,title:"דבורה וברק - ואתדו של יעל",book:"שופטים",chapters:"ד-ה",ages:[5,11,13],holiday:"",topics:["דבורה","ברק","סיסרא","יעל","נביאה","שירה"],characters:["דבורה הנביאה","ברק בן אבינועם","סיסרא","יעל אשת חבר"],summary:"אשה נביאה שופטת תחת התמר, אשה אחרת מכניסה את סיסרא לאהל - וישראל שר שירה",
body:["אחרי מות אהוד החזיק יבין מלך כנען בישראל, ושר צבאו סיסרא עם תשע מאות רכבי ברזל - עשרים שנה. ודבורה אשה נביאה, אשת לפידות, היא שפטה את ישראל בעת ההיא, והיא יושבת תחת תמר דבורה, ויעלו אליה בני ישראל למשפט.","ותשלח דבורה ותקרא לברק בן אבינועם: הלוא צוה ה׳ - לך ומשכת בהר תבור ולקחת עמך עשרת אלפים איש! ואולך אליך את סיסרא ונתתיו בידך. וברק אמר: אם תלכי עמי והלכתי, ואם לא תלכי עמי לא אלך. ותאמר דבורה: הלוך אלך עמך - אפס כי לא תהיה תפארתך על הדרך אשר אתה הולך, כי ביד אשה ימכר ה׳ את סיסרא.","ותפרוש ה׳ - הרקיעו אבנים והנהר קישון גרפם. סיסרא ירד מעל המרכבה וברח רגלי - ויבוא לאהל יעל אשת חבר הקיני. יעל הוציאה לו חלב, כיסתו בשמיכה - וכשנרדם לקחה את יתד האהל, תשם את ידה השמאלית על היתד וימינה על מקבת, ותתקע את היתד ברקתו ותצנח ארצה.","וברק רדף אחרי סיסרא - ויעל יצאה לקראתו: לך ואראך את האיש אשר אתה מבקש. ויבא אליה - והנה סיסרא נופל מת.","ויתפרץ עם ישראל לשר שירה: אשרי דבורה, אשרי יעל. ותשקט הארץ ארבעים שנה."],
lesson:"שתי נשים חזקות - נביאה שמנהיגה עם, ואשה פשוטה שאומרת אמת במקום מפחד - משנות דור שלם. לא צריך תואר כדי להיות גדול; צריך אמת ואומץ.",
rashi:[{ref:"שופטים ד, ד",quote:"אשת לפידות - שהיתה עושה פתילות למקדש.",explain:"רש״י מסביר שדבורה עסקה בפתילות של נרות המקדש - אשה שנותנת אור לעם, ממש כמו שהיא עצמה הדליקה אור בישראל."}]},
{id:"7-3",n:41,title:"גדעון - למה אתה מצא אותי?",book:"שופטים",chapters:"ו",ages:[5,11,13],holiday:"",topics:["גדעון","מלאך","נס","גיזת הצמר"],characters:["גדעון בן יואש","מלאך ה׳"],summary:"הדל שבביתו מנקב בגרן - ומלאך קורא לו גיבור החיל",
body:["מדיין עושק את ישראל שבע שנים - באו כאכבה לרב, ובני ישראל עשו להם מנהרות בהרים ומערות. וגדעון בן יואש מנקב חטים בגת, להניס מפני מדיין.","וירא אליו מלאך ה׳ ויאמר לו: ה׳ עמך, גיבור החיל! וגדעון עונה: בי אדוני, ויש ה׳ עמנו - ולמה מצאתנו כל זאת? ואיפה כל נפלאותיו אשר ספרו לנו אבותינו?","ויפן אליו ה׳ ויאמר: לך בכחך זה והושעת את ישראל מכף מדיין - הלוא שלחתיך! וגדעון אומר: בי אדוני, במה אושיע את ישראל? הנה אלפי הדל במנשה, ואנכי הצעיר בבית אבי. ויאמר ה׳ אליו: כי אהיה עמך והכית את מדיין כאיש אחד.","גדעון מבקש אות: תעשה טל על גיזת הצמר לבדה, ועל כל הארץ יהיה חרב. ויהי כן - ויער מן הגיזה טל, מלא הספל מים. ואז הפוך: תהיה הגיזה חרבה ועל כל הארץ יהיה טל. ויהי כן.","ובלילה ההוא, בציווי ה׳, גדעון לוקח עשרה אנשים מעבדיו ומפר את מזבח הבעל של אביו. ויקום ביום - והנה נתץ מזבח הבעל! ויקראו לו ירבעל, לאמר: ירב בו הבעל."],
lesson:"גדעון הרגיש קטן - וה׳ ראה בו גיבור. גודל האדם לא נמדד בכמה הוא גדול בעיני עצמו, אלא במה שהוא עושה עם מה שיש לו."},
{id:"7-4",n:42,title:"שלוש מאות המלקקים",book:"שופטים",chapters:"ז",ages:[5,11,13],holiday:"",topics:["גדעון","שלוש מאות","נס","מלקקים"],characters:["גדעון","שלוש מאות האנשים"],summary:"ה׳ מקטין את הצבא מ-32,000 ל-300 - כדי שכולם ידעו מי הנצח",
body:["צבא מדיין ועמלק ובני קדם שוכן בעמק יזרעאל כארבה לרב. גדעון מגייס 32,000 איש. ויאמר ה׳ אל גדעון: רב העם אשר אתך מתתי את מדיין בידם - פן יתפאר עלי ישראל לאמר, ידי הושיעה לי. קרא נא באזני העם: מי ירא וחרד ישוב ויצפר מהר הגלעד! וישבו עשרים ושנים אלף, וישארו עשרת אלפים.","ויאמר ה׳: עוד העם רב. הורד אותם אל המים ואצרפנו לך שם. גדעון מוריד אותם לשתות: כל אשר ילק בלשונו מן המים כאשר ילק הכלב - תציג אותו לבד. ויהי מספר המלקקים בידם אל פיהם - שלוש מאות איש. ויאמר ה׳: בשלוש מאות האנשים המלקקים אושיע אתכם ונתתי את מדיין בידך!","ובלילה גדעון יורד למחנה עם פורה נערו ושומע איש מספר חלום: הנה ככר צליל לחם שעורים מתהפך במחנה מדיין ויפול על האהל ויהפכהו למעלה ונפל! ויען רעהו: אין זאת בלתי אם חרב גדעון - נתן הא-להים בידו את מדיין!","גדעון חולק את שלוש המאות לשלושה ראשים, ונותן ביד כולם שופרות וכדים ריקים ולפידים בתוך הכדים. תקעו בשופרות ונפצו הכדים ואמרו: חרב לה׳ ולגדעון! והמחנה כולו מתבלבל וישיתו איש חרבו ברעהו - והמחנה נס עד בית השטה."],
lesson:"ה׳ הקטין את הצבא דווקא כדי שאף אחד לא יאמר ידי הושיעה לי. לפעמים דווקא כשיש לנו פחות כוח - רואים מי באמת עוזר לנו.",
rashi:[{ref:"שופטים ז, ו",quote:"המלקקים בידם - אין זה דרך כריעה כלוקק בלשונו.",explain:"רש״י מסביר: מי שמלקק מים מהיד אל הפה מראה שהוא לא מתכופף לקרקע - לא רגיל להשתחוות לעבודה זרה. הצבא הנבחר היה מי שלא כרע מעולם."}]},
{id:"7-5",n:43,title:"יפתח - מילה שנאמרה מוקדם מדי",book:"שופטים",chapters:"יא",ages:[11,13],holiday:"",topics:["יפתח","נדר","בת יפתח"],characters:["יפתח הגלעדי","בת יפתח","זקני גלעד"],summary:"שופט שנדחה חוזר להציל את עמו - ונדר אחד הורס הכול",
body:["יפתח הגלעדי גיבור חיל - אבל אחיו גירשו אותו מבית אביו. הוא ברח לגלות ואספו אליו אנשים ריקים. ואז באו בני עמון להילחם בישראל - וזקני גלעד הלכו לבקש את יפתח בחזרה: לכה ונלחמת בבני עמון. ויפתח אומר: הלוא אתם שנאתם אותי ותגרשוני מבית אבי? וזקני גלעד אומרים: על כן נהיה לך לראש לכל יושבי גלעד. ויפתח הולך עמם - והעם שם אותו לראש ולקצין.","ותהי עליו רוח ה׳, ויעבור את גלעד ומנשה. ואז - רגע לפני המלחמה - יפתח נודר נדר לה׳: אם נתון תתן את בני עמון בידי, והיה היוצא אשר יצא מדלתי ביתי לקראתי בשובי בשלום - והיה לה׳, והעליתהו עולה. מילים מסוכנות.","ויכ את בני עמון מכה גדולה מאד - עשרים עיר. וישוב יפתח המצפה אל ביתו - והנה בתו יוצאת לקראתו בתופים ובמחולות. רק היא יחידה - אין לו זולתה בן או בת. ויהי כראותו אותה ויקרע את בגדיו ויאמר: אהה בתי הכרע הכרעתני!","ותאמר אליו: אבי, פצית את פיך אל ה׳ - עשה לי כאשר יצא מפיך. וביקשה חודשיים ללכת ולבכות על הרים עם רעותיה - ואחר שבה אל אביה, ויעש לה את נדרו אשר נדר. והיתה חק בישראל: מימים ימימה תלכנה בנות ישראל לתנות לבת יפתח הגלעדי ארבעת ימים בשנה."],
lesson:"חכמי ישראל קבעו מיפתח חק: אל תנדרו נדרים בלי לחשוב, ואם נפלת בנדר - לך לחכם, לא אל התקלה. לפני שאומרים הבטחה גדולה - עוצרים רגע וחושבים.",
note:"סוף הסיפור קשה מאוד - בת יפתח נקרבת על נדר אביה. רש״י מסביר שזו הייתה טעות שאפשר היה למנוע בהתייעצות עם פנחס הכהן. מומלץ לקרוא עם הילדים ולדבר על זהירות בדיבור.",
rashi:[{ref:"שופטים יא, לט",quote:"ותהי חק - גזרו שלא יעשה אדם עוד כן, שאלו הלך אצל פנחס, או הוא בא אצלו, היה מתיר לו נדרו, עמדו בגדלתן, ומבין שניהם אבדה.",explain:"רש״י מסביר שיפתח יכול היה להתיר את הנדר אצל פנחס הכהן - אבל שניהם, בגאוותם, חיכו שהשני יבוא. ומחמת הגאווה נאבדה בת יפתח."}]},
{id:"7-6",n:44,title:"שמשון - נזיר מהרחם",book:"שופטים",chapters:"יג-יד",ages:[5,11,13],holiday:"",topics:["שמשון","נזיר","מלאך","אריה"],characters:["מנוח","אשת מנוח","מלאך ה׳","שמשון"],summary:"מלאך מבשר להרה איילת - הבן יהיה נזיר א-להים מהבטן",
body:["אשת מנוח עקרה - אין לה ילדים. וירא אליה מלאך ה׳: הנה נא את הרית וילדת בן. ועתה הישמרי נא ואל תשתי יין ושכר - כי נזיר א-להים יהיה הנער מן הבטן, והוא יחל להושיע את ישראל מיד פלשתים.","מנוח מתפלל לראות את האיש - והמלאך שב. מנוח שואל: מה שמך? והמלאך: למה זה תשאל לשמי - והוא פלאי. מנוח מעלה עולה על הסלע - ויהי בעלות הלהבה מעל המזבח השמימה, ויעל מלאך ה׳ בלהב המזבח! ומנוח אומר לאשתו: מות נמות כי א-להים ראינו. ואשתו החכמה: לו חפץ ה׳ להמיתנו, לא לקח מידנו עולה.","ותלד האשה בן ותקרא את שמו שמשון, ויגדל הנער ויברכהו ה׳. ותחל רוח ה׳ לפעמו במחנה דן.","שמשון יורד תמנתה ורואה אשה מבנות פלשתים. באביו הולכים - והנה כפיר אריות שואג לקראתו! ותצלח עליו רוח ה׳ וישסעהו כשסע הגדי - ומאומה אין בידו. ואחר ימים עובר לראות את פגר האריה - והנה עדת דבורים בגוית האריה, ודבש. וירדהו אל כפיו ויאכל.","ובמשתה שמשון חוד חידה: מהאוכל יצא מאכל, ומעז יצא מתוק. שלושים חברים לא הצליחו לפתור בשבעה ימים."],
lesson:"שמשון קיבל כוח עצום מה׳ - וגם כללים: לא יין, לא טומאה, לא גילוח. כוח גדול בא עם אחריות גדולה. והכוח עצמו הוא לא המתנה - אלא מה שעושים איתו.",
rashi:[{ref:"שופטים יג, ה",quote:"ומורה - תער, על שם שמורה ומשליך את השער.",explain:"רש״י מסביר שהמילה מורה היא תער - כי הנזיר מוריד את שערו בסוף ימי נזירותו, ושמשון נזיר כל ימיו."}]},
{id:"7-7",n:45,title:"שמשון האחרון - תמות נפשי עם פלשתים",book:"שופטים",chapters:"טז",ages:[11,13],holiday:"",topics:["שמשון","דלילה","שער","תשובה"],characters:["שמשון","דלילה","סרני פלשתים"],summary:"דלילה גוזזת את השער, פלשתים מנקרים את העיניים - ושמשון מבקש תפילה אחרונה",
body:["שמשון אהב אשה בנחל שורק ושמה דלילה. ויאמרו אליה סרני פלשתים: פתי אותו וראי במה כחו גדול, ואנחנו נתן לך איש אלף ומאה כסף.","דלילה שואלת: הגידה לי במה כחך גדול. שלוש פעמים שמשון מרמה אותה - עשרת יתרים לחים, חבלים חדשים, שבע מחלפות ראשי עם המסכת. בכל פעם היא קוראת: פלשתים עליך שמשון! והוא נצר. אז היא אמרה לו: איך תאמר אהבתיך ואין לבך אתי! ותאלצהו בדבריה כל היום ותקצר נפשו למות - ויגד לה את כל לבו: מורה לא עלה על ראשי, כי נזיר א-להים אני מבטן אמי. אם גולחתי וסר ממני כחי.","ותישנהו על ברכיה, ותקרא לאיש ותגלח שבע מחלפות ראשו - ותחל לענותו, וסר כחו מעליו. ותאמר פלשתים עליך שמשון! ויער משנתו ויאמר אצא כפעם בפעם ואנער - והוא לא ידע כי ה׳ סר מעליו. ויאחזוהו פלשתים וינקרו את עיניו, ויורידו אותו עזתה ויאסרוהו בנחשתים, ויהי טוחן בבית האסורים.","ושער ראשו החל לצמח כאשר גולח. וסרני פלשתים נאספו לחגוג לדגון - כשלושת אלפים איש ואשה על הגג. ויקראו לשמשון וישחק לפניהם, ויעמידו אותו בין העמודים. ויאמר שמשון אל הנער המחזיק בידו: הניחה אותי והמישני את העמודים.","ויאמר שמשון אל ה׳: אדוני ה׳, זכרני נא וחזקני נא אך הפעם הזה הא-להים! וילפות שמשון בשני עמודי התוך, וינט בכחו - ויפל הבית על הסרנים ועל כל העם. ויהיו המתים אשר המית במותו רבים מאשר המית בחייו. וירדו אחיו ויקברו אותו בקבר מנוח אביו. והוא שפט את ישראל עשרים שנה."],
lesson:"שמשון שילם מחיר כבד - אבל ברגע האחרון חזר אל ה׳ בתפילה, ודווקא זה נכתב. תשובה אמיתית יכולה להיות בשנייה האחרונה, והיא אמיתית לגמרי.",
note:"קץ שמשון אכזרי - עיניים מנוקרות, מוות עם האויב. ספרו לפי הגיל; הנקודה המרכזית לילדים היא התפילה והתשובה.",
rashi:[{ref:"שופטים טז, כח",quote:"זכרני נא - זכר עשרים שנה ששפטתי את ישראל, ולא אמרתי לאחד מהם העבר לי מקל זה ממקום למקום.",explain:"רש״י מסביר מה שמשון ביקש שיזכרו לו: עשרים שנה שפט את ישראל ומעולם לא הטריח אף אחד, אפילו להעביר לו מקל ממקום למקום - ענווה של מנהיג ענק."}]}]},
{id:8,title:"רות - חסד שנבנת ממנו מלכות",book:"רות",chapters:"",status:"ready",stories:[
{id:"8-1",n:46,title:"אל תפגעי בי - רות נצמדת בנעמי",book:"רות",chapters:"א",ages:[5,11,13],holiday:"שבועות",topics:["רות","נעמי","ערפה","חסד","בית לחם"],characters:["נעמי","רות","ערפה"],summary:"אלמנה מואביה מסרבת לעזוב את חמותה - באשר תלכי אלך",
body:["ויהי בימי שפוט השופטים - רעב בארץ. איש מבית לחם יהודה, אלימלך, יורד לשדה מואב עם נעמי אשתו ושני בניו, מחלון וכליון. ואלימלך מת. הבנים נושאים להם נשים מואביות - ערפה ורות - וגם הם מתים. ונעמי נשארת לבדה: בלי בעל, בלי בנים, בארץ זרה.","ותשמע נעמי כי פקד ה׳ את עמו לתת להם לחם - והיא חוזרת לבית לחם. שתי כלותיה הולכות עמה, ונעמי אומרת להן: לכנה שובנה אשה לבית אמה. עשה ה׳ עמכם חסד, כאשר עשיתם עם המתים ועמדי. תתן ה׳ לכם ומצאנה מנוחה אשה בית אישה. ותשק להן ותשאנה קולן ותבכינה.","וערפה נושקת לחמותה - וחוזרת אל עמה ואל א-להיה. ורות - דבקה בה. נעמי אומרת: שובי אחרי יבמתך! ורות עונה את התשובה המפורסמת בתנ״ך: אל תפגעי בי, לעזבך לשוב מאחריך. כי אל אשר תלכי אלך, ובאשר תליני אלין; עמך עמי, וא-להיך א-להי. באשר תמותי אמות ושם אקבר. כה יעשה ה׳ לי וכה יוסיף, כי המוות יפריד ביני ובינך.","ותרא נעמי כי מתאמצת היא ללכת אתה - ותחדל לדבר אליה. והן באות בית לחם בתחילת קציר שעורים, וכל העיר הומה עליהן: הזאת נעמי? ונעמי אומרת: אל תקראנה לי נעמי - קראן לי מרא, כי המר שד-י לי מאד. אני מלאה הלכתי, וריקם השיבני ה׳."],
lesson:"ערפה בכתה וחזרה - ורות בכתה ונשארה. חסד אמיתי הוא לא דיבורים גדולים אלא להישאר כשקשה. רות לא ידעה מה יהיה; היא רק ידעה שהיא לא עוזבת.",
rashi:[{ref:"רות א, טז",quote:"אל תפגעי בי - אל תפצרי בי.",explain:"רש״י מסביר: רות מבקשת מנעמי - אל תלחצי עלי יותר לחזור. היא החליטה, והלב שלה כבר קשור."}]},
{id:"8-2",n:47,title:"אלכה נא השדה - לקט וחסד",book:"רות",chapters:"ב",ages:[5,11,13],holiday:"שבועות",topics:["רות","בועז","לקט","שדה"],characters:["רות","נעמי","בועז"],summary:"גריה ענייה יוצאת ללקט שיבולים - ומקרה שלה נופל דווקא בשדה של בועז",
body:["בבית לחם רעב כבר אין, אבל כסף גם אין. רות אומרת לנעמי: אלכה נא השדה ואלקטה בשבלים אחרי אשר אמצא חן בעיניו. לקט - זכות של עניים: הפועלים חוזרים על שיבולים שנפלו, והעניים מלקטים אחריהם.","ותלך ותבוא ותלקט בשדה אחרי הקוצרים. ויקר מקרה - חלקת השדה לבועז, ממשפחת אלימלך, איש גיבור חיל.","ובועז בא מבית לחם ואומר לקוצרים: ה׳ עמכם! והם עונים: יברכך ה׳. וירא את רות וישאל: למי הנערה הזאת? ועבדו עונה: נערה מואביה היא, השבה עם נעמי משדה מואב. ותאמר אליי: אלקטה נא ואספתי בעמרים אחרי הקוצרים. ותבוא ותעמוד מאז הבקר - עד עתה, ושבתה הבית מעט.","בועז שמע מי היא - אשת החסד שלא עזבה את נעמי."],
lesson:"רות יכולה הייתה לשבת ולבכות. במקום זה היא קמה והלכה לעבוד בשביל זקנה אחרת. כשהחיים קשים - הצעד הקטן של הבוקר הוא שמשנה הכול.",
rashi:[{ref:"רות ב, ב",quote:"אלכה נא השדה - לאחד משדות אנשי העיר אחרי אחד מהם \"אשר אמצא חן בעיניו\", שלא יגער בי.",explain:"רש״י מסביר את כוונת רות: היא חיפשה שדה של מי שיקבל אותה בחן - לא לגער בה על שהיא לוקטת. גם בענייה, היא מחפשת מקום של כבוד."}]},
{id:"8-3",n:48,title:"שי ותשארי - בועז דואג לרות",book:"רות",chapters:"ב",ages:[5,11,13],holiday:"שבועות",topics:["בועז","רות","חסד","כנפיים"],characters:["בועז","רות","הקוצרים"],summary:"בועז אומר לרות: אל תלכי ללקט בשדה אחר - ומצווה על הקוצרים להשליך לה",
body:["בועז קורא לרות: הלוא שמעת בתי? אל תלכי ללקט בשדה אחר, וגם לא תעבורי מזה. וכה תדבקין עם נערותי. וכשצמאת והלכת אל הכלים ושתית מאשר ישאבון הנערים.","ותפול רות על פניה ותשתחו ארצה: מדוע מצאתי חן בעיניך להכירני, ואנכי נכריה? ויען בועז: הוספור הוסף לי כל אשר עשית את חמותך אחרי מות אישך - ותעזבי אביך ואמך וארץ מולדתך, ותלכי אל עם אשר לא ידעת אתמול שלשום. ישלם ה׳ פעלך, ותהי משכרתך שלמה מעם ה׳ א-להי ישראל, אשר באת לחסות תחת כנפיו.","ובעת האכול אומר לה בועז: גשי הלום ואכלת מן הלחם. ובקציר מצווה את נעריו בסתר: וגם של תשלו לה מן הצבתים, ועזבתם ולקטה - ולא תגערו בה.","ותלקט רות עד הערב - ותחבוט את אשר לקטה: כאיפה שעורים! תביא לנעמי, ונעמי שואלת: איפה לקטת היום? ורות מספרת: שם האיש בועז. ונעמי אומרת: ברוך הוא לה׳, אשר לא עזב חסדו את החיים ואת המתים! מקרוב לנו האיש - מגאלנו הוא."],
lesson:"בועז לא נתן לרות צדקה מלמעלה. הוא נתן לה לעבוד בכבוד, ואפילו ציווה להשליך לה שיבולים בחשאי. חסד הכי גדול הוא חסד ששומר על הכבוד של מי שמקבל."},
{id:"8-4",n:49,title:"הגרן בלילה - פרש כנפך",book:"רות",chapters:"ג",ages:[11,13],holiday:"שבועות",topics:["רות","בועז","גרן","גאולה"],characters:["רות","בועז","נעמי"],summary:"נעמי שולחת את רות לגרן בלילה - ובועז מתעורר בחצי הלילה",
body:["נעמי רואה שהקציר נגמר והלב שלה דואג: בתי, הלא אבקש לך מנוחה, אשר ייטב לך? והיא אומרת לרות: הלוא בועז מדעתנו? הנה הוא זורה את הגרן הלילה. ורחצת וסכת ושמת שמלותיך עליך, וירדת הגרן. כאשר ישכב, ראי את המקום, ובאת וגלית מרגלותיו ושכבת - והוא יגיד לך מה תעשין. ורות עונה: כל אשר תאמרי - אעשה.","ותרד רות הגרן ותעש ככל אשר צותה חמותה. בועז אוכל ושותה וייטב לבו, וישכב בקצה הערמה. ורות באה בלט, ותגל את מרגלותיו, ותשכב.","ויהי בחצי הלילה ויחרד האיש וילפת - והנה אשה שוכבת מרגלותיו! ויאמר: מי את? ותאמר: אנכי רות אמתך. ופרשת כנפך על אמתך, כי גואל אתה.","ובועז עונה: ברוכה את לה׳ בתי! הטבת חסדך האחרון מן הראשון, לבלתי לכת אחרי הבחורים. ועתה בתי אל תיראי - כל אשר תאמרי אעשה לך, כי יודע כל שער עמי כי אשת חיל את. וגם אמת: יש גואל קרוב ממני. ליני הלילה - והיה בבוקר, אם יגאלך טוב יגאל, ואם לא יחפץ לגאלך וגאלתיך אנכי, חי ה׳!","ותשכב עד הבוקר ותקם בטרום יכיר איש את רעהו, ובועז נותן לה שש שעורים - ותבוא העיר. נעמי שואלת: מי את בתי? ורות מספרת הכול, ונעמי אומרת: שבי בתי עד אשר תדעין איך יפול דבר - כי לא ישקט האיש כי אם כלה הדבר היום."],
lesson:"רות ובועז שניהם נזהרים בכל פרט - בלילה, בלט, בכבוד. דווקא כשהדבר רגיש, הכבוד ההדדי הוא שהופך אותו לברכה ולא לצרה.",
note:"סצנת הגרן עדינה ומרומזת במקור. לילדים צעירים מספיק: רות באה לבקש מבועז שיגאל את המשפחה.",
rashi:[{ref:"רות ג, יג",quote:"ליני הלילה - ליני בלא איש.",explain:"רש״י מסביר את כוונת בועז: רות לא תישאר בגרן כפי שבאה - הכול ייעשה ביושר, בשער העיר, בפני זקנים."}]},
{id:"8-5",n:50,title:"השער - הגואל שלא רצה, ובועז שרצה",book:"רות",chapters:"ד",ages:[5,11,13],holiday:"שבועות",topics:["בועז","גאולה","שער העיר","חליצה","נעל"],characters:["בועז","פלוני אלמוני","עשרה זקנים"],summary:"בועז יושב בשער, מזמן עשרה זקנים - ומחכה שהגואל הקרוב יעבור",
body:["ובועז עלה השערה וישב שם. והנה הגואל עובר, אשר דבר בועז! ויאמר: סורה שבה פה, פלוני אלמוני. ויסר וישב. ויקח עשרה אנשים מזקני העיר ויאמר: שבו פה.","ויאמר לגואל: חלקת השדה אשר לאחינו לאלימלך, מכרה נעמי. ואני אמרתי אגלה אוזנך: קנה נגד היושבים ונגד זקני עמי. אם תגאל - גאל; ואם לא יגאל - הגידה לי. ויאמר: אנכי אגאל.","ויאמר בועז: ביום קנותך השדה מיד נעמי, ומאת רות המואביה אשת המת קנית - להקים שם המת על נחלתו. ויאמר הגואל: לא אוכל לגאול לי, פן אשחית את נחלתי! גאל לך את גאולתי, כי לא אוכל לגאול.","וזאת לפנים בישראל על הגאולה ועל התמורה לקים כל דבר: שלף איש נעלו ונתן לרעהו. ויאמר הגואל לבועז: קנה לך - וישלף נעלו.","ויאמר בועז לזקנים ולכל העם: עדים אתם היום, כי קניתי את כל אשר לאלימלך מיד נעמי. וגם את רות המואביה אשת מחלון קניתי לי לאשה, להקים שם המת על נחלתו. וכל העם אשר בשער עונים: עדים! ומברכים: יתן ה׳ את האשה הבאה אל ביתך כרחל וכלאה, אשר בנו שתיהן את בית ישראל!"],
lesson:"הגואל הקרוב אמר כן - ואז אמר לא. בועז אמר כן - ועשה. דיבור יפה לא בונה בית; מעשים בונים.",
rashi:[{ref:"רות ד, יא",quote:"כרחל וכלאה - אף על פי שהיו משבט יהודה ומבני לאה, מודים הם על רחל שהיתה עקרה של בית, והקדימו רחל ללאה.",explain:"רש״י מסביר: אפילו אנשי יהודה, צאצאי לאה, הודו שרחל הייתה עקרת הבית - ככה העם בירך את רות שתהיה עקרת בית ישראל."}]},
{id:"8-6",n:51,title:"ותקראנה לו שם - עובד אבי דוד",book:"רות",chapters:"ד",ages:[5,11,13],holiday:"שבועות",topics:["עובד","דוד","משפחה","תולדות"],characters:["רות","בועז","נעמי","עובד","השכנות"],summary:"ילוד בן - והשכנות אומרות לנעמי: היא טובה לך משבעה בנים",
body:["ויקח בועז את רות ותהי לו לאשה - ויתן ה׳ לה הריון, ותלד בן.","ותאמרנה הנשים אל נעמי: ברוך ה׳ אשר לא השבית לך גואל היום! והיה לך למשיב נפש ולכלכל את שיבתך - כי כלתך אשר אהבתך ילדתו, אשר היא טובה לך משבעה בנים.","ותקח נעמי את הילד ותשיתהו בחיקה, ותהי לו לאומנת. ותקראנה לו השכנות שם לאמר: ילד בן לנעמי! ותקראנה שמו עובד.","והוא אבי ישי - אבי דוד. רות המואביה, הגריה שבאה עם כלום, היא הסבתא של דוד מלך ישראל.","וזה הסוד של מגילת רות: מלכות בית דוד לא נולדה מכוח ומגדולה. היא נולדה מחסד קטן בשדה, מנאמנות של אלמנה, ומאדם ישר בשער העיר."],
lesson:"אף אחד לא יודע מה גדל מהחסד שלו. רות חשבה שהיא עוזרת לאישה זקנה אחת - ובנתה את בית דוד. החסד הקטן של היום הוא שורש של דברים גדולים."}]},
{id:9,title:"שמואל א - נביא אחרון ומלך ראשון",book:"שמואל א",chapters:"",status:"ready",stories:[
{id:"9-1",n:52,title:"חנה - התפילה שנולדה בלחש",book:"שמואל א",chapters:"א-ב",ages:[5,11,13],holiday:"",topics:["חנה","שמואל","תפילה","שילה","עלי"],characters:["חנה","אלקנה","פנינה","עלי הכהן"],summary:"אישה עקרה מתפללת בשפתיים בלבד - ועלי הכהן חושב שהיא שיכורה",
body:["ברמותים חי איש אחד, אלקנה, ולו שתי נשים: לפנינה ילדים, ולחנה אין ילדים. וכל שנה היו עולים לשילה להשתחוות לה׳ - ופנינה הייתה מכעיסה את חנה, כי סגר ה׳ את רחמה. וחנה בכתה ולא אכלה.","ביום אחד, אחרי אכילה ושתיה בשילה, חנה קמה ונצבה לפני ה׳. ועלי הכהן יושב על הכסא על מזוזת היכל ה׳. וחנה מרת נפש - ותתפלל על ה׳, ובכה תבכה. ותנדר נדר: אם ראה תראה בעני אמתך ונתת לאמתך זרע אנשים - ונתתיו לה׳ כל ימי חייו, ומורה לא יעלה על ראשו.","והיא מדברת על לבה - רק שפתיה נעות, וקולה לא יישמע. ועלי רואה את שפתיה וחושב שהיא שיכורה! ויאמר אליה: עד מתי תשתכרין? וחנה עונה: לא אדוני, אשה קשת רוח אנכי. את מרי נפשי שפכתי לפני ה׳. ויען עלי: לכי לשלום - א-להי ישראל יתן את שלתך אשר שאלת מעמו.","ותלד חנה בן ותקרא את שמו שמואל - כי מה׳ שאלתיו. וכאשר גמלה אותו, העלתה אותו לשילה, עם פרים ואיפה קמח ונבל יין. ותאמר לעלי: אנכי האשה הנצבת עמכה בזה להתפלל אל ה׳! אל הילד הזה התפללתי - וגם אנכי השאלתהו לה׳ כל הימים אשר הוא שאול לה׳.","ותתפלל חנה שירה גדולה: רמה קרני בה׳! ושמואל נשאר בשילה, משרת לפני ה׳ - נער חגור אפוד בד."],
lesson:"תפילה לא חייבת להיות בקול גדול. חנה דיברה על לבה, בשפתיים נעות בלי קול - וממנה למדנו איך מתפללים עד היום. לפעמים הדברים הכי אמיתיים נאמרים בלחש.",
rashi:[{ref:"שמואל א א, יג",quote:"ויחשבה עלי לשכורה - שלא היו רגילין להתפלל בלחש.",explain:"רש״י מסביר למה עלי טעה: באותם ימים אף אחד לא התפלל בלחש. חנה המציאה תפילה חדשה - וממנה באה תפילת העמידה שלנו."}]},
{id:"9-2",n:53,title:"הנער שמואל - ה׳ קורא בלילה",book:"שמואל א",chapters:"ג",ages:[5,11,13],holiday:"",topics:["שמואל","עלי","נבואה","שילה"],characters:["שמואל","עלי הכהן"],summary:"קול קורא בלילה לנער - שלוש פעמים הוא רץ לעלי, עד שעלי מבין",
body:["והנער שמואל משרת את ה׳ לפני עלי. ודבר ה׳ היה יקר בימים ההם - אין נבואה מפרצת. ויהי ביום ההוא: עלי שוכב במקומו, ועיניו החלו כהות, ונר א-להים טרם יכבה, ושמואל שוכב בהיכל ה׳ אשר שם ארון א-להים.","ויקרא ה׳ אל שמואל! ויאמר: הנני. וירץ אל עלי: הנני, כי קראת לי. ועלי אומר: לא קראתי - שוב שכב. וילך וישכב. ויקרא ה׳ עוד, שמואל! ויקם שמואל וילך אל עלי: הנני. ויאמר: לא קראתי בני, שוב שכב. ופעם שלישית! ועלי מבין כי ה׳ קורא לנער.","ויאמר עלי: לך שכב, והיה אם יקרא אליך ואמרת: דבר ה׳ כי שומע עבדך. ויבוא ה׳ ויתיצב ויקרא כפעם בפעם: שמואל, שמואל! ויאמר שמואל: דבר, כי שומע עבדך.","וה׳ גילה לו דברים קשים על בית עלי - ושמואל פתח את דלתות בית ה׳ כרגיל בבוקר, ופחד מהגיד לעלי. ועלי קרא לו: שמואל בני. ויאמר: הנני. ויעל עליו שבועה שלא יכחד ממנו דבר - ושמואל הגיד לו הכול. ויאמר עלי: ה׳ הוא, הטוב בעיניו יעשה.","ויגדל שמואל, וה׳ היה עמו, ולא הפיל מכל דבריו ארצה. וידע כל ישראל מדן ועד באר שבע כי נאמן שמואל לנביא לה׳."],
lesson:"שמואל היה ילד - וה׳ דיבר דווקא אליו. ומה שהוא אמר בבוקר? דבר, כי שומע עבדך. הכנה להקשיב היא ההתחלה של כל גדולה."},
{id:"9-3",n:54,title:"הארון נלקח - ודגון נופל על פניו",book:"שמואל א",chapters:"ד-ו",ages:[5,11,13],holiday:"",topics:["ארון","פלשתים","דגון","עלי","אשדוד"],characters:["עלי הכהן","חופני ופינחס","איש בנימין","פלשתים"],summary:"ישראל מוציא את הארון למלחמה כמו קמע - והארון נלקח בשבי",
body:["פלשתים יוצאים למלחמה בישראל - וישראל מובס, ארבעת אלפים איש. וזקני ישראל אומרים: נקחה אלינו משילה את ארון ברית ה׳, ויבוא בקרבנו ויושיענו! הם חשבו שהארון עצמו יושיע - בלי לב.","וכאשר בא ארון ברית ה׳ אל המחנה, ויריעו כל ישראל תרועה גדולה. ופלשתים נבהלו: אל אלינו, היום! ופלשתים נלחמו - וישראל נפלו שלושים אלף רגלי. וארון הא-להים נלקח, ושני בני עלי - חופני ופינחס - מתו.","ואיש בנימין רץ מהמערכה ויבוא שילה, בגדיו קרועים ואדמה על ראשו. ועלי יושב על הכסא בדרך מסכל - כי היה לבו חרד על ארון הא-להים. והאיש מספר: נס ישראל, ושני בניך מתו, וארון הא-להים נלקח. וכאשר הזכיר את ארון הא-להים - ויפל עלי מעל הכסא אחורנית, ותשבר מפרקתו וימת. תשעים ושמונה שנה, ושפט את ישראל ארבעים שנה.","ופלשתים שמים את הארון בבית דגון באשדוד. וישכימו אשדודים למחרת - והנה דגון נופל לפניו ארצה, לפני ארון ה׳! הם מחזירים אותו - ובבוקר הבא דגון נופל, וראש דגון ושתי כפות ידיו כרותות אל המפתן; רק דגון נשאר עליו. ויד ה׳ תכבד על האשדודים. שבעה חודשים היה הארון בשדה פלשתים - עד שהחזירו אותו עם מנחה: עגלה חדשה וקרון."],
lesson:"ישראל חשבו שהארון הוא קמע - סמל שמציל בלי קשר ללב. הפלשתים למדו שהארון הוא דבר אמיתי. הלקח לשני הצדדים: ה׳ לא גר בתיבה; ה׳ גר בלב.",
note:"מתים בסיפור: חופני ופינחס ועלי. השלב של דגון והמחלות בפלשתים - ספרו בעדינות לפי הגיל."},
{id:"9-4",n:55,title:"שאול - מחפש אתונות, נמצא מלך",book:"שמואל א",chapters:"ט-י",ages:[5,11,13],holiday:"",topics:["שאול","שמואל","מלך","אתונות"],characters:["שאול בן קיש","שמואל","נערו של שאול"],summary:"בחור גבוה שיצא לחפש אתונות אבודות - ושמואל סך אותו למלך",
body:["בני ישראל מבקשים מלך - ככל הגויים. שמואל מתרעם, וה׳ אומר לו: שמע בקול העם - כי לא אותך מאסו, כי אותי מאסו ממלוך עליהם.","ובזמן ההוא אבדו אתונות לקיש איש בנימין. וקיש אומר לבנו שאול: קח נא אתך את אחד הנערים ולך בקש את האתונות. שאול והנער עוברים בהר אפרים ובארץ שלשה - ולא מצאו. שאול רוצה לחזור: פן יחדל אבי מן האתונות ודאג לנו. והנער אומר: הנה נא איש א-להים בעיר הזאת, והאיש נכבד - כל אשר ידבר בוא יבוא! נלכה שמה.","הם עולים לעיר - ושמואל יוצא לקראתם. וה׳ כבר גילה את אוזן שמואל: בעת מחר אשלח אליך איש מארץ בנימין, ומשחתו לנגיד על עמי ישראל! וכאשר ראה שמואל את שאול - וה׳ ענהו: הנה האיש! ושאול גבה מכל העם משכמו ומעלה.","ושמואל לוקח את שאול ונערו ללשכה, נותן לו את השוק הטובה. ולמחרת בבוקר, על הגג, שמואל מושח את שאול בשמן ונותן לו אותות. ובמסיבת הגורל במצפה - שאול נבחר, ומתחבא בין הכלים! מבושת של מלך ענו. וכל העם מריע: יחי המלך!"],
lesson:"שאול יצא לחפש אתונות - ומצא מלכות. אבל שימו לב: הוא לא חיפש מלכות. הוא עשה את השליחות הקטנה של אביו בדיוק - ודרכה בא הדבר הגדול.",
rashi:[{ref:"שמואל א ט, כ",quote:"ולמי כל חמדת ישראל - כאן בא לרמוז לו דבר המלוכה.",explain:"רש״י מסביר: שמואל רמז לשאול עוד לפני המשיחה - כל מה שישראל מייחלים לו, כל החמדה, הולך להיות עליו ועל בית אביו."}]},
{id:"9-5",n:56,title:"להשמיע טוב מזבח - שאול ועמלק",book:"שמואל א",chapters:"טו",ages:[11,13],holiday:"",topics:["שאול","עמלק","שמואל","אגג","מלכות"],characters:["שאול","שמואל","אגג מלך עמלק"],summary:"שאול חוס על אגג ועל הטוב שבצאן - ומאבד את המלכות",
body:["ה׳ ציווה דרך שמואל: לך והכיתה את עמלק - מה שעמלק עשה לישראל בדרך ממצרים, כשתקף את הנחשלים אחריך. והחרמתם את כל אשר לו, ולא תחמול עליו.","ושאול יוצא למלחמה - והכה את עמלק מהבילה עד שור. ויתפס את אגג מלך עמלק חי. וישאו ויחמול שאול והעם על אגג, ועל מיטב הצאן והבקר - ולא החרימו.","ויהי דבר ה׳ אל שמואל: ניחמתי כי המלכתי את שאול למלך, כי שב מאחרי. ושמואל זעק אל ה׳ כל הלילה. ובבוקר שמואל בא אל שאול - ושאול אומר: ברוך אתה לה׳, הקימותי את דבר ה׳! ושמואל: ומה קול הצאן הזה באזני, וקול הבקר אשר אנכי שומע? ושאול אומר: מעמלקי הביאום, אשר חמל העם על מיטב הצאן - למען זבוח לה׳!","ושמואל עונה את המשפט המפורסם: החפץ לה׳ בעולות וזבחים - כשמוע בקול ה׳? הנה שמוע מזבח טוב, להקשיב מחלב אילים! כי חטאת קסם מרי, ואון ותרפים הפצר. יען מאסת את דבר ה׳ - וימאסך ממלך.","ואגג מלך עמלך מת. ושמואל לא יסף עוד לראות את שאול עד יום מותו - כי התאבל שמואל על שאול."],
lesson:"שאול עשה כמעט הכול - אבל החליט בעצמו איזה חלק לקיים. להשמיע טוב מזבח: מצווה היא לא מה שנוח לנו ממנה, אלא כולה.",
note:"עונשו של שאול קשה, והחרמת עמלק היא פסוקים שקשה לילדים לעכל - התמקדו במסר של שמוע מזבח ובבחירה של שאול לחמול דווקא על הטוב.",
rashi:[{ref:"שמואל א טו, כב",quote:"הנה שמע - בקולו, טוב מזבח.",explain:"רש״י מסביר: לשמוע בקול ה׳ - זה טוב יותר מזבח. הכוונה במילה שמוע היא הקשבה מלאה, לא חצי שמיעה."}]},
{id:"9-6",n:57,title:"דוד וגליית - בא לך בשם ה׳",book:"שמואל א",chapters:"יז",ages:[5,11,13],holiday:"",topics:["דוד","גליית","קלע","אבן","ישי","אליעב"],characters:["דוד","גליית","שאול","ישי","אליעב"],summary:"רועה צעיר יוצא עם חמש אבני חלוק - נגד ענק שחרף את ישראל ארבעים יום",
body:["גליית הפלשתי מגת, גבוהו שש אמות וזרת, שריון משקל חמשת אלפים שקלים - יוצא ומתחרף את מערכות ישראל ארבעים יום: אני חרפתי את מערכות ישראל! תנו לי איש ונלחמה יחד. ואיש מישראל לא עונה - כולם פוחדים.","ודוד בן ישי אפרתי מבית לחם - צעיר האחים, רועה צאן. אביו שולח אותו להביא לחם לאחיו במחנה. דוד שומע את גליית - ושואל: מי הפלשתי הערל הזה כי חרף מערכות א-להים חיים? ואליעב אחיו הגדול כועס עליו: למה זה ירדת, ועל מי נטשת מעט הצאן ההנה במדבר?","שאול שומע ומזמין את דוד. דוד אומר: את הארי ואת הדוב הכה עבדך, כשבא על הצאן! ה׳ אשר הצילני מיד הארי ומיד הדוב - הוא יצילני מיד הפלשתי הזה. שאול מלביש אותו שריון - ודוד מנסה ואומר: לא אוכל ללכת באלה, כי לא נסיתי. ויסרם מעליו.","ויקח דוד מקלו בידו, ויבחר לו חמשה חלוקי אבנים מן הנחל, ויקרב אל הפלשתי. גליית רואה נער אדמוני עם יפה עינים ומזלזל בו: הכלב אנכי כי אתה בא אלי במקלות? ודוד עונה: אתה בא אלי בחרב ובחנית ובכידון - ואנכי בא אליך בשם ה׳ צבאות, א-להי מערכות ישראל אשר חרפת! והיום הזה יסגרך ה׳ בידי - וידעה כל הארץ כי יש א-להים לישראל.","וימהר דוד וירץ המערכה לקראת הפלשתי, וישלח ידו אל הכלי, ויקח משם אבן, ויקלע - ויך את הפלשתי אל מצחו, ותטבע האבן במצחו, ויפל על פניו ארצה. וירץ דוד ויעמד על הפלשתי, ויקח את חרבו וימתהו. ופלשתים נסו - ובני ישראל רדפו אחריהם עד שערי עקרון."],
lesson:"דוד לא ניצח בגלל שהיה חזק - הוא ניצח כי ידע למי הוא שייך. חמש אבנים ושם ה׳ מנצחים שריון של חמשת אלפים שקלים. הגדולה האמיתית היא לדעת עם מה באים.",
rashi:[{ref:"שמואל א יז, מט",quote:"ויפל על פניו - לא היה לו לפול אלא לאחוריו, שהרי על מצחו הכה, אלא כדי שלא יצטער דוד לילך ולחתך את ראשו.",explain:"רש״י שם לב לפרט מוזר: גליית נפל קדימה על פניו, אף שהאבן פגעה במצחו. רש״י מסביר: נס קטן בתוך הנס - כדי שלא יצטרך דוד ללכת עוד מלא קומה כדי לחתוך את ראשו."}]},
{id:"9-7",n:58,title:"אביגיל - אשה שעצרה מלך בדרך",book:"שמואל א",chapters:"כה",ages:[11,13],holiday:"",topics:["אביגיל","נבל","דוד","חכמה"],characters:["דוד","אביגיל","נבל הכרמלי"],summary:"נבל מסרב לתת לחם לדוד - ואביגיל יוצאת לקראתו עם שני מאות ככרות",
body:["דוד בורח משאול במדבר פארן, והאנשים שלו שומרים על הצאן של נבל הכרמלי - איש עשיר מאוד, אך קשה ורע מעללים, כשמו כן הוא: נבל שמו ונבלה עמו. וביום גזז הצאן דוד שולח עשרה נערים לבקש בנימוס: תנו נא את אשר תמצא ידך לעבדיך ולבנך לדוד.","ונבל עונה בגסות: מי דוד ומי בן ישי? ואקחתי את לחמי ואת מימי ואת טבחתי אשר טבחתי לגוזזי - ונתתי לאנשים אשר לא ידעתי אי מזה המה? והנערים חוזרים לדוד - ודוד אומר לאנשיו: חגרו איש את חרבו! ויעלו אחריו כארבע מאות איש לנקום.","ועבד אחד מספר לאביגיל אשת נבל - אשת טובת שכל ויפת תואר. ותמהר אביגיל, ותקח מאתיים לחם ושני נבלי יין וחמש צאן עשויות, ותרכב על החמור ותרד בסתר ההר - והנה דוד ואנשיו יורדים לקראתה!","ותפל אביגיל לרגלי דוד, ותקח את האשמה עליה: בי אני אדוני העון! ואל ישום לבו אל איש הבליעל על נבל - כי כשמו כן הוא. ועתה, חי ה׳ אשר מנעך מבוא בדמים והושע ידך לך! ואם לא היית מיהרת ותבאת לקראתי - לא נותר לנבל עד אור הבוקר משתין בקיר. ותבקש סליחה: והיה כי ייטיב ה׳ לאדוני - וזכרת את אמתך.","ודוד מקבל: ברוך ה׳ אשר שלחך היום הזה לקראתי, וברוך טעמך! ואביגיל חוזרת הביתה. ויהי בבוקר - ויגדה לו את הדברים האלה, וימת לבו בקרבו. ויהי כעשרת ימים ויגף ה׳ את נבל וימת. ודוד שולח ויקח את אביגיל לו לאשה."],
lesson:"אביגיל לא התווכחה ולא צעקה. היא באה מוכנה - עם לחם, עם כבוד, ועם דברי אמת קשים אבל עדינים. חכמה וכבוד עוצרים מלחמה טוב יותר מכל חרב."}]},
{id:10,title:"שמואל ב - דוד מלך ישראל",book:"שמואל ב",chapters:"",status:"ready",stories:[
{id:"10-1",n:59,title:"דוד מלך - מחברון לירושלים",book:"שמואל ב",chapters:"ה",ages:[5,11,13],holiday:"",topics:["דוד","ירושלים","חברון","מלכות"],characters:["דוד","זקני ישראל","יבוסי"],summary:"אחרי שבע שנים בחברון - כל השבטים באים למשוח את דוד, והוא כובש את ירושלים",
body:["אחרי מות שאול ויונתן בהר הגלבוע, דוד נמלך קודם על בית יהודה בחברון - שבע שנים ושישה חודשים. ואז באו כל שבטי ישראל אל דוד חברונה: הנה עצמך ובשרך אנחנו! גם אתמול גם שלשום, בהיות שאול מלך עלינו, אתה הייתה המוציא והמביא את ישראל. ויכרת דוד אתם ברית בחברון לפני ה׳, וימשחו את דוד למלך על ישראל.","בן שלושים שנה דוד במלכו, וארבעים שנה מלך.","והמלך ואנשיו הלכו לירושלים - עיר יבוסית בתוך הארץ, שלא נכבשה מימי יהושע. היבוסי לועגים: לא תבוא הלם כי אם הסירך העורים והפסחים! ודוד כובש את מצודת ציון - היא עיר דוד. ויבוא דוד במצודה וישב בה, וילך דוד הלוך וגדול, וה׳ א-להי צבאות עמו.","וחירם מלך צור שולח מלאכים אל דוד, וארזים ובונים - ויבנו בית לדוד. וידע דוד כי הכינו ה׳ למלך על ישראל, וכי נישא את מלכותו בעבור עמו ישראל.","ופלשתים שומעים כי משחו את דוד - ועולים לבקש אותו. דוד שואל בה׳: האעלה אל פלשתים? ויאמר ה׳: עלה, כי נתן אתן את פלשתים בידך. ויכם בבעל פרעצים. ופעם שנית - וה׳ אומר: אל תעלה, הסב אל אחריהם ובאת להם ממול בכאים. והיה כשמעך את קול צעדה בראשי הבכאים - אז תחרץ, כי אז יצא ה׳ לפניך להכות במחנה פלשתים. ויעש דוד כן, ויכם את פלשתים."],
lesson:"דוד חיכה שנים ארוכות עד שמלך על כל ישראל - והוא לא מרד, לא דרס, לא קפץ על המרק. כשהמקום הנכון בא בזמן הנכון - הוא היה מוכן."},
{id:"10-2",n:60,title:"הארון עולה לירושלים - דוד מכרכר בכל עוז",book:"שמואל ב",chapters:"ו",ages:[5,11,13],holiday:"",topics:["ארון","ירושלים","דוד","מיכל","שמחה"],characters:["דוד","מיכל בת שאול","עובד אדום"],summary:"דוד מעלה את הארון ברכב חדש - עוזה נופל, ואז: ריקודים ומחלות לפני ה׳",
body:["דוד אוסף שלושים אלף בחור מישראל להעלות את ארון הא-להים מקרית יערים. וישימו את הארון על עגלה חדשה. ודוד וכל בית ישראל משחקים לפני ה׳ בכל עצי ברושים, ובכנרות ובנבלים ובתפים ובמנענעים ובצלצלים.","ויבואו עד גורן נכון - הבקר נתקלטו. וישלח עוזה אל ארון הא-להים ויאחז בו. ויחר אף ה׳ בעוזה וימתהו שם. ויחר לדוד, ויירא דוד את ה׳ ביום ההוא: איך יבוא אלי ארון ה׳? והארון נשאר שלושה חודשים בבית עובד אדום הגתי - ויברך ה׳ את עובד אדום ואת כל ביתו.","והוגד לדוד: ברך ה׳ את בית עובד אדום בעבור ארון הא-להים! וילך דוד ויעל את ארון הא-להים מבית עובד אדום עיר דוד - בשמחה. ויהי כי צעדו נושאי ארון ה׳ ששה צעדים - ויזבח שור ומריא. ודוד מכרכר בכל עוז לפני ה׳, ודוד חגור אפוד בד. ודוד וכל בית ישראל מעלים את ארון ה׳ בתרועה ובקול שופר.","ומיכל בת שאול נשקפה דרך החלון - ותרא את המלך דוד מפזז ומכרכר לפני ה׳, ותבז לו בלבה. וכאשר בא דוד לברך את ביתו, יצאה מיכל לקראתו: מה נכבד היום מלך ישראל אשר נגלית היום לעיני אמהות עבדיו! ויאמר דוד: לפני ה׳ - אשר בחר בי מאביך ומכל ביתו - לפני ה׳ שחקתי. ונקלותי עוד מזאת והייתי שפל בעיני - ועם האמהות אשר אמרת עמם אכבדה!"],
lesson:"מיכל בזה את דוד על שהשפיל את עצמו בריקוד. ודוד עונה: לפני ה׳ אני קטן בכיך. גדולה אמיתית לא צריכה להסתכל על עצמה במראה כל הזמן - לפני ה׳, כולנו קטנים.",
rashi:[{ref:"שמואל ב ו, יד",quote:"מכרכר - מרקד.",explain:"רש״י מסביר את המילה מכרכר: דוד רקד מכל הלב לפני הארון - לא בוש, לא נצבע, אמיתי."}]},
{id:"10-3",n:61,title:"חסד דוד - מפיבושת יושב על שלחנו",book:"שמואל ב",chapters:"ט",ages:[5,11,13],holiday:"",topics:["מפיבושת","יונתן","חסד","ציבא","ברית"],characters:["דוד","מפיבושת בן יונתן","ציבא"],summary:"מלך שמחפש למי לעשות חסד - בגלל ברית ישנה עם יונתן",
body:["רוב המלכים שואלים: מי נשאר מבית המלך הקודם - כדי להיפטר ממנו. דוד שואל הפוך: הכי יש עוד אשר נותר לבית שאול - ואעשה עמו חסד בעבור יונתן?","וימצאו ציבא עבד בית שאול, וציבא אומר: עוד בן ליונתן - נכה רגלים. מפיבושת, בן יונתן, שהתפצע בשתי רגליו כשהאומנת ברחה עמו ביום הנפילה.","דוד שולח ולוקח אותו מבית מכיר בן עמיאל מלו דבר. ומפיבושת בא אל דוד ויפל על פניו וישתחו. ויאמר דוד: מפיבושת! ויאמר: הנה עבדך. ויאמר לו דוד: אל תירא - כי עשה אעשה עמך חסד בעבור יונתן אביך. והשבתי לך את כל שדה שאול אביך, ואתה תאכל לחם על שלחני תמיד.","וישתחו מפיבושת ויאמר: מה עבדך, כי פנית אל הכלב המת אשר כמוני? ודוד קורא לציבא: כל אשר היה לשאול ולכל ביתו נתתי לבן אדוניך. ועבדת לו את האדמה - אתה ובניך ועבדיך.","ומפיבושת יושב בירושלים, כי על שלחן המלך תמיד הוא אוכל - כאחד מבני המלך."],
lesson:"דוד זכר ברית מלפני עשרים שנה, לאדם שכבר לא היה בעולם. חסד אמיתי הוא חסד שאף אחד לא רואה ואף אחד לא מחזיר עליו."},
{id:"10-4",n:62,title:"המשל של נתן - אתה האיש",book:"שמואל ב",chapters:"יא-יב",ages:[11,13],holiday:"",topics:["נתן","דוד","בת שבע","אוריה","משל","תשובה"],characters:["דוד","נתן הנביא","בת שבע","אוריה החתי"],summary:"דוד חוטא חטא גדול - ונביא מספר לו משל על כבשה קטנה",
body:["ויהי לעת שוב השנה, לעת צאת המלכים - ודוד יושב בירושלים. ודוד רואה מעל הגג אשה רוחצת, בת שבע אשת אוריה החתי, ולוקח אותה. ואוריה, חייל נאמן במלחמה - דוד שולח אותו לחזית, והוא נופל. זה היה החטא הגדול של דוד.","וישלח ה׳ את נתן אל דוד. ונתן לא בא באשמה - הוא בא במשל: שני אנשים בעיר אחת, אחד עשיר ואחד ראש. לעשיר צאן ובקר הרבה מאוד, ולראש אין כל - כי אם כבשה אחת קטנה אשר קנה ויחיה, ותגדל עמו ועם בניו יחדו: מפתו תאכל ומכוסו תשתה ובחיקו תשכב, ותהי לו כבת. ויבוא הלך לאיש העשיר - ויחמל לקחת מצאנו, ויקח את כבשת האיש הראש!","ויחר אף דוד באיש מאוד, ויאמר אל נתן: חי ה׳, כי בן מות האיש העושה זאת! ואת הכבשה ישלם ארבעתים - יען אשר עשה את הדבר הזה, ויען לא חמל.","ויאמר נתן אל דוד: אתה האיש! כה אמר ה׳: אנכי משחתיך למלך על ישראל, ואנכי הצלתיך מיד שאול - ואם מעט, ואוספה לך כהנה וכהנה. מדוע בזית את דבר ה׳ לעשות הרע בעיני? את אוריה החתי הכית בחרב, ואת אשתו לקחת לך לאשה!","ודוד לא התווכח. הוא אמר שתי מילים: חטאתי לה׳. ויאמר נתן: גם ה׳ העביר חטאתך - לא תמות. אבל הדבר לא עבר בלי תוצאות: הבית של דוד התחיל להתפורר מבפנים."],
lesson:"המשל עשה מה שאף האשמה לא יכולה: דוד ראה את עצמו מבחוץ וצדק על האיש הרע - ואז גילה שהוא האיש. לפעמים צריך משל כדי לראות את האמת על עצמנו. ודוד הוכיח את גודלו דווקא בשתי מילים: חטאתי לה׳. בלי תירוצים.",
note:"סיפור בת שבע ואוריה מורכב - לילדים מספיק: דוד לקח משהו שלא שלו ופגע באדם נאמן, והמשל של נתן גרם לו להודות. ההתמקדות היא במשל ובתשובה, לא בפרטי החטא.",
rashi:[{ref:"שמואל ב יב, ה",quote:"כי בן מות - הגוזל את העני, כאלו נוטל את נפשו.",explain:"רש״י מסביר את חומרת הדבר שדוד עצמו קבע: מי שגוזל מעני את הדבר הקטן שהוא כל עולמו - כאילו נוטל את נפשו."}]},
{id:"10-5",n:63,title:"אבשלום - הבן שגנב את לב העם",book:"שמואל ב",chapters:"יד-יח",ages:[11,13],holiday:"",topics:["אבשלום","דוד","מרד","שער העיר"],characters:["אבשלום","דוד","חושי הארכי","אחיתופל","יואב"],summary:"הנסיך הכי יפה בישראל עומד בל כל שנה במשקל שערו - ומרד באביו",
body:["אבשלום בן דוד - איש יפה מאוד, מכף רגלו ועד קדקדו לא היה בו מום. ובגזזו את שערו, שקלו שער ראשו - מאתיים שקלים במשקל המלך. והוא עמד בפתח השער וגנב את לבבות אנשי ישראל: ראה, דבריך טובים ונכוחים - ושומע אין לך מאת המלך! לו ישימוני שופט בארץ!","ואחר ארבעים שנה אבשלום מבקש ללכת לחברון לשלם נדר - ושם מכריזים: מלך אבשלום בחברון! ודוד בורח מירושלים עם נאמניו, דרך בית הזית, יחף ובוכה. והמרד נמשך - והמלחמה נפגשת ביער אפרים. ותחז מלחמת ישראל את עם דוד - יום ההוא עשרים אלף איש, והיער רבה לאכול בעם.","ואבשלום נפגש עם עבדי דוד, ואבשלום רוכב על הפרד - ויבוא הפרד תחת שובך האלה הגדולה, ויחזק ראשו באלה! שערו הגדול, שבו התפאר, נתלה באלון - והפרד עברה תחתיו, והוא נשאר תלוי בין שמים לארץ.","ויואב לוקח שלושה שבטים בחפו - ויתקעם בלב אבשלום, עודנו חי בלב האלה. ודוד, ששמע את הבשורה, עלה אל עליית השער ויתאבל: בני אבשלום! מי יתן מותי אני תחתיך, אבשלום בני בני!","והעם ששמח בנצחון - התבייש, כי שמעו שהמלך מתאבל על בנו."],
lesson:"אבשלום התפאר בשערו - והשער תלה אותו. ודוד, למרות הכול, בכה על הבן שמרד בו. שני לקחות: גאווה הופכת לחבל, ואהבה של הורה לא נגמרת גם כשהבן טועה נורא.",
note:"מרד אבשלום מלווה בסיפור תמר ואמנון (פרק יג) שאינו מתאים לילדים - דילגנו עליו. דמי האב בוכה על בנו חזק מאוד - הכינו את הילדים."},
{id:"10-6",n:64,title:"מי ישקני מים - באר בית לחם",book:"שמואל ב",chapters:"כג",ages:[5,11,13],holiday:"",topics:["דוד","גיבורים","באר","בית לחם","נאמנות"],characters:["דוד","שלושת הגיבורים"],summary:"משאלת לב אחת של מלך צמא - ושלושה גיבורים פורצים את מחנה פלשתים",
body:["בצבת פלשתים בבית לחם, ודוד במצודה בעדולם. ויתאו דוד ויאמר: מי ישקני מים מבור בית לחם אשר בשער? לא ציווה - רק אמר מה שהלב שלו רצה: מים מבאר העיר של ילדותו.","ושלושה מן הגיבורים ששמעו - לא שאלו שאלות. ויבקעו במחנה פלשתים, וישאבו מים מבור בית לחם אשר בשער, וישאו ויביאו אל דוד. דרך שורה שלמה של אויב - בשביל משאלת לב אחת.","ודוד לא שתה. ויאמר: חלילה לי מה׳ מעשותי זאת! הדם האנשים ההולכים בנפשותם? והסיר את הכוס - וישפך אותה לה׳. כי המים האלה הם דם נפשות של גיבורים.","והם היו גיבורי דוד - אנשים שהיו מוכנים לרוץ דרך מחנה שלם לא בגלל צו, אלא בגלל שאהבו את דוד וידעו מה ישמח אותו."],
lesson:"שלושת הגיבורים למדו אהבה: לשמוע את מה שלא נאמר. ודוד למד אחריות: אם מישהו מסכן נפשו בשבילך - זה קדוש מכדי לשתות. מנהיג אמיתי לא נהנה מקרבן של אחרים.",
rashi:[{ref:"שמואל ב כג, טו",quote:"מי ישקני מים - אמרו רבותינו (בבא קמא ס:): הצרך לשאול שאלה מסנהדרין היושבים בשער בית לחם.",explain:"רש״י מביא דרש של חז״ל: דוד לא באמת רצה מים - הוא היה צריך לשאול שאלת הלכה מסנהדרין שישבה בשער בית לחם. וגם לצורך רוחני - הגיבורים רצו דרך מחנה אויב."}]},
{id:"10-7",n:65,title:"שירת דוד - סלעי ומצודתי",book:"שמואל ב",chapters:"כב",ages:[5,11,13],holiday:"",topics:["דוד","שירה","תהילים","הודיה"],characters:["דוד"],summary:"בסוף החיים דוד כותב שיר אחד ארוך - כל ההצלות בשורות",
body:["וידבר דוד לה׳ את דברי השירה הזאת, ביום הציל ה׳ אותו מכף כל איביו ומכף שאול. והיא אחת השירות היפות בתנ״ך - שחוזרת גם בספר תהילים.","ה׳ סלעי ומצודתי ומפלטי לי! א-להי צורי אחסה בו, מגני וקרן ישעי, משגבי ומנוסי, מושיעי - מחמס תושיעני!","דוד מספר בשירה את כל מה שעבר: כי אפפוני משברי מות, נחלי בליעל יבעתוני. במצר לי אקרא ה׳, ואל א-להי אקרא - וישמע מהיכלו קולי! והשירה מתארת את ה׳ יורד להצילו - עננים, אש, ברקים - וישלח ממרום יקחני, ימשני ממים רבים.","וכמה פסוקים קטנים שילדים אוהבים: כי אתה נירי ה׳, וה׳ יגיה חשכי. כי בך ארץ גדוד, ובא-להי אדלג שור!","ובסוף השירה דוד חוזר לעיקר: ה׳ חי! וברוך צורי! מגדיל ישועות מלכו, ועושה חסד למשיחו - לדוד ולזרעו, עד עולם.","וככה נגמר סיפור דוד: לא בתיבה של נצחונות, אלא בשירה. כי דוד ידע שכל מה שהיה לו - חרב, כתר, עיר, גיבורים - הוא מתנה, ושירה היא הדרך להגיד תודה."],
lesson:"אחרי חיים שלמים של מלחמות - דוד לא כתב ספר זכרונות על גבורותיו. הוא כתב שירה לה׳. ההרגל האחרון והחשוב ביותר: לספור את ההצלות, לא את הפחדים.",
rashi:[{ref:"שמואל ב כב, ב",quote:"סלעי ומצודתי - לשון חוזק הם.",explain:"רש״י מסביר: סלע ומצודה הם מילים של חוזק. דוד מתאר את ה׳ כמבצר הכי חזק שיש - ובאמת, כל החיים הוא נמלט אליו."}]}]},
{id:11,title:"מלכים א - שלמה ובית המקדש",book:"מלכים א",chapters:"",status:"ready",stories:[
{id:"11-1",n:66,title:"החלום בגבעון - בקש חכמה",book:"מלכים א",chapters:"א-ג",ages:[5,11,13],holiday:"",topics:["שלמה","חלום","חכמה","גבעון"],characters:["שלמה","דוד"],summary:"ה׳ מופיע לשלמה בחלום ואומר: שאל מה אתן לך. ושלמה מבקש לב שומע",
body:["דוד זקן, ולפני מותו הוא מדבר עם שלמה בנו: חזקת והיית לאיש. ושמרת את משמרת ה׳. ונתן ובת שבע וצדוק הכהן מושחים את שלמה למלך - וכל העם אומר: יחי המלך שלמה!","ושלמה הולך לגבעון לזבוח שם, כי שם אהל מועד. וילך שלמה גבעונה - ויזבח על המזבח אלף עולות.","בגבעון נראה ה׳ אל שלמה בחלום הלילה. ויאמר א-להים: שאל - מה אתן לך? ושלמה עונה: אתה עשית עם עבדך דוד אבי חסד גדול, ועתה המלכת את עבדך תחת דוד אבי. ואנכי נער קטן, לא אדע צאת ואבוא. ועבדך בתוך עמך אשר בחרת - עם רב אשר לא ימנה ולא יספר מרב. ונתת לעבדך לב שומע, לשפוט את עמך, להבין בין טוב לרע. כי מי יוכל לשפט את עמך הכבד הזה?","וייטב הדבר בעיני ה׳, כי שאל שלמה את הדבר הזה. ויאמר לו א-להים: יען אשר שאלת את הדבר הזה, ולא שאלת לך ימים רבים, ולא שאלת לך עושר, ולא שאלת את נפש איביך - ושאלת לך הבין לשמוע משפט! הנה נתתי לך לב חכם ונבון, אשר כמוך לא היה לפניך ואחריך לא יקום כמוך. וגם אשר לא שאלת נתתי לך - גם עושר גם כבוד, אשר לא היה כמוך איש במלכים כל ימיך.","ויקץ שלמה - והנה חלום. ויבוא ירושלים ויעמוד לפני ארון ברית ה׳, ויעש משתה לכל עבדיו."],
lesson:"שלמה יכול היה לבקש כסף, חיים ארוכים, או נצחון על אויבים. הוא ביקש לב שומע - כי הבין שמנהיג בלי הקשבה הוא כלום. מה שהכי שווה לבקש זה כלים לעשות טוב, לא פרסים.",
rashi:[{ref:"מלכים א ג, ט",quote:"את עמך הכבד - מתוך שהם רבים, יש להם עסקים רבים, ובאים לדין.",explain:"רש״י מסביר למה שלמה קרא לישראל עם כבד: עם גדול זה הרבה משפטים, הרבה שאלות, הרבה אחריות. לכן הוא ביקש לב שומע."}]},
{id:"11-2",n:67,title:"משפט שלמה - היא אמו",book:"מלכים א",chapters:"ג",ages:[5,11,13],holiday:"",topics:["משפט שלמה","חכמה","שתי נשים","התינוק"],characters:["שלמה","שתי הנשים"],summary:"שתי נשים, תינוק אחד חי - והמלך מצווה: חצו את הילד החי לשנים",
body:["ביום אחד באות שתי נשים זונות אל המלך ותעמודנה לפניו. ואחת אומרת: בי אדוני, אני והאשה הזאת יושבות בבית אחד, ואלד עמה בבית. ויהי ביום השלישי ללדתי - ותלד גם האשה הזאת. ואין זר אתנו בבית. ותשכב האשה הזאת על בנה בלילה ותמיתהו, ותקם בתוך הלילה ותקח את בני מצדי - ותשכיבהו בחיקה, ואת בנה המת השכיבה בחיקי! ואקם בבוקר להיניק את בני - והנה מת. ואתבונן אליו בבוקר - והנה לא היה בני אשר ילדתי.","והאשה האחרת אומרת: לא כי! בני החי ובנך המת. וזאת אומרת: לא כי, בנך המת ובני החי. ותדברנה לפני המלך.","ויאמר המלך: זאת אומרת זה בני החי ובנך המת, וזאת אומרת לא כי בנך המת ובני החי. ויאמר המלך: קחו לי חרב. ויביאו החרב לפני המלך. ויאמר המלך: גזרו את הילד החי לשנים - ותנו את החצי לאחת ואת החצי לאחת!","ותאמר האשה אשר בנה החי אל המלך, כי נכמרו רחמיה על בנה: בי אדוני! תנו לה את הילוד החי - והמת אל תמיתהו! וזאת אומרת: גם לי גם לך לא יהיה - גזורו.","ויען המלך ויאמר: תנו לה את הילוד החי - והמת לא תמיתהו. היא אמו!","וישמעו כל ישראל את המשפט אשר שפט המלך, וייראו מפני המלך, כי ראו כי חכמת א-להים בקרבו לעשות משפט."],
lesson:"שלמה ידע אמת פשוטה: אמא אמיתית מוכנה לוותר על הכול כדי שהילד יחיה. חכמה היא לא לדעת תשובות - אלא לשאול את השאלה שחושפת את האמת.",
rashi:[{ref:"מלכים א ג, כז",quote:"היא אמו - בת קול הופיעה ואמרה: היא אמו.",explain:"רש״י מסביר: איך ידע שלמה בוודאות? יצאה בת קול משמים ואמרה - היא אמו. החכמה שלו איתרה את האמת, והשמים אישרו."}]},
{id:"11-3",n:68,title:"שלמה החכם - משל ועץ ודג",book:"מלכים א",chapters:"ד-ה",ages:[5,11,13],holiday:"",topics:["שלמה","חכמה","משלים","שלום"],characters:["שלמה","חירם מלך צור"],summary:"ישה ויהודה וישראל רבים כחול - וכל אחד תחת גפנו ותחת תאנתו",
body:["ויהודה וישראל רבים, כחול אשר על הים לרוב - אוכלים ושותים ושמחים. ושלמה היה מושל בכל הממלכות מן הנהר ועד ארץ פלשתים ועד גבול מצרים. וישב יהודה וישראל לבטח, איש תחת גפנו ותחת תאנתו, מדן ועד באר שבע - כל ימי שלמה.","ויתן ה׳ חכמה לשלמה ותבונה הרבה מאוד, ורוחב לב כחול אשר על שפת הים. ותרב חכמת שלמה מחכמת כל בני קדם ומכל חכמת מצרים. ויהי חכם מכל האדם, ויהי שמו בכל הגוים סביבות.","וידבר שלשת אלפים משל, ויהיו שיריו אלף וחמשה. וידבר על העצים - מן הארז אשר בלבנון ועד האזוב אשר יוצא בקיר. וידבר על הבהמה ועל העוף ועל הרמש ועל הדגים! ויבואו מכל העמים לשמוע את חכמת שלמה, מאת כל מלכי הארץ אשר שמעו את חכמתו.","וחירם מלך צור שולח עבדיו אל שלמה - ויהיו שלום ביניהם, כאשר היה עם דוד. ויחתכו ארזים מן הלבנון לבית ה׳."],
lesson:"שלמה דיבר גם על הארז הגבוה וגם על האזוב הקטן בקיר. חכמה אמיתית מסתכלת על הכול - גם על הדברים הקטנים שאף אחד לא מסתכל עליהם.",
rashi:[{ref:"מלכים א ה, יב",quote:"שלשת אלפים משל - שלשת למודי משלות, שלש פעמים כתוב 'משלי שלמה' בספר משלי.",explain:"רש״י מסביר: שלמה לימד את משליו בשלושה לימודים - ולכן בספר משלי כתוב שלוש פעמים משלי שלמה. כל משל שלו היה תורה שלמה."}]},
{id:"11-4",n:69,title:"בית המקדש - שבע שנים של אבן וארז",book:"מלכים א",chapters:"ה-ח",ages:[5,11,13],holiday:"חנוכה",topics:["בית המקדש","שלמה","חנוכת הבית","שכינה"],characters:["שלמה","חירם","עובדי לבנון"],summary:"בית אבנים גזית בלי קול פטיש - והענן ממלא את הבית בחנוכתו",
body:["ויהי בשמונים שנה וארבע מאות שנה לצאת בני ישראל מארץ מצרים - ויבן שלמה את הבית לה׳. אבנים גזית מסע הכינו בני הבית: אבן שלמה מסע הובאה, ובבית בהבנתו אבן שלמה מסע נבנה - ומקבת והגרזן, כל כלי ברזל, לא נשמע בבית בהבנתו! באתר קדוש - בלי רעש של ברזל.","והבית מכוסה ארז מבפנים, וצפוי זהב טהור, וחרובי פסלים - שני כרובים גדולים בדביר, עשויים עץ שמן, מצופים זהב, פורשים כנפיים. וכל הכלים - מזבח זהב, שלחן, מנורות זהב סגור, חמש מימין וחמש משמאול.","שבע שנים בנו את הבית. ואז, בחג בחודש האתנים - יום חנוכת הבית: שלמה מעלה את ארון ברית ה׳ מעיר דוד, ויכנסו הכהנים את הארון אל מקומו אל דביר הבית, אל קדש הקדשים. ויהי כצאת הכהנים מן הקודש - והענן מלא את בית ה׳! ולא יכלו הכהנים לעמוד לשרת מפני הענן - כי מלא כבוד ה׳ את בית ה׳.","ושלמה עומד לפני המזבח נגד כל הקהל, ויפרוש כפיו השמימה: ה׳ א-להי ישראל, אין כמוך א-להים בשמים ממעל ועל הארץ מתחת! ומתפלל תפילה ארוכה - על כל מי שיבוא להתפלל בבית הזה, גם על הנכרי אשר יבוא מארץ רחוקה: ואתה תשמע השמים מכון שבתך, ועשית ככל אשר יקרא אליך הנכרי!","והעם שמח וטוב לב על כל הטובה אשר עשה ה׳ - וילכו לאהליהם שמחים."],
lesson:"במקום הכי מפואר בארץ, שלמה מתפלל דווקא על הנכרי שיבוא מרחוק. בית אלוקים הוא בית שפתוח לכולם - הכולל הוא מה שהופך אותו לקדוש."},
{id:"11-5",n:70,title:"מלכת שבא - ולא היה בה עוד רוח",book:"מלכים א",chapters:"י",ages:[5,11,13],holiday:"",topics:["מלכת שבא","שלמה","חידות","תהילה"],characters:["שלמה","מלכת שבא"],summary:"מלכה מארץ רחוקה באה לנסות אותו בחידות - ונשארה בלי מילים",
body:["ומלכת שבא שומעת את שמע שלמה לשם ה׳ - ותבוא לנסותו בחידות. ותבוא ירושלימה בחיל כבד מאד, גמלים נושאים בשמים וזהב רב מאוד ואבן יקרה. ותבוא אל שלמה - ותדבר אליו את כל אשר היה עם לבבה. ויגד לה שלמה את כל דבריה - לא היה דבר נעלם מן המלך אשר לא הגיד לה.","ותרא מלכת שבא את כל חכמת שלמה, והבית אשר בנה, ומאכל שלחנו, ומושב עבדיו, ומעמד משרתיו ומלבושיהם, ומשקיו, ועלתו אשר יעלה בית ה׳ - ולא היה בה עוד רוח! פשוט נשארה בלי נשימה.","ותאמר אל המלך: אמת היה הדבר אשר שמעתי בארצי על דבריך ועל חכמתך - ולא האמנתי לדברים עד אשר באתי ותראינה עיני, והנה לא הגד לי חצי! הוספת חכמה וטוב על השמועה אשר שמעתי. אשרי אנשיך, אשרי עבדיך אלה, העומדים לפניך תמיד, השומעים את חכמתך!","ותתן למלך מאה ועשרים ככר זהב, ובשמים הרבה מאוד ואבן יקרה - לא בא עוד כבשם ההוא לרוב. ושלמה נתן למלכת שבא את כל חפצה אשר שאלה. ותפן ותלך לארצה - היא ועבדיה."],
lesson:"היא באה לנסות אותו - ויצאה עם ברכה. כשחכמה היא אמיתית, גם מי שבא לבחון יוצא מאושר. ותשמע: היא שמעה רק חצי. טוב אמיתי תמיד גדול יותר מהשמועות."},
{id:"11-6",n:71,title:"הלב שנסתה - שלמה בזקנותו",book:"מלכים א",chapters:"יא",ages:[11,13],holiday:"",topics:["שלמה","נשים נכריות","עונש","אלילים"],characters:["שלמה"],summary:"אלף נשים - והלב שהיה כלו שלם עם ה׳ מתחיל לסור",
body:["והמלך שלמה אהב נשים נכריות רבות - את בת פרעה, מואביות, עמוניות, אדומיות, צידוניות, חתיות. אלף נשים! ויהי לעת זקנת שלמה - נשיו הטו את לבבו אחרי א-להים אחרים. ולא היה לבבו שלם עם ה׳ כלבב דוד אביו. וילך שלמה אחרי עשתורת א-להי צידונים, ואחרי מלכום שקוץ עמונים. ויעש שלמה הרע בעיני ה׳.","וירא ה׳ אל ירבעם בן נבט, עבד שלמה - ונביא אחיה השילוני קורע את השמלה החדשה שעליו לשנים עשר קרעים, ואומר לירבעם: קח לך עשרה קרעים! כי כה אמר ה׳: הנני קורע את הממלכה מיד שלמה ונתתי לך את עשרת השבטים. והשבט האחד יהיה לו - למען דוד עבדי ולמען ירושלים.","כך גדולי ישראל נופלים: לא במלחמה - בלב. הלב של שלמה, שביקש להיות לב שומע, נסתה לאט לאט אחרי דברים זרים. והמלכות שנבנתה בחכמה - נקרעת אחרי מותו.","ושלמה מלך ארבעים שנה - וישכב שלמה עם אבותיו, ויקבר בעיר דוד אביו. וימלך רחבעם בנו תחתיו."],
lesson:"שלמה היה האיש החכם בעולם - ועדיין נפל. לא כי חכמה לא מספיקה, אלא כי חכמה בלי שמירה על הלב מתכרסמת. שומרים על הלב בכל יום, לא פעם אחת.",
note:"שלמה נמשך אחרי אלילי נשיו - סיפור עצוב על גדול שנפל. לילדים: גם אנשים חכמים צריכים לשמור על עצמם בכל יום."},
{id:"11-7",n:72,title:"המלכות נקרעת - רחבעם וירבעם",book:"מלכים א",chapters:"יב",ages:[5,11,13],holiday:"",topics:["רחבעם","ירבעם","קריעה","שבטים"],characters:["רחבעם","ירבעם","הזקנים","הילדים"],summary:"המלך הצעיר שומע לחברים במקום לזקנים - ועשרה שבטים הולכים לירבעם",
body:["רחבעם בן שלמה יורד לשכם להמלך, וכל ישראל באים. וירבעם בן נבט שב ממצרים - והעם אומר לרחבעם: אביך הקשה את עולנו, ואתה עתה הקל מעבודת אביך הקשה ומעולו הכבד אשר נתן עלינו - ונעבדך. ויאמר: לכו עוד שלושה ימים ושובו אלי.","ויוועץ המלך רחבעם את הזקנים - אנשי אביו. וזקנים אומרים: אם היום תהיה עבד לעם הזה ועבדתם, ועניתם ודיברת אליהם דברים טובים - והיו לך עבדים כל הימים. ויעזוב רחבעם את עצת הזקנים - ויוועץ את הילדים אשר גדלו אתו. והילדים אומרים: כה תאמר להם: קטני עבה ממתני אבי! ועתה אבי העמיס עליכם עול כבד, ואני אוסיף על עולכם; אבי יסר אתכם בשוטים, ואני איסר אתכם בעקרבים.","וביום השלישי העם בא - והמלך עונה את העם קשה, כעצת הילדים. ויראו כל ישראל כי לא שמע המלך אליהם - וישבו העם את המלך דבר: מה לנו חלק בדוד! לך לאהליך ישראל! עתה ראה ביתך, דוד! וילכו ישראל לאהליהם.","וכך נקרעת הממלכה לשניים: מלכות יהודה עם רחבעם בירושלים, ועשרת השבטים - מלכות ישראל עם ירבעם בשכם. קרע אחד שארך מאתיים שנה."],
lesson:"הזקנים אמרו: תהיה עבד לעם, ודבר דברים טובים. הילדים אמרו: תראה להם מי הבוס. רחבעם בחר את הכבוד - ואיבד ממלכה. ענווה נשמעת לפעמים כמו חולשה - אבל היא החוכמה האמיתית של מנהיג."}]},
{id:12,title:"אליהו ואלישע - נביאי האש",book:"מלכים א-ב",chapters:"",status:"ready",stories:[
{id:"12-1",n:73,title:"אליהו התשבי - לא טל ולא מטר",book:"מלכים א",chapters:"יז",ages:[5,11,13],holiday:"",topics:["אליהו","אחאב","עורבים","אלמנה","צרפת"],characters:["אליהו התשבי","אחאב","אלמנת צרפת"],summary:"נביא אחד מודיע למלך: לא יהיה טל ומטר כי אם לפי דברי - ועורבים מאכילים אותו",
body:["ימי אחאב ואיזבל - ישראל עובדים את הבעל, ואליהו התשבי נצב לפני המלך ואומר: חי ה׳ א-להי ישראל אשר עמדתי לפניו, אם יהיה השנים האלה טל ומטר - כי אם לפי דברי! וייסגר השמים.","וה׳ אומר לאליהו: לך לך מזה, והסתרת בנחל כרית אשר על פני הירדן. ואליהו שותה מן הנחל - והעורבים מביאים לו לחם ובשר בבוקר, ולחם ובשר בערב! עורבים, עופות טורפים, משרתים נביא.","וכאשר יבש הנחל - ה׳ שולח את אליהו לצרפת, אל אלמנה ענייה. אליהו אומר לה: עשי לי משם עוגה קטנה בראשונה והוצאת לי, ולך ולבנך תעשי באחרונה. ותאמר: חי ה׳, אין לי מעוג - כי אם מלא כף קמח בכד ומעט שמן בצפחת. ואליהו: כד הקמח לא תכלה, וצפחת השמן לא תחסר, עד יום נתן ה׳ מטר! ויהי כן - ימים רבים.","וכעבור זמן חולה בן האלמנה, עד אשר לא נותרה בו נשמה. ואליהו נושא אותו לעלייה, ויצעק אל ה׳ ויתמודד על הילד שלוש פעמים - ותשב נפש הילד על קרבו ויחי! ותאמר האשה: עתה זה ידעתי, כי איש א-להים אתה, ודבר ה׳ בפיך אמת."],
lesson:"אליהו סמך על הבטחה שאף אחד לא ראה - ונאכל בידי עורבים. אמונה היא לא לדעת איך זה יסתדר; אמונה היא ללכת עם מה שאתה יודע שנכון, ולתת לה׳ לדאוג לאיך."},
{id:"12-2",n:74,title:"הכרמל - ה׳ הוא הא-להים",book:"מלכים א",chapters:"יח",ages:[5,11,13],holiday:"",topics:["אליהו","הכרמל","בעל","אש מן השמים","אחאב"],characters:["אליהו","אחאב","עובדיהו","נביאי הבעל"],summary:"450 נביאי בעל צועקים בוקר עד צהרים - ואליהו מתפלל משפט אחד, ואש יורדת",
body:["בשנה השלישית לבצורת, אליהו נראה לאחאב. ואחאב קורא לו: העכר ישראל! ואליהו עונה: לא עכרתי את ישראל - כי אם אתה ובית אביך, בעזבכם את מצות ה׳ ותלך אחרי הבעלים. ועתה: קבוץ אלי את כל ישראל אל הר הכרמל, ואת נביאי הבעל ארבע מאות וחמישים.","ויקרב אליהו אל כל העם ויאמר: עד מתי אתם פוסחים על שתי הסעיפים? אם ה׳ הא-להים - לכו אחריו, ואם הבעל - לכו אחריו! ולא ענו העם אותו דבר.","והמבחן: שני פרים, שני מזבחות, בלי אש - הא-להים אשר יענה באש, הוא הא-להים. נביאי הבעל צועקים מבוקר עד צהרים: הבעל עננו! ואין קול ואין עונה. ואליהו מתלוצץ בהם: קראו בקול גדול - כי א-להים הוא! כי שיח וכי שיג לו, כי דרך לו, אולי ישן הוא ויתעורר!","ובעלות המנחה, אליהו מתקן את מזבח ה׳ ההרוס - שנים עשר אבנים כמספר שבטי יעקב. ויצוק מים על העולה ועל העצים, שלוש פעמים, עד שהתעלה מלאה מים. ואליהו מתפלל: ה׳ א-להי אברהם יצחק וישראל, היום יודע כי אתה א-להים בישראל ואני עבדך, ובדברך עשיתי את כל הדברים האלה. ענני ה׳ ענני - וידעו העם הזה כי אתה ה׳ הא-להים!","ותיפול אש ה׳, ותאכל את העולה ואת העצים ואת האבנים ואת העפר - ואת המים אשר בתעלה לחכה! וירא כל העם ויפלו על פניהם ויאמרו: ה׳ הוא הא-להים! ה׳ הוא הא-להים! ובאותו הערב - הרקיע השחירו עבים ורוח, ויהי מטר גדול."],
lesson:"אליהו לא צעק ולא כפה - הוא הציע מבחן הוגן ונתן לאמת לדבר. וכשהאמת נראתה, כולם ידעו. אמת לא צריכה הרבה מילים; היא צריכה רק להיראות.",
rashi:[{ref:"מלכים א יח, לט",quote:"ה׳ הוא האלהים - ולא הבעל האלהים.",explain:"רש״י מסביר מה בדיוק הכיר העם: לא רק שה׳ הוא א-להים - אלא שהבעל הוא לא. זו הכרה בשני הכיוונים."}]},
{id:"12-3",n:75,title:"קול דממה דקה",book:"מלכים א",chapters:"יט",ages:[5,11,13],holiday:"",topics:["אליהו","חורב","רוח","רעש","קול דממה דקה"],characters:["אליהו","איזבל"],summary:"אליהו בורח למדבר ומבקש למות - וה׳ מלמד אותו איפה הוא באמת נמצא",
body:["איזבל שולחת מלאך לאליהו: כה יעשון א-להים וכה יוסיפון, כי כעת מחר אשים את נפשך כנפש אחד מהם. ואליהו - שנצח בהר הכרמל - בורח למדבר באר שבע, וישב תחת רותם אחד, וישאל את נפשו למות: רב עתה ה׳, קח את נפשי! וישכב ויישן תחת רותם אחד.","ומלאך נוגע בו: קום אכול. והנה מרשאותיו עוגת רצפים וצפחת מים. פעמיים - ואז: קום אכול, כי רב ממך הדרך. וילך בכוח האכילה ההיא ארבעים יום וארבעים לילה עד הר הא-להים חורב.","ויבוא שם אל המערה וילן שם. והנה דבר ה׳ אליו: מה לך פה אליהו? ויאמר: קנוא קנאתי לה׳ - כי עזבו בריתך בני ישראל, ואת נביאיך הרגו בחרב, ואוותר אני לבדי, ויבקשו את נפשי לקחתה. ויאמר: צא ועמדת בהר לפני ה׳. והנה ה׳ עובר! ורוח גדולה וחזק מפרק הרים ומשבר סלעים לפני ה׳ - לא ברוח ה׳. ואחר הרוח רעש - לא ברעש ה׳. ואחר הרעש אש - לא באש ה׳. ואחר האש - קול דממה דקה.","ויהי כשמוע אליהו, וילט את פניו באדרתו, ויצא ויעמוד פתח המערה. והנה אליו קול: מה לך פה אליהו?","וה׳ לא בכועס אותו. הוא נותן לו שליחות חדשה: לך שוב לדרכך מדברה דמשק - ומשח מלכים, ואת אלישע בן שפט תמשח לנביא תחתיך. נביא לא מסתיים בתשובה; נביא מתחיל מחדש."],
lesson:"ה׳ לא ברוח הסוערת, לא ברעש ולא באש - אלא בקול דממה דקה. הדברים הכי אמיתיים מגיעים בשקט. צריך להשתיק את הרעש כדי לשמוע אותם."},
{id:"12-4",n:76,title:"כרם נבות - הרצחת וגם ירשת?",book:"מלכים א",chapters:"כא",ages:[11,13],holiday:"",topics:["נבות","אחאב","איזבל","כרם","צדק"],characters:["אחאב","איזבל","נבות היזרעאלי","אליהו"],summary:"המלך חומד כרם - והמלכה פותרת את הבעיה ברצח מסוכסך",
body:["נבות היזרעאלי היה לו כרם ביזרעאל, אצל היכל אחאב. ואחאב אומר לנבות: תנה לי את כרמך ויהי לי לגן ירק - ואתנה לך כרם טוב ממנו, או כסף. ונבות עונה: חלילה לי מה׳ מתתי את נחלת אבותי לך!","ויבוא אחאב אל ביתו סר וזעף, וישכב על מטתו, ויפן את פניו, ולא אכל לחם. ואיזבל אשתו באה: מה זה רוחך סרה? ותאמר לו: אתה, עתה תעשה מלוכה על ישראל? קום אכל לחם וייטב לבך - אני אתן לך את כרם נבות!","ותכתוב ספרים בשם אחאב ותחתום בחותמו, ותשלח אל הזקנים: קראו צום, והושיבו את נבות בראש העם, והושיבו שני אנשים בני בליעל נגדו - ויעידוהו: ברכת א-להים ומלך! והוציאוהו ויסקלוהו וימת. וכך נעשה: שני עדי שקר, צום מסוכסך, ונבות נסקל.","וישלח ה׳ את אליהו אל אחאב, כאשר ירד לרשת את הכרם. ויאמר: הרצחת וגם ירשת? ויאמר אליהו: במקום אשר לקקו הכלבים את דם נבות - ילקו הכלבים את דמך. ואחאב אומר: המצאתני איבי? ויען: מצאתי, יען התמכרך לעשות הרע בעיני ה׳.","וכאשר שמע אחאב את הדברים - ויקרע את בגדיו וישם שק על בשרו ויתעלל, וילך אט. ויהי דבר ה׳ אל אליהו: הראית כי נכנע אחאב מלפני? יען כי נכנע מפני - לא אביא הרעה בימיו.","אבל הכרם לא חזר, ונבות לא חזר - והעונש כבר חתום."],
lesson:"אחאב לא הרג בידיים - הוא רק לא אמר לא. ונבות שילם בחייו על כך שאמר אמת: נחלת אבותי לא למכירה. יש דברים שלא שווים שום כסף.",
note:"רצח נבות בעדים שקרים קשה מאוד - דגש על ערך האמת ועל אחריות של מי שיודע ושותק."},
{id:"12-5",n:77,title:"אליהו עולה בסופה - רכב אש",book:"מלכים ב",chapters:"ב",ages:[5,11,13],holiday:"",topics:["אליהו","אלישע","סופה","מרכבת אש","ירדן"],characters:["אליהו","אלישע"],summary:"אליהו לא מת - סופה מבדילה ביניהם, ומרכבת אש וסוסי אש",
body:["ויהי בהעלות ה׳ את אליהו בסערה השמימה. אליהו ואלישע הולכים מן הגלגל - ואליהו אומר לאלישע: שב נא פה. ואלישע: חי ה׳ וחי נפשך, אם אעזבך! וכך מגלגל לבית אל, מבית אל ליריחו - שלוש פעמים אלישע מסרב לעזוב. ובני הנביאים שואלים את אלישע: הידעת כי היום ה׳ לוקח את אדוניך מעל ראשך? ויאמר: גם אני ידעתי - החשו.","ובאו אל הירדן, וחמישים איש מבני הנביאים עומדים מנגד. ויקח אליהו את אדרתו ויגלום ויכה את המים - ויחצו הנה והנה, ויעברו שניהם בחרבה!","ויהי המה עוברים, ואליהו אומר: שאל מה אעשה לך בטרם אקח מעמך. ואלישע: ויהי נא פי שנים ברוחך אלי! ואליהו: הקשית לשאול. אם תראה אותי לוקח ממך - יהי לך כן.","ויהי המה הולכים הלוך ודבר - והנה רכב אש וסוסי אש! ויפרידו בין שניהם, ויעל אליהו בסערה השמימה. ואלישע רואה, והוא מצעק: אבי, אבי - רכב ישראל ופרשיו! ולא ראהו עוד. ויחזק בבגדיו ויקרעם לשנים קרעים.","וישא אלישע את אדרת אליהו אשר נפלה מעליו, ויכה את מי הירדן ויאמר: איה ה׳ א-להי אליהו? ויחצו המים - ויעבור אלישע. ויראו אותו בני הנביאים: נחה רוח אליהו על אלישע!","אליהו הנביא לא נקבר - ולכן מסורת ישראל מחכה לו עד היום."],
lesson:"אלישע ביקש פי שנים ברוחך - לא כוח כפול, אלא חלק כפול של רוח. הוא ידע שהוא לא יכול להיות אליהו - הוא צריך להיות אלישע, עם נשמה כפולה. וכשהגיע הרגע - הוא היה שם, מסרב לעזוב עד הסוף.",
rashi:[{ref:"מלכים ב ב, יב",quote:"אבי אבי רכב ישראל - רבי רבי דטב להון לישראל בצלותה מרתיכין ופרשין.",explain:"רש״י מביא את התרגום: אליהו נקרא רכב ישראל ופרשיו - כי בתפילתו הוא הועיל לישראל יותר ממרכבות ופרשים. נביא אחד בתפילה שווה צבא."}]},
{id:"12-6",n:78,title:"השונמית - עלייה קטנה בבית",book:"מלכים ב",chapters:"ד",ages:[5,11,13],holiday:"",topics:["אלישע","השונמית","ניסים","חסד"],characters:["אלישע","השונמית","גיחזי"],summary:"אשה גדולה בונה עלייה לנביא - והיא מתוגמלת בבן",
body:["ואשה אחת גדולה בשונם, ותחזק באלישע לאכול לחם בכל פעם שהוא עובר. ותאמר אל אישה: הנה נא ידעתי כי איש א-להים קדוש הוא, עובר עלינו תמיד. נעשה נא עליית קיר קטנה, ונשים לו שם מטה ושלחן וכסא ומנורה - והיה בבואו אלינו יסור שמה.","ביום אחד אלישע בא ויסר לעלייה. ויאמר אליה: מה לעשות לך? היש לדבר לך אל המלך או אל שר הצבא? ותאמר: בתוך עמי אנכי יושבת. אין לה צרכים. וגיחזי אומר לאלישע: אין לה בן, ואישה זקן. ואלישע אומר לה: לעת חיה כעת השנה - את חובקת בן! ותאמר: אל אדוני איש הא-להים, אל תכזב בשפחתך.","והאשה הרת ותלד בן - כאשר דיבר אליה אלישע. ויגדל הילד. ויום אחד יוצא אל אביו אל הקוצרים, ויאמר: ראשי, ראשי! ונושאים אותו לאמו, וישב על ברכיה עד הצהרים - וימת.","והיא עולה ותשכיבהו על מטת איש הא-להים, ותסגור בעדו - ותצא. ותרכב על האתון ותרוץ הר הכרמל, ותפול על רגלי אלישע. ואלישע חוזר שונם, עולה לעלייה, וישכב על הילד - ויפש גו הילד, ויגזר הילד עד שבע פעמים, ויפקח הילד את עיניו! ואלישע קורא לשונמית: שאי את בנך. ותבוא ותפל לרגליו ותשתחו ארצה - ותשא את בנה ותצא."],
lesson:"היא בנתה עלייה קטנה בלי לבקש כלום - כי הכרה קדושה. והקדושה החזירה לה בן, ואז את הבן עצמו. חסד שאין לו תנאי הוא מה שמזמין ניסים."},
{id:"12-7",n:79,title:"נעמן - שבע פעמים בירדן",book:"מלכים ב",chapters:"ה",ages:[5,11,13],holiday:"",topics:["נעמן","אלישע","צרעת","ירדן","נערה"],characters:["נעמן","אלישע","הנערה הישראלית","גיחזי"],summary:"שר צבא ארם, מצורע - ונערה ישראלית קטנה מצילה אותו",
body:["ונעמן שר צבא מלך ארם היה איש גדול לפני אדוניו ונשוא פנים - כי בו נתן ה׳ תשועה לארם. והאיש היה גיבור חיל - מצורע.","ובמלחמה שבו מישראל נערה קטנה - והיא משרתת את אשת נעמן. והנערה הקטנה הזאת אומרת לגבירתה: אחלי אדוני אל הנביא אשר בשומרון - אז יאסף אותו מצרעתו! מילה אחת של ילדה משביה - ושר הצבא נוסע לישראל.","ונעמן בא עם סוסיו ורכבו ועשרה ככרי כסף וששת אלפים שקלי זהב. ואלישע לא יוצא אליו - הוא שולח מלאך: לך ורחצת שבע פעמים בירדן, וישוב בשרך לך וטהר! ונעמן כועס: הנה אמרתי אלי יצא הנביא ועמד וקרא בשם ה׳, ותנועף ידו אל המקום ואסף המצורע! הלא טובים אבנה ופרפר נהרות דמשק מכל מי ישראל? ויפן וילך בחמה.","ועבדיו מתקרבים: אבי, דבר גדול הנביא דבר אליך - הלוא תעשה? ואף כי אמר אליך רחץ וטהר? וירד ויטבול בירדן שבע פעמים כדבר איש הא-להים - וישוב בשרו כבשר נער קטן, ויטהר!","ונעמן חוזר אל אלישע עם כל מחנהו ועומד לפניו: הנה נא ידעתי כי אין א-להים בכל הארץ כי אם בישראל! ומבקש לתת ברכה - ואלישע מסרב לקחת. ונעמן לוקח משא צמד פרדים אדמה - כי לא יעשה עוד עולה וזבח לא-להים אחרים, כי אם לה׳."],
lesson:"הגאווה של נעמן כמעט מנעה את הרפואה - הוא רצה טקס גדול, לא טבילה פשוטה. ועבדיו לימדו אותו: דבר גדול - אם היה מבקש, היית עושה? לפעמים התשובה פשוטה מדי בשביל הגאווה שלנו.",
rashi:[{ref:"מלכים ב ה, יא",quote:"הנה אמרתי - סבור הייתי, אלי יצא הנביא וידבר עמי ויראה את החלי.",explain:"רש״י מסביר את כעסו של נעמן: הוא ציפה שהנביא יבוא אליו ויתייחס למחלה בטקס מפואר. הנביא עשה הפוך - פשטות שממחישה מי באמת מרפא."}]}]},
{id:13,title:"חורבן, גלות ותקוה",book:"מלכים ב - יחזקאל",chapters:"",status:"ready",stories:[
{id:"13-1",n:80,title:"הספר שנמצא - יאשיהו",book:"מלכים ב",chapters:"כב-כג",ages:[5,11,13],holiday:"",topics:["יאשיהו","חלקיהו","ספר התורה","תשובה"],characters:["יאשיהו","חלקיה הכהן","שפן הסופר","חולדה הנביאה"],summary:"ילד בן שמונה ממלך - ובימיו מוצאים בבית ה׳ ספר שהיה טמון",
body:["יאשיהו בן שמונה שנה במלכו - וישלושים ואחת שנה מלך בירושלים. ויעש הישר בעיני ה׳, וילך בכל דרך דוד אביו, ולא סר ימין ושמאל.","ובשנה השמונה עשרה למלכותו, הוא שולח לתקן את בית ה׳ שהתפורר. וחלקיה הכהן הגדול מוצא בתוך הבית - ספר תורת ה׳! ספר שהיה טמון שנים, כי מלכים רשעים שרפו את התורה. ויקראהו שפן הסופר לפני המלך.","ויהי כשמוע המלך את דברי ספר התורה - ויקרע את בגדיו. הבן בן השמונה עשרה בוכה: הלכנו לאן? ושולח את חלקיהו ואת שריו: דרשו את ה׳ בעדי ובעד העם!","והם באים אל חולדה הנביאה - אשת טובת שכל היושבת בירושלים במשנה. וחולדה אומרת: כן, כל הרעה כתובה בספר - אבל לך, יאשיהו, אומר ה׳: יען רך לבבך ותכנע מפני ה׳, ותקרע את בגדיך ותבכה לפני - גם אני שמעתי, נאום ה׳. לא תראה עיניך בכל הרעה.","ויאשיהו כונס את כל העם - קטן וגדול - ויקרא באזניהם את כל דברי הספר. ויעמוד המלך על העמוד ויכרת את הברית: ללכת אחרי ה׳ ולשמור את מצותיו. ויעמודו כל העם בברית. ועושים את הפסח הגדול - כי לא נעשה כפסח הזה מימי השופטים!"],
lesson:"הספר היה טמון, אבל לא אבוד. וכשהמלך שמע - הוא לא אמר אני בן שמונה עשרה, מי אני. הוא קרע את בגדיו ושינה. תשובה מתחילה מלהקשיב למה שכבר נמצא בבית.",
rashi:[{ref:"מלכים ב כב, ח",quote:"ספר התורה מצאתי - טמון תחת הנדבך, שהטמינו שם כששרף אחז את התורה.",explain:"רש״י מסביר איפה הספר היה כל השנים: הכהנים הטמינו אותו מתחת לנדבך בבית ה׳, כי המלך אחז שרף ספרי תורה. הם הצילו אותו - וחיכו למלך שיחפש."}]},
{id:"13-2",n:81,title:"החורבן - העיר בוערת",book:"מלכים ב",chapters:"כה",ages:[11,13],holiday:"",topics:["חורבן","ירושלים","בבל","צדקיהו","גלות"],characters:["צדקיהו","נבוכדנאצר","נבוזראדן"],summary:"אחרי 410 שנים - הבית ששלמה בנה עולה באש, והעם יורד לבבל",
body:["בשנה התשיעית לצדקיהו בא נבוכדנאצר מלך בבל על ירושלים - והעיר נצורה שנה וחצי. הרעב בעיר גדל עד שלא היה לחם. וצדקיהו בורח בלילה דרך גן המלך - ויחסו חיל כשדים אחריו ויתפסוהו בערבות יריחו. ואת בני צדקיהו שחטו לעיניו, ואת עיני צדקיהו עיוור - ויקשרהו בנחושתים ויביאהו בבל.","ובחודש החמישי, בט׳ באב, בא נבוזראדן רב טבחים אל ירושלים - וישרף את בית ה׳ ואת בית המלך, ואת כל בתי ירושלים ואת כל בית גדול שרף באש. ואת חומות ירושלים סביב נתצו כל חיל כשדים. ואת יתר העם הגלה נבוזראדן בבל.","והם הלכו בגלות - שבעים שנה, כאשר ניבא ירמיהו. ירושלים שוממה, המקדש שרוף, העם פזור.","אבל שימו לב לסוף הספר: ויהי בשלושים ושבע שנה לגלות יהויכין מלך יהודה - וישא אויל מרודך מלך בבל את ראש יהויכין מבית הכלא, וידבר אתו טובות, ויתן את כסאו מעל כסא המלכים. גם בבבל, גם בגלות - הזרע של דוד לא נכחד."],
lesson:"החורבן הוא הסוף הכי כואב בתנ״ך - ועדיין הספר נגמר בחסד קטן למלך בכלא. ישראל לא נגמר בט׳ באב. גם כשהכול בוער - משהו נשאר לבנות ממנו.",
note:"סיפור החורבן קשה - ילדים של צדקיהו, עיוורון, שריפה. התמקדו ברקע ובמסר של אובדן ותקוה, בלי הפרטים הקשים ביותר.",
rashi:[{ref:"מלכים ב כה, ט",quote:"ואת כל בית גדול - בתי כנסיות שמגדלין בהן תורה ותפלה ובתי השרים.",explain:"רש״י מסביר מהו בית גדול: בתי כנסיות ובתי מדרשות - המקומות שבהם מגדלים תורה ותפילה נשרפו גם הם. החורבן פגע בלב הלב של העם."}]},
{id:"13-3",n:82,title:"יונה בדג - מי בורח מה׳?",book:"יונה",chapters:"א-ד",ages:[5,11,13],holiday:"יום כיפור",topics:["יונה","נינוה","דג","תשובה"],characters:["יונה בן אמתי","אנשי נינוה","המלחים"],summary:"נביא שבורח מן השליחות - ומגלה שאי אפשר לברוח ממי שהים והיבשה שלו",
body:["ויהי דבר ה׳ אל יונה בן אמתי: קום לך אל נינוה העיר הגדולה - וקרא עליה, כי עלתה רעתם לפני. ויקם יונה לברוח תרשישה מלפני ה׳! וירד יפו וימצא אניה.","וה׳ הטיל רוח גדולה אל הים - וסער גדול בים, והאניה כמעט נשברה. המלחים זורקים את הכלים לים, יורדים בגורלות - והגורל נופל על יונה. ויונה אומר: שאו אותי והטילוני אל הים, והים ישקט! ויטילוהו - ויעמוד הים מזעפו.","וימן ה׳ דג גדול לבלוע את יונה - ויהי יונה במעי הדג שלושה ימים ושלושה לילות. ושם, מבטן הדגה, יונה מתפלל: קראתי ממצוקה לי אל ה׳ ויענני! מבטן שאול שיוועתי - שמעת קולי! ויאמר ה׳ לדג - ויקא את יונה אל היבשה.","וה׳ שולח את יונה שנית - והפעם הוא הולך. ויקרא בנינוה: עוד ארבעים יום ונינוה נהפכת! ויאמינו אנשי נינוה בא-להים, ויכריזו צום וילבשו שקים - מגדולם ועד קטנם. והמלך קם מכסאו, מכסה שק, ומכריז: איש לא יטעם מאומה! וירא הא-להים את מעשיהם, כי שבו מדרכם הרעה - וינחם ולא עשה.","ויונה - מרע לו רעה גדולה. הוא רצה דין, וה׳ בחר רחמים. ויושב יונה מקדם לעיר ועושה לו סוכה, וה׳ ממנה קיקיון שיתן צל על ראשו. ובבוקר התולעת הכתה את הקיקיון - וייבש. ויונה מתעלף ומבקש למות. ויאמר ה׳: אתה חסת על הקיקיון אשר לא עמלת בו ולא גדלתו - ואני לא אחוס על נינוה העיר הגדולה, אשר יש בה הרבה משנים עשר ריבו אדם אשר לא ידע בין ימינו לשמאלו, ובהמה רבה?","והספר נגמר בשאלה - בלי תשובה. כי התשובה היא שלנו."],
lesson:"יונה למד שני לקחות: אי אפשר לברוח ממקום, כי ה׳ בכל מקום - ואי אפשר להחליט שה׳ יעשה רק מה שאנחנו חושבים. רחמיו גדולים יותר מהדין שלנו. ביום כיפור קוראים את יונה - כי תשובה של עיר שלמה מוכיחה שתמיד אפשר לחזור.",
rashi:[{ref:"יונה א, ג",quote:"לברח תרשישה - ים ששמו תרשיש, והוא בחוצה לארץ. אמר: אברח לי הים, שאין השכינה שורה בחוץ לארץ.",explain:"רש״י מסביר את תוכנית יונה: הוא חשב שאם יברח לים, מחוץ לארץ ישראל - השכינה לא תשכון שם והוא ישתחרר. ואז גילה שה׳ שולט גם בים."}]},
{id:"13-4",n:83,title:"דניאל בגוב האריות",book:"דניאל",chapters:"ו",ages:[5,11,13],holiday:"",topics:["דניאל","אריות","דריווש","תפילה","בבל"],characters:["דניאל","דריווש מלך מדי"],summary:"שליט זקן מתפלל כנגד חוק המלך - ומושלך לאריות, והם עושים נעים",
body:["דניאל, שנשבה ילד לבבל, נמצא מצליח בעבודת המלך דריווש - עד שהמלך מעמיד אותו על כל המלכות. והסרכים והאחשדרפנים מקנאים: לא נמצא עליו שום עלילה - אם לא נמצא עליו בדתה די א-להה! והם משיגים חוק: כל אשר יבעה בעו מן כל אלה ואנשה עד יומין תלתין, לתוך מלכא - ירמו לגוב אריות.","ודניאל, כד ידע ליה דא רשים כתבא - על לביתה. וכוין פתיחן ליה בביתו, כנגד ירושלם. וברך על ברכוהי תלת זמנין ביומא, ומצלא ומודא קדם א-להה - כל קביל די הוה עבד מן קדמת דנא. לא שינה כלום: שלוש פעמים ביום, חלונות פתוחים לירושלים.","והאנשים תופסים אותו מתפלל - ומביאים למלך. דריווש שבור: הוא אוהב את דניאל, אבל חוק מדי ופרס לא עובר. עד שמשא הוי מלכא משתדר להשיזבותה לדניאל - ואין פתרון. וירמו לגוב אריות. והמלך אומר: א-להך די את פלח ליה בכל יומא, הוא ישיזבנך! והביאו אבן גדולה ושמו על פי הגוב - והמלך הלך לארמונו ולא ישן ולא אכל.","ובשחר היום המלך רץ לגוב וצועק בקול עציב: דניאל עבד א-להא חייא! הישכל א-להך די את פלח ליה בכל יומא להשיזבותך מן אריות? ודניאל עונה: מלכא, לעלמין חיי! א-להי שלח מלאכה וסגר פם אריות - ולא חבלונני, כל קבל די קדמוהי זכות השתכחת לי! ומהר מאוד המלך וצוה להעלותו מן הגוב - וכל שבל לא השתכחת ביה.","והאנשים שהאכילו את דניאל בדברי שקר - הושלכו לגוב עם בניהם ונשיהם, והאריות שלטו בהם. ודריווש כותב כתב לכל העמים: שלמכם ישגא! מן קדמי שמים טעם... די יהב חיזו ותמהי בשמיא ובארעא, די שיזיב לדניאל מן יד אריות!"],
lesson:"דניאל ידע שהחוק חתום - ועם זה פתח את החלון כרגיל. לא להתריס, לא להתחבא - פשוט להמשיך להיות מי שהוא. האריות סגרו את הפה כי דניאל לא שינה שום דבר, גם כשהמחיר היה חייו."},
{id:"13-5",n:84,title:"השיבה לציון - עזרא ונחמיה",book:"עזרא-נחמיה",chapters:"",ages:[5,11,13],holiday:"",topics:["עזרא","נחמיה","כורש","בית שני","חומה"],characters:["כורש מלך פרס","זרובבל","עזרא הסופר","נחמיה"],summary:"שבעים שנה אחרי החורבן - כורש מכריז: מי בכם מכל עמו, יעל",
body:["ובשנת אחת לכורש מלך פרס, לכלות דבר ה׳ בפי ירמיהו - העיר ה׳ את רוח כורש מלך פרס, ויעביר קול בכל מלכותו: כה אמר כורש מלך פרס, כל ממלכות הארץ נתן לי ה׳ א-להי השמים, והוא פקד עלי לבנות לו בית בירושלים. מי בכם מכל עמו - יהי א-להיו עמו, ויעל!","ויעלו מבבל ארבעים ושניים אלף, עם זרובבל וישוע הכהן. ובשנה השנייה לבואם - יסדו את בית הא-להים. וכאשר יסדו היכל ה׳ - העם מריעים בתרועה גדולה, ואחרים בוכים בקול גדול: הזקנים שראו את הבית הראשון בו ביסדו בית זה, בוכים - והשמחה והבכי מתערבים, ולא מכירים קול תרועת שמחה מקול בכי.","ועזרא הסופר, ידו טובה בתורת ה׳, עולה עם גלות שניה. כי הכין לבבו לדרוש את תורת ה׳ ולעשות - וללמד בישראל חוק ומשפט. ונחמיה, משקה המלך, שומע שחומת ירושלים מפרצת ושעריה נצתו באש - וישב ואבכה ואתאבל ימים, ואצום ואתפלל. ויבוא אל ארתחשסתא המלך - והמלך רואה שהוא רע פנים, ושואל. ונחמיה מתפלל בלחש לא-להי השמים - ועונה למלך: אם על המלך טוב, תשלחני אל יהודה לבנותה.","ונחמיה בונה את החומה בחמישים ושניים יום - עם חרב ביד אחת וכלי בנייה בשנייה, כי האויבים סביב. וכל העם קורא את ספר התורה בראש חודש שביעי, ועומדים על רגליהם בבוקר - ועזרא פותח את הספר לעיני כל העם."],
lesson:"הזקנים בכו כשהבית השני נוסד - כי ראו את הראשון. אבל הבכי לא עצר את הבנייה. בונים את מה שאפשר היום, גם אם זוכרים גדול יותר מאתמול. ונחמיה? הוא התפלל בלחש לפני שענה למלך - תפילה קטנה בין שאלה לתשובה."},
{id:"13-6",n:85,title:"אסתר - ומי יודע אם לעת כזאת",book:"אסתר",chapters:"",ages:[5,11,13],holiday:"פורים",topics:["אסתר","מרדכי","המן","פורים","שושן"],summary:"יתומה מבית המלך - וביום שכל ישראל נידון למות, היא נכנסת בלי רשות",
body:["בשושן הבירה, מלכות אחשוורוש. ושתי המלכה מורדת - ואחשוורוש מחפש מלכה חדשה. ואסתר, יתומה מי הדסה, גדלה בבית דודה מרדכי היהודי - נלקחת לבית המלך, ותשא חן בעיני כל רואיה. והמלך אוהב את אסתר מכל הנשים - וישם כתר מלכות בראשה. אבל אסתר לא מגידה את עמה ואת מולדתה - כי מרדכי ציווה עליה.","והמן האגגי מתמנה לשר העליון - ומרדכי לא כורע לו, כי יהודי הוא. והמן מתמלא חמה: לא לפגוע במרדכי לבדו - אלא להשמיד את כל היהודים, מנער ועד זקן, טף ונשים, ביום אחד! ויפיל פורים - והפור נופל על י״ג באדר. והחוק נחתם בטבעת המלך.","ומרדכי שולח לאסתר: לכי אל המלך להתחנן לו על עמה. ואסתר מזכירה את הסכנה: כל איש ואשה אשר יבוא אל המלך אל החצר הפנימית אשר לא יקרא - אחת דתו להמית, לבד מאשר יושיט לו המלך את שרביט הזהב! ואני לא נקראתי לבוא אל המלך זה שלושים יום. ומרדכי עונה את התשובה המפורסמת: אל תדמי בנפשך להמלט בית המלך מכל היהודים! כי אם החרש תחרישי בעת הזאת - רוח והצלה יעמוד ליהודים ממקום אחר, ואת ובית אביך תאבדו. ומי יודע אם לעת כזאת הגעת למלכות?","ותשיב אסתר אל מרדכי: לך כנוס את כל היהודים הנמצאים בשושן, וצומו עלי ואל תאכלו ואל תשתו שלושת ימים לילה ויום; גם אני ונערותי אצום כן - ובכן אבוא אל המלך אשר לא כדת, וכאשר אבדתי - אבדתי.","וביום השלישי תלבש אסתר מלכות, ותעמוד בחצר הפנימי - והמלך יושב על כסאו. ויהי כראות המלך את אסתר - ותשא חן בעיניו, ויושט לה המלך את שרביט הזהב. ואסתר מזמינה את המלך ואת המן למשתה - ובמשתה השני חושפת: איש צר ואויב, המן הרע הזה! ויתלהו על העץ אשר הכין למרדכי.","והיהודים ניצלו - ונעשה הפוך מן האויבים. וקימו וקבלו עליהם את ימי הפורים - משתה ושמחה ומשלוח מנות איש לרעהו ומתנות לאביונים, לדור ודור."],
lesson:"אסתר יכלה לשמור את הסוד ולהישאר בטוחה בבית המלך. מרדכי הראה לה שדווקא המקום שלה - זו הסיבה שהיא שם. ומי יודע אם לעת כזאת הגעת למלכות? כל אחד מאיתנו הגיע למקום שלו לעת מסוימת.",
rashi:[{ref:"אסתר ד, יד",quote:"ומי יודע אם לעת כזאת הגעת למלכות - ומי יודע אם יחפץ בך המלך לשנה הבאה שהוא זמן ההרגה.",explain:"רש״י מסביר את הדקות במילות מרדכי: אסתר אמרה שהיא לא נקראה שלושים יום - אז מי יודע אם המלך עוד יחפוץ בה בשנה הבאה, זמן ההרגה? דווקא עכשיו היא צריכה לפעול."}]},
{id:"13-7",n:86,title:"עצמות יבשות - הנבואה האחרונה של התקוה",book:"יחזקאל",chapters:"לז",ages:[5,11,13],holiday:"",topics:["יחזקאל","עצמות יבשות","תחיה","תקוה"],characters:["יחזקאל"],summary:"נביא בבבל נלקח ברוח לבקעה מלאה עצמות - ונשאל: התחיינה העצמות האלה?",

var t=$("typing");if(t)t.remove();renderChat();if(chatLog.length)maybeSpeakAnswer(chatLog[chatLog.length-1].text)}
function toggleSettings(){var s=$("chatsettings");s.hidden=!s.hidden;if(s.hidden)return;
var p=provider();var key=activeKey();
var h='<b>שיחה חכמה בשפה טבעית מלאה</b><br>בחרו שירות והזינו מפתח. האפליקציה שומרת את המפתח באחסון המקומי של הדפדפן במכשיר הזה, ושולחת אותו רק בבקשות לשירות ה-AI שבחרתם.<div class="row"><button onclick="setProvider(\'gemini\')"'+(p==="gemini"?' style="font-weight:700"':'')+'>Gemini - חינם ✨</button><button onclick="setProvider(\'openai\')"'+(p==="openai"?' style="font-weight:700"':'')+'>OpenAI</button></div>';
if(p==="gemini")h+='<div style="margin-top:6px">איך משיגים מפתח Gemini חינמי (דקה, בלי כרטיס אשראי): נכנסים ל-<b>aistudio.google.com</b>, מתחברים עם חשבון Google, לוחצים Get API key ואז Create API key - ומדביקים כאן. המכסה החינמית משתנה מדי פעם לפי המודל (המספר המדויק מופיע ב-AI Studio). אם היא נגמרת, האפליקציה עוברת אוטומטית למודל חינמי אחר - והחיפוש החכם באפליקציה תמיד עובד בלי מפתח. שאלה קולית שמתומללת דרך הענן צורכת חלק קטן מהמכסה (אודיו נספר כטוקנים).</div>';
else h+='<div style="margin-top:6px">מפתח OpenAI (gpt-4o-mini) - בתשלום זעיר של שברי סנט לשאלה, יורד מהחשבון שלכם.</div>';
h+='<div class="row" style="margin-top:6px"><button onclick="runMicDiag()">🎤 בדיקת מיקרופון</button></div><input id="oaikey" type="password" placeholder="'+(p==="gemini"?"מפתח Gemini (AIza...)":"מפתח OpenAI (sk-...)")+'" autocomplete="off"><div class="row"><button onclick="saveKey()">שמירה</button><button onclick="clearKey()">מחיקת מפתח</button></div>';
s.innerHTML=h;var ki=$("oaikey");if(ki)ki.value=key?"••••••••":""}
function setProvider(p){localStorage.setItem("ts_llm_provider",p);var s=$("chatsettings");s.hidden=true;toggleSettings();renderChat()}
function saveKey(){var v=$("oaikey").value.trim();if(v&&v!=="••••••••"){localStorage.setItem(provider()==="gemini"?"ts_gemini_key":"ts_openai_key",v);$("oaikey").value="••••••••"}renderChat()}
function clearKey(){localStorage.removeItem(provider()==="gemini"?"ts_gemini_key":"ts_openai_key");$("oaikey").value="";renderChat()}
